<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LifePlay</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --accent:#3fb950; --accent2:#58a6ff;
    --danger:#f85149; --warn:#d29922; --text:#e6edf3; --sub:#8b949e; --border:#30363d;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);}
  #phone{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow-x:hidden;}
  .hidden{display:none !important;}
  /* Loading */
  #screen-loading{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#0d1117,#1a2233);}
  #screen-loading h1{font-size:2.4em;letter-spacing:2px;margin-bottom:6px;background:linear-gradient(90deg,#3fb950,#58a6ff);-webkit-background-clip:text;background-clip:text;color:transparent;}
  #screen-loading p{color:var(--sub);margin-top:0;}
  .loadbar-track{width:70%;height:10px;background:var(--panel2);border-radius:6px;overflow:hidden;margin-top:30px;}
  .loadbar-fill{height:100%;width:0%;background:linear-gradient(90deg,#3fb950,#58a6ff);transition:width .1s linear;}
  #loading-tip{margin-top:14px;font-size:.8em;color:var(--sub);text-align:center;padding:0 20px;}
  /* New life */
  #screen-newlife{padding:24px 20px;display:flex;flex-direction:column;gap:14px;min-height:100vh;}
  #screen-newlife h2{text-align:center;margin-bottom:0;}
  .field label{display:block;font-size:.8em;color:var(--sub);margin-bottom:4px;}
  .field input, .field select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:1em;}
  .btn{padding:12px 16px;border-radius:12px;border:none;background:var(--panel2);color:var(--text);font-size:1em;cursor:pointer;text-align:center;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:linear-gradient(90deg,#3fb950,#2ea043);color:#04140a;font-weight:700;}
  .btn-danger{background:linear-gradient(90deg,#f85149,#da3633);color:#fff;font-weight:700;}
  .btn-accent{background:linear-gradient(90deg,#58a6ff,#388bfd);color:#04101f;font-weight:700;}
  .btn-block{width:100%;}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}
  /* Game screen */
  #screen-game{display:flex;flex-direction:column;height:100vh;}
  #header{padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--border);}
  #header .who{display:flex;align-items:center;gap:10px;}
  #header .avatar{font-size:2em;}
  #header .who-info{flex:1;}
  #header .who-info b{font-size:1.05em;}
  #header .who-info span{display:block;font-size:.75em;color:var(--sub);}
  #header .money{font-weight:700;color:var(--accent);}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;}
  .stat{font-size:.72em;}
  .stat .lbl{display:flex;justify-content:space-between;color:var(--sub);margin-bottom:2px;}
  .stat .bar{height:6px;border-radius:4px;background:#0d1117;overflow:hidden;}
  .stat .bar i{display:block;height:100%;border-radius:4px;}
  #log{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column-reverse;gap:8px;}
  .logline{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:.88em;line-height:1.35;}
  .logline .age{color:var(--sub);font-size:.75em;display:block;margin-bottom:2px;}
  .logline.good{border-left:3px solid var(--accent);}
  .logline.bad{border-left:3px solid var(--danger);}
  .logline.neutral{border-left:3px solid var(--accent2);}
  .newspaper{background:#f4ecd8;color:#1a1a1a;border:2px solid #2b2b2b;border-radius:4px;padding:12px 14px;font-family:Georgia,'Times New Roman',serif;}
  .newspaper .np-name{font-size:.65em;letter-spacing:3px;text-transform:uppercase;text-align:center;border-bottom:2px solid #1a1a1a;border-top:2px solid #1a1a1a;padding:3px 0;margin-bottom:6px;}
  .newspaper h3{margin:0 0 4px;font-size:1.15em;text-align:center;line-height:1.2;}
  .newspaper p{margin:0;font-size:.78em;text-align:center;font-style:italic;}
  #bottomnav{display:grid;grid-template-columns:repeat(6,1fr);background:var(--panel);border-top:1px solid var(--border);}
  #bottomnav button{background:none;border:none;color:var(--sub);padding:8px 2px;font-size:.65em;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;}
  #bottomnav button .ic{font-size:1.35em;}
  #bottomnav button.active{color:var(--accent2);}
  #ageup-btn{position:sticky;bottom:0;margin:0;border-radius:0;padding:14px;}
  /* Panel / modal */
  #panel-overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:50;}
  #panel{background:var(--bg);width:100%;max-height:82vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;}
  #panel-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  #panel-head h3{margin:0;}
  #panel-body{padding:14px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;}
  .close-x{background:none;border:none;color:var(--sub);font-size:1.3em;cursor:pointer;}
  .list-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .list-item .li-main b{display:block;}
  .list-item .li-main span{font-size:.78em;color:var(--sub);}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.68em;background:var(--panel2);color:var(--sub);}
  #modal-overlay{position:absolute;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;}
  #modal-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px;max-width:360px;width:100%;max-height:85vh;overflow-y:auto;}
  #modal-card h3{margin-top:0;}
  #modal-card .choices{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  /* Death screen */
  #screen-dead{padding:24px 20px;text-align:center;min-height:100vh;background:radial-gradient(circle at top,#1a1010,#000);display:flex;flex-direction:column;gap:12px;}
  #screen-dead h1{color:var(--danger);}
  .legacy-badge{font-size:3em;font-weight:800;margin:6px 0 0;}
  .legacy-grade{font-size:1em;color:var(--sub);}
  ::-webkit-scrollbar{width:6px;} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
</style>
</head>
<body>
<div id="phone">

  <div id="screen-loading">
    <h1>LifePlay</h1>
    <p>a life simulator</p>
    <div class="loadbar-track"><div class="loadbar-fill" id="loadbar-fill"></div></div>
    <div id="loading-tip">Loading...</div>
  </div>

  <div id="screen-newlife" class="hidden">
    <h2>New Life</h2>
    <div class="field">
      <label>First Name</label>
      <input id="nl-first" type="text" placeholder="Random">
    </div>
    <div class="field">
      <label>Last Name</label>
      <input id="nl-last" type="text" placeholder="Random">
    </div>
    <div class="field">
      <label>Gender</label>
      <select id="nl-gender">
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Nonbinary">Nonbinary</option>
      </select>
    </div>
    <div class="field">
      <label>City</label>
      <select id="nl-city"></select>
    </div>
    <button class="btn btn-primary btn-block" id="nl-start" style="margin-top:10px;">Start Life</button>
  </div>

  <div id="screen-game" class="hidden">
    <div id="header">
      <div class="who">
        <div class="avatar" id="hd-avatar">👶</div>
        <div class="who-info">
          <b id="hd-name">-</b>
          <span id="hd-sub">-</span>
        </div>
        <div class="money" id="hd-money">$0</div>
      </div>
      <div class="stats" id="hd-stats"></div>
    </div>
    <div id="log"></div>
    <button class="btn btn-primary" id="ageup-btn">🎂 Age Up</button>
    <div id="bottomnav">
      <button data-panel="career"><span class="ic">💼</span>Career</button>
      <button data-panel="assets"><span class="ic">💰</span>Assets</button>
      <button data-panel="relationships"><span class="ic">❤️</span>People</button>
      <button data-panel="activities"><span class="ic">🎲</span>Activities</button>
      <button data-panel="world"><span class="ic">🌍</span>World</button>
      <button data-panel="profile"><span class="ic">👤</span>Profile</button>
    </div>
  </div>

  <div id="screen-dead" class="hidden"></div>

  <div id="panel-overlay" class="hidden">
    <div id="panel">
      <div id="panel-head"><h3 id="panel-title">Panel</h3><button class="close-x" id="panel-close">✕</button></div>
      <div id="panel-body"></div>
    </div>
  </div>

  <div id="modal-overlay" class="hidden">
    <div id="modal-card"></div>
  </div>

</div>
<script>
'use strict';
/* =========================================================================
   LIFEPLAY — single file life simulator
   ========================================================================= */

/* ============================ UTILITIES ================================ */
function $(id){ return document.getElementById(id); }
function rand(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[rand(0,arr.length-1)]; }
function chance(pct){ return Math.random()*100 < pct; }
function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
function fmtMoney(n){
  n = Math.round(n);
  const neg = n<0; n = Math.abs(n);
  let s = n.toLocaleString('en-US');
  return (neg?'-$':'$')+s;
}
function uid(){ return 'id'+Math.random().toString(36).slice(2,10); }

/* ============================ DATA: STATIC =============================== */
const CITIES = ["New York","Los Angeles","Chicago","Houston","Miami","Las Vegas","Seattle","Boston",
  "Austin","Denver","Atlanta","Nashville","Phoenix","Portland","New Orleans","San Francisco"];

const MALE_FIRST = ["James","John","Robert","Michael","David","William","Richard","Joseph","Thomas","Charles",
  "Daniel","Matthew","Anthony","Mark","Andrew","Joshua","Kevin","Brian","Tyler","Jordan"];
const FEMALE_FIRST = ["Mary","Patricia","Jennifer","Linda","Elizabeth","Barbara","Susan","Jessica","Sarah","Karen",
  "Lisa","Nancy","Emily","Amanda","Ashley","Megan","Olivia","Sophia","Ava","Mia"];
const NB_FIRST = ["Alex","Jordan","Taylor","Casey","Riley","Morgan","Avery","Quinn","Skyler","Dakota"];
const LAST_NAMES = ["Smith","Johnson","Williams","Brown","Jones","Garcia","Miller","Davis","Rodriguez","Martinez",
  "Hernandez","Lopez","Wilson","Anderson","Thomas","Taylor","Moore","Jackson","Martin","Lee"];

function randomFirstName(gender){
  if(gender==='Male') return pick(MALE_FIRST);
  if(gender==='Female') return pick(FEMALE_FIRST);
  return pick(NB_FIRST);
}

/* ============================ STATE ====================================== */
let state = null;

function freshState(){
  return {
    name:'', first:'', last:'', gender:'Male', city:'New York', age:0, alive:true, birthYear: 2026 - rand(0,0),
    stats:{health:100, happiness:80, smarts:50, looks:50, karma:50},
    money: 0,
    eduStage:'none', // none, elementary, middle, highschool, college, grad
    eduYear:0, major:null, gpa:3.0, dropped:false, expelled:false,
    job:null, jobHistory:[],
    relationships:[], // {id,name,type,rel,alive,gender,age}
    spouseId:null, kids:[],
    assets:{cars:[], houses:[], businesses:[]},
    pets:[],
    crypto:{btc:0, eth:0, lifecoin:0, memetoken:0},
    criminalRecord:[], inPrison:false, prisonYearsLeft:0, prisonRep:0, escapePlan:0,
    gang:null,
    drugEmpire:{tier:0, heat:0, name:null},
    influencer:{tier:0, followers:0, platform:null},
    sportsCareer:null,
    clubs:[],
    achievements:new Set(),
    log:[],
    rival:null, mentor:null,
    religion:null, faithLevel:0,
    flags:{}, // arbitrary story flags
    bucketList:[],
    addiction:null,
    illness:null,
    politics:{office:null, approval:50, campaign:null, termYears:0, scandalCount:0},
    business:{companies:[]},
    loveLanguage:null,
    lastCause:null,
    murders:0,
  };
}

function newRelationship(type, opts){
  opts = opts||{};
  const gender = opts.gender || pick(['Male','Female']);
  return {
    id: uid(), type, gender,
    name: opts.name || (randomFirstName(gender)+' '+ (opts.last || state.last)),
    age: opts.age!=null?opts.age:rand(20,45),
    rel: opts.rel!=null?opts.rel:rand(50,90),
    alive:true, jobless:false,
  };
}

/* ============================ RENDER ENGINE ============================== */
function showScreen(name){
  ['loading','newlife','game','dead'].forEach(s=>{
    $('screen-'+s).classList.toggle('hidden', s!==name);
  });
}

function statColor(v){
  if(v>=70) return '#3fb950';
  if(v>=40) return '#d29922';
  return '#f85149';
}

function avatarFor(){
  const a = state.age;
  if(!state.alive) return '💀';
  if(a<2) return '👶';
  if(a<13) return state.gender==='Female'?'👧':(state.gender==='Male'?'👦':'🧒');
  if(a<20) return state.gender==='Female'?'👩‍🦱':(state.gender==='Male'?'👨‍🦱':'🧑');
  if(a<60) return state.gender==='Female'?'👩':(state.gender==='Male'?'👨':'🧑');
  return state.gender==='Female'?'👵':(state.gender==='Male'?'👴':'🧓');
}

function render(){
  if(!state) return;
  if(!state.alive){ renderDeathScreen(); return; }
  showScreen('game');
  $('hd-avatar').textContent = avatarFor();
  $('hd-name').textContent = state.name;
  let sub = 'Age '+state.age+' · '+state.city;
  if(state.job) sub += ' · '+state.job.title;
  else if(state.inPrison) sub += ' · Incarcerated';
  $('hd-sub').textContent = sub;
  $('hd-money').textContent = fmtMoney(state.money);
  const statsHtml = ['health','happiness','smarts','looks','karma'].map(k=>{
    const v = clamp(Math.round(state.stats[k]),0,100);
    return `<div class="stat"><div class="lbl"><span>${k[0].toUpperCase()+k.slice(1)}</span><span>${v}</span></div>
      <div class="bar"><i style="width:${v}%;background:${statColor(v)}"></i></div></div>`;
  }).join('');
  $('hd-stats').innerHTML = statsHtml;
  renderLog();
}

function renderLog(){
  const el = $('log');
  el.innerHTML = state.log.slice(-200).map(entry=>{
    if(entry.newspaper){
      return `<div class="newspaper"><div class="np-name">${entry.paper||'The Daily Life'}</div>
        <h3>${entry.headline}</h3><p>${entry.sub||''}</p></div>`;
    }
    return `<div class="logline ${entry.type||'neutral'}"><span class="age">Age ${entry.age}</span>${entry.text}</div>`;
  }).join('');
}

function log(text, type, age){
  state.log.push({text, type:type||'neutral', age: age!=null?age:state.age});
  renderLog();
}

function newspaper(headline, sub, paper){
  state.log.push({newspaper:true, headline, sub, paper: paper || pick(['The Daily Life','City Herald','The Chronicle','Metro Times'])});
  renderLog();
}

/* ============================ MODAL / PANEL HELPERS ======================= */
function openPanel(title, bodyHtml){
  $('panel-title').textContent = title;
  $('panel-body').innerHTML = bodyHtml;
  $('panel-overlay').classList.remove('hidden');
}
function closePanel(){ $('panel-overlay').classList.add('hidden'); }
$('panel-close').onclick = closePanel;
$('panel-overlay').addEventListener('click', e=>{ if(e.target.id==='panel-overlay') closePanel(); });

function showModal(html){
  $('modal-card').innerHTML = html;
  $('modal-overlay').classList.remove('hidden');
}
function closeModal(){ $('modal-overlay').classList.add('hidden'); }
$('modal-overlay').addEventListener('click', e=>{ if(e.target.id==='modal-overlay') closeModal(); });

/* Generic "scene" engine used by many storylines (debate, chemo, therapy, sponsor talks...) */
function playScene(scene){
  // scene: {title, text, choices:[{label, run(){...}}]}
  const choicesHtml = scene.choices.map((c,i)=>`<button class="btn btn-block" data-i="${i}">${c.label}</button>`).join('');
  showModal(`<h3>${scene.title}</h3><p>${scene.text}</p><div class="choices">${choicesHtml}</div>`);
  $('modal-card').querySelectorAll('button[data-i]').forEach(btn=>{
    btn.onclick = ()=>{
      const c = scene.choices[+btn.dataset.i];
      closeModal();
      if(c.run) c.run();
      render();
    };
  });
}

/* ============================ NEW LIFE FLOW =============================== */
function populateCitySelect(){
  const sel = $('nl-city');
  sel.innerHTML = CITIES.map(c=>`<option value="${c}">${c}</option>`).join('');
}

function startNewLife(){
  state = freshState();
  const gender = $('nl-gender').value;
  state.gender = gender;
  state.first = $('nl-first').value.trim() || randomFirstName(gender);
  state.last = $('nl-last').value.trim() || pick(LAST_NAMES);
  state.name = state.first+' '+state.last;
  state.city = $('nl-city').value;
  state.stats.smarts = clamp(rand(20,80),0,100);
  state.stats.looks = clamp(rand(20,80),0,100);
  state.stats.health = rand(80,100);
  state.stats.happiness = rand(60,100);
  state.stats.karma = 50;
  state.money = 0;

  // parents
  const dad = newRelationship('parent',{gender:'Male', age:rand(24,42), rel:rand(60,95), last:state.last});
  const mom = newRelationship('parent',{gender:'Female', age:rand(22,40), rel:rand(60,95), last:state.last});
  dad.name = randomFirstName('Male')+' '+state.last;
  mom.name = randomFirstName('Female')+' '+state.last;
  state.relationships.push(dad, mom);
  if(chance(60)){
    const sib = newRelationship('sibling',{gender:pick(['Male','Female']), age:rand(0,10), rel:rand(50,90), last:state.last});
    state.relationships.push(sib);
  }
  state.eduStage='none';
  log(`You were born in ${state.city} to ${mom.name} and ${dad.name}.`,'good',0);
  render();
  showScreen('game');
}

/* ============================ BOTTOM NAV WIRING =========================== */
document.querySelectorAll('#bottomnav button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const p = btn.dataset.panel;
    if(p==='career') openCareerPanel();
    else if(p==='assets') openAssetsPanel();
    else if(p==='relationships') openRelationshipsPanel();
    else if(p==='activities') openActivitiesPanel();
    else if(p==='world') openWorldPanel();
    else if(p==='profile') openProfilePanel();
  });
});

/* ============================ JOBS DATA ==================================== */
const JOBS = [
  {title:'Fast Food Worker', edu:'none', salary:18000, tier:1},
  {title:'Retail Associate', edu:'none', salary:21000, tier:1},
  {title:'Janitor', edu:'none', salary:23000, tier:1},
  {title:'Cashier', edu:'none', salary:20000, tier:1},
  {title:'Landscaper', edu:'none', salary:26000, tier:1},
  {title:'Construction Worker', edu:'highschool', salary:34000, tier:2},
  {title:'Truck Driver', edu:'highschool', salary:39000, tier:2},
  {title:'Police Officer', edu:'highschool', salary:48000, tier:2},
  {title:'Firefighter', edu:'highschool', salary:47000, tier:2},
  {title:'Electrician', edu:'highschool', salary:54000, tier:2},
  {title:'Real Estate Agent', edu:'highschool', salary:42000, tier:2},
  {title:'Chef', edu:'highschool', salary:38000, tier:2},
  {title:'Teacher', edu:'college', salary:44000, tier:3},
  {title:'Nurse', edu:'college', salary:62000, tier:3},
  {title:'Accountant', edu:'college', salary:56000, tier:3},
  {title:'Software Engineer', edu:'college', salary:92000, tier:3},
  {title:'Marketing Manager', edu:'college', salary:59000, tier:3},
  {title:'Journalist', edu:'college', salary:41000, tier:3},
  {title:'Graphic Designer', edu:'college', salary:46000, tier:3},
  {title:'Civil Engineer', edu:'college', salary:67000, tier:3},
  {title:'Architect', edu:'college', salary:71000, tier:3},
  {title:'Lawyer', edu:'grad', salary:115000, tier:4},
  {title:'Doctor', edu:'grad', salary:190000, tier:4},
  {title:'Psychologist', edu:'grad', salary:78000, tier:4},
  {title:'Professor', edu:'grad', salary:73000, tier:4},
  {title:'Investment Banker', edu:'grad', salary:145000, tier:4},
];

function jobsAvailable(){
  const order = {none:0, highschool:1, college:2, grad:3};
  const myLevel = order[state.eduStage] ?? 0;
  return JOBS.filter(j=> order[j.edu] <= myLevel);
}

function applyForJob(job){
  const chanceToGet = clamp(50 + (state.stats.smarts-50)*0.4 + (state.stats.looks-50)*0.2 - (state.criminalRecord.length*10), 5, 95);
  if(chance(chanceToGet)){
    state.job = {title:job.title, salary:job.salary, tier:job.tier, years:0};
    log(`You got hired as a ${job.title}, earning ${fmtMoney(job.salary)}/yr.`,'good');
    checkAchievement('first_job');
  } else {
    log(`You applied for ${job.title} but didn't get the job.`,'bad');
  }
  closePanel();
  render();
}

function quitJob(){
  if(!state.job) return;
  state.jobHistory.push(state.job);
  log(`You quit your job as a ${state.job.title}.`,'neutral');
  state.job = null;
  closePanel(); render();
}

/* ============================ CAREER / EDUCATION PANEL ===================== */
function openCareerPanel(){
  let html = '';
  html += `<div class="list-item"><div class="li-main"><b>Education</b><span>${eduLabel()}</span></div></div>`;
  if(state.eduStage==='none' && state.age>=5 && state.age<11){
    html += `<button class="btn btn-block" onclick="enrollSchool('elementary')">Enroll in Elementary School</button>`;
  }
  if(state.eduStage==='elementary' && state.age>=11){
    html += `<button class="btn btn-block" onclick="enrollSchool('middle')">Enroll in Middle School</button>`;
  }
  if(state.eduStage==='middle' && state.age>=14){
    html += `<button class="btn btn-block" onclick="enrollSchool('highschool')">Enroll in High School</button>`;
  }
  if(state.eduStage==='highschool' && state.eduYear>=4 && state.age>=18){

/* ============================ AGE UP CORE =================================== */
function ageUp(){
  if(!state.alive) return;
  state.age++;

  // education year progression
  if(state.eduStage!=='none' && state.eduStage!=='grad-done'){
    state.eduYear++;
    state.gpa = clamp(state.gpa + (chance(50)?0.1:-0.1)*(state.stats.smarts>50?1:-1), 0, 4);
  }

  // job pay + tenure
  if(state.job){
    state.money += state.job.salary;
    state.job.years++;
  }

  // relationship aging
  state.relationships.forEach(r=>{ if(r.alive) r.age++; });

  // random generic event
  if(chance(55)){
    const pool = ageBracketEvents();
    const e = pick(pool);
    e.fx(state);
    log(e.text, e.type);
  }

  // natural stat drift
  state.stats.happiness = clamp(state.stats.happiness + rand(-2,2), 0, 100);
  if(state.age>50) state.stats.health = clamp(state.stats.health - rand(0,2), 0, 100);
  clampAllStats();

  // prison ticking
  if(state.inPrison){ tickPrison(); }

  // sports ticking
  if(state.sportsCareer){ tickSports(); }

  // crypto market ticks every year
  tickCryptoPrices();

  // death checks
  checkDeath();

  if(state.alive){
    checkAchievementsPassive();
  }
  render();
}

function clampAllStats(){
  for(const k in state.stats) state.stats[k] = clamp(state.stats[k],0,100);
}

/* ============================ DEATH CHECK (base) ============================ */
function checkDeath(){
  if(!state.alive) return;
  if(state.stats.health<=0){ die('poor health'); return; }
  let deathChance = 0;
  if(state.age>70) deathChance = (state.age-70)*1.2;
  if(state.age>90) deathChance += 15;
  if(chance(deathChance)){ die('old age'); return; }
  if(chance(0.3)){ die('a sudden accident'); return; }
}

function die(cause){
  state.alive = false;
  state.lastCause = cause;
  log(`You died of ${cause} at age ${state.age}.`,'bad');
  newspaper(`LOCAL RESIDENT ${state.name.toUpperCase()} DIES AT ${state.age}`, `Cause: ${cause}. Survived by family and friends.`);
}

/* ============================ CRIME & PRISON =============================== */
const CRIMES = [
  {name:'Shoplifting', risk:20, reward:[50,300], sentence:1},
  {name:'Pickpocketing', risk:25, reward:[30,400], sentence:1},
  {name:'Grand Theft Auto', risk:45, reward:[1000,8000], sentence:3},
  {name:'Armed Robbery', risk:55, reward:[2000,15000], sentence:5},
  {name:'Fraud', risk:35, reward:[1000,20000], sentence:4},
  {name:'Murder', risk:65, reward:[0,0], sentence:20},
];
function commitCrime(name){
  const c = CRIMES.find(x=>x.name===name);
  const caught = chance(clamp(c.risk - (state.stats.smarts-50)*0.2,5,95));
  if(name==='Murder') state.murders++;
  if(caught){
    state.criminalRecord.push(c.name);
    state.inPrison = true;
    state.prisonYearsLeft = c.sentence;
    log(`You were caught committing ${c.name}! Sentenced to ${c.sentence} years in prison.`,'bad');
    newspaper(`${state.name.toUpperCase()} ARRESTED`, `Local resident charged with ${c.name.toLowerCase()}.`);
  } else {
    const gain = rand(c.reward[0], c.reward[1]);
    state.money += gain;
    state.stats.karma = clamp(state.stats.karma - 10, 0, 100);
    log(`You committed ${c.name} and got away with ${fmtMoney(gain)}.`,'neutral');
  }
  closePanel(); render();
}
function tickPrison(){
  state.prisonYearsLeft--;
  state.stats.happiness = clamp(state.stats.happiness-5,0,100);
  if(state.prisonYearsLeft<=0){
    state.inPrison=false;
    log(`You were released from prison.`,'neutral');
  }
}
function prisonActivity(kind){
  if(kind==='workout'){ state.stats.health=clamp(state.stats.health+5,0,100); state.prisonRep+=2; log(`You worked out in the yard.`,'neutral'); }
  if(kind==='socialize'){ state.stats.happiness=clamp(state.stats.happiness+4,0,100); state.prisonRep+=3; log(`You socialized with other inmates.`,'neutral'); }
  if(kind==='escape'){
    state.escapePlan += rand(10,30);
    if(state.escapePlan>=100){
      if(chance(40)){ state.inPrison=false; state.prisonYearsLeft=0; state.escapePlan=0; log(`You successfully escaped prison!`,'good'); checkAchievement('escaped'); }
      else { state.prisonYearsLeft+=5; state.escapePlan=0; log(`Your escape attempt failed. 5 years added to your sentence.`,'bad'); }
    } else {
      log(`You worked on your escape plan (${state.escapePlan}% ready).`,'neutral');
    }
  }
  if(kind==='parole'){
    if(chance(clamp(state.prisonRep,5,80))){
      state.inPrison=false; state.prisonYearsLeft=0;
      log(`Parole granted! You're free.`,'good');
    } else {
      log(`Parole denied.`,'bad');
    }
  }
  closePanel(); render();
}

const CRYPTO_PRICES = {btc:40000, eth:2500, lifecoin:1, memetoken:0.01};
function tickCryptoPrices(){
  for(const k in CRYPTO_PRICES){
    const vol = k==='memetoken'?0.6:(k==='lifecoin'?0.3:0.15);
    CRYPTO_PRICES[k] = Math.max(0.001, CRYPTO_PRICES[k]*(1+(Math.random()*2-1)*vol));
  }
}
function openCryptoPanel(){
  let html = '';
  for(const k in CRYPTO_PRICES){
    html += `<div class="list-item"><div class="li-main"><b>${k.toUpperCase()}</b><span>Price: ${fmtMoney(CRYPTO_PRICES[k])} · Holding: ${state.crypto[k].toFixed(4)}</span></div>

  }
  openPanel('Crypto Exchange', html);
}
function buyCrypto(k){
  const amt = 500;
  if(state.money<amt){ log(`Not enough cash to buy ${k.toUpperCase()}.`,'bad'); closePanel(); render(); return; }
  state.money -= amt;
  state.crypto[k] += amt/CRYPTO_PRICES[k];
  log(`You bought ${fmtMoney(amt)} of ${k.toUpperCase()}.`,'neutral');
  openCryptoPanel();
}
function sellCrypto(k){
  const value = state.crypto[k]*CRYPTO_PRICES[k];
  state.money += value; state.crypto[k]=0;

}

function drugAction(action){
  const de = state.drugEmpire;
  if(action==='deal'){

    if(chance(clamp(20+de.heat*0.5,10,80))){

      log(`Police busted your operation! You're headed to prison.`,'bad');

      state.money += gain; de.heat = clamp(de.heat+8,0,100); state.stats.karma=clamp(state.stats.karma-5,0,100);
      log(`You made ${fmtMoney(gain)} dealing on the streets.`,'neutral');

  if(action==='expand' && de.tier<5){
    const cost = 5000*(de.tier+1);
    if(state.money>=cost){ state.money-=cost; de.tier++; de.name=DRUG_TIERS[de.tier]; log(`Your operation expanded. You're now a ${DRUG_TIERS[de.tier]}.`,'good'); checkAchievement('drug_lord'); }

  closePanel(); render();
}

/* ============================ LEGACY SCORE (base, extended in Phase 16) ======== */
function calcLegacyScore(){
  let score = 0;
  const livingFamily = state.relationships.filter(r=>r.alive && r.rel>=50).length;
  score += clamp(livingFamily*4, 0, 20);
  score += clamp((state.job?state.job.tier:0)*4, 0, 20);
  score += clamp(state.stats.karma*0.2, 0, 20);
  score += clamp(state.achievements.size*0.6, 0, 15);
  score += clamp(state.kids.length*3, 0, 10);
  score += clamp(Math.log10(Math.max(1,netWorth()))*1.5, 0, 15);
  return clamp(Math.round(score),0,100);
}
function legacyGrade(score){
  if(score>=90) return {grade:'S', title:'Legendary Life'};
  if(score>=75) return {grade:'A', title:'Remarkable Life'};
  if(score>=60) return {grade:'B', title:'Well-Lived Life'};
  if(score>=40) return {grade:'C', title:'Ordinary Life'};
  if(score>=20) return {grade:'D', title:'Troubled Life'};
  return {grade:'F', title:'Wasted Potential'};
}

function assignRivalP15(){

}
const RIVAL_EVENTS_P15 = [
  {text:r=>`${r.name} bragged about beating your grades this semester.`, field:'school', bad:true},
  {text:r=>`You outperformed ${r.name} on a big project.`, field:'school', bad:false},
  {text:r=>`${r.name} got the promotion you were up for.`, field:'career', bad:true},
  {text:r=>`You landed a deal that ${r.name} was chasing.`, field:'career', bad:false},
  {text:r=>`${r.name} beat you in a head-to-head competition.`, field:'sports', bad:true},

  {text:r=>`${r.name} spread a rumor about you to your friends.`, field:'social', bad:true},

function rollRivalEventP15(){
  if(!state.rival) return;
  const r = state.rival;
  const pool = RIVAL_EVENTS_P15.filter(e=>e.field===r.field);
  const e = pick(pool.length?pool:RIVAL_EVENTS_P15);
  if(e.bad){ r.losses++; state.stats.happiness=clamp(state.stats.happiness-3,0,100); }
  else { r.wins++; state.stats.happiness=clamp(state.stats.happiness+3,0,100); }
  log(e.text(r), e.bad?'bad':'good');
}
function confrontRivalP15(){
  const r = state.rival; if(!r) return;
  playScene({title:`Rival: ${r.name}`, text:`You run into ${r.name} again. How do you want to handle this rivalry?`, choices:[
    {label:'Challenge them head-on, fair and square', run:()=>{ if(chance(50)){ r.wins++; r.rel=clamp(r.rel+3,-100,100); state.stats.happiness=clamp(state.stats.happiness+5,0,100); log(`You beat ${r.name} fair and square. Sweet victory.`,'good'); } else { r.losses++; state.stats.happiness=clamp(state.stats.happiness-4,0,100); log(`${r.name} got the better of you this time.`,'bad'); } }},
    {label:'Sabotage them behind the scenes', run:()=>{ state.stats.karma=clamp(state.stats.karma-8,0,100); if(chance(60)){ r.rel=clamp(r.rel-10,-100,100); log(`Your sabotage worked, but it left a bad taste in your mouth.`,'neutral'); } else { state.stats.happiness=clamp(state.stats.happiness-6,0,100); log(`Your sabotage backfired publicly. Embarrassing.`,'bad'); } }},
    {label:'Take the high road and be kind to them', run:()=>{ state.stats.karma=clamp(state.stats.karma+6,0,100); r.rel=clamp(r.rel+15,-100,100); if(r.rel>=40){ log(`You and ${r.name} actually became friends.`,'good'); state.rival=null; } else { log(`You extended an olive branch to ${r.name}.`,'good'); } }},
  ]});
}

const GANG_RANKS_P15 = ['Recruit','Soldier','Enforcer','Lieutenant','Shot Caller','Boss'];

function joinGangP15(){
  if(state.gang) return;
  state.gang = {name: pick(GANG_NAMES_P15), rank:0, territory: rand(5,15), rep:0, rivalGang: pick(GANG_NAMES_P15)};
  while(state.gang.rivalGang===state.gang.name) state.gang.rivalGang = pick(GANG_NAMES_P15);
  state.stats.karma = clamp(state.stats.karma-10,0,100);
  log(`You joined ${state.gang.name}. There's no easy way out now.`,'bad');

function gangPutInWorkP15(){
  const g = state.gang; if(!g) return;
  if(chance(65)){
    const gain = rand(200,1500);
    state.money += gain; g.rep += rand(3,8);
    log(`You put in work for ${g.name} and earned ${fmtMoney(gain)}.`,'neutral');
  } else {
    state.inPrison = true; state.prisonYearsLeft = rand(1,4);
    state.criminalRecord.push('Gang Activity');

  }

    g.territory = clamp(g.territory+gain,0,100);
    state.stats.happiness = clamp(state.stats.happiness+3,0,100);
    log(`${g.name} won a turf war against ${g.rivalGang}! Territory expanded to ${g.territory}%.`,'good');

}

function tickWarStatusP15(){
  if(!state.flags.warActive && chance(3)){
    state.flags.warActive = true;

    newspaper('NATION GOES TO WAR', 'Government officials confirm military deployment has begun.');

function tickDraftP15(){
  if(!state.flags.warActive) return;
  if(state.flags.drafted || state.flags.servedInWar) return;
  if(state.age<18 || state.age>25) return;
  if(!chance(15)) return;
  state.flags.drafted = true;
  playScene({title:'Draft Notice', text:'A draft notice arrives in the mail. You have been called to serve in the war.', choices:[
    {label:'Report for duty', run:()=>{
      state.flags.servedInWar = true;
      if(chance(15)){ die('combat injuries sustained in the war'); return; }
      if(chance(30)){ state.stats.health=clamp(state.stats.health-rand(15,35),0,100); log(`You were wounded in combat, but survived and came home.`,'bad'); }
      else { state.stats.karma=clamp(state.stats.karma+8,0,100); log(`You served your tour and returned home a veteran.`,'good'); }
      state.money += rand(5000,15000);
      checkAchievement('veteran');
    }},
    {label:'Flee to another country', run:()=>{
      state.flags.fugitive = true; state.stats.karma=clamp(state.stats.karma-5,0,100); state.stats.happiness=clamp(state.stats.happiness-8,0,100);
      log(`You fled the country to avoid the draft. You can never go home the same way again.`,'bad');
    }},
    {label:'File as a conscientious objector', run:()=>{
      if(chance(50)){ log(`Your objection was accepted. You served in a non-combat role instead.`,'neutral'); state.flags.servedInWar=true; }
      else { state.inPrison=true; state.prisonYearsLeft=2; state.criminalRecord.push('Draft Evasion'); log(`Your objection was denied and you were imprisoned for draft evasion.`,'bad'); }

  ]});
}

  });
  html += `</div>`;
  html += `<div class="row"><input id="chat-input" type="text" placeholder="Say something..." style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);"><button class="btn btn-primary" id="chat-send-btn">Send</button></div>`;
  html += `<button class="btn btn-block" style="margin-top:8px" onclick="closeModal()">Close</button>`;
  showModal(html);
  const logEl = document.getElementById('chat-log');
  if(logEl) logEl.scrollTop = logEl.scrollHeight;
  document.getElementById('chat-send-btn').onclick = ()=>sendFamilyChatP15(r);
  document.getElementById('chat-input').addEventListener('keydown', e=>{ if(e.key==='Enter') sendFamilyChatP15(r); });
}
async function callClaudeApiP15(r){
  const apiKey = getApiKeyP15();
  const model = getApiModelP15();
  const persona = `You are roleplaying as ${r.name}, the ${relLabel(r.type)} of ${state.name} in a life simulation game called LifePlay. ${r.name} is ${r.age} years old. Your relationship closeness with ${state.name} is ${Math.round(r.rel)}/100. Stay fully in character as ${r.name} — warm or distant depending on the relationship score, with a distinct personality. Keep replies conversational and under 60 words. Never break character or mention that you are an AI.`;
  const messages = r.chatHistory.filter(m=>m.role==='user'||m.role==='assistant').map(m=>({role:m.role, content:m.content}));
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'content-type':'application/json',
      'x-api-key': apiKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true',
    },
    body: JSON.stringify({ model, max_tokens:200, system:persona, messages })
  });
  if(!res.ok){
    const errText = await res.text().catch(()=>res.statusText);
    throw new Error('HTTP '+res.status+' '+errText.slice(0,150));
  }
  const data = await res.json();
  const block = (data.content||[]).find(b=>b.type==='text');
  return block ? block.text : '[No response]';
}
async function sendFamilyChatP15(r){
  const input = document.getElementById('chat-input');
  if(!input) return;
  const text = input.value.trim();
  if(!text) return;
  r.chatHistory.push({role:'user', content:text});
  renderFamilyChatP15(r);
  const logEl = document.getElementById('chat-log');
  if(logEl){ logEl.innerHTML += `<div style="align-self:flex-start;color:var(--sub);font-size:.8em;">${r.name} is typing...</div>`; logEl.scrollTop = logEl.scrollHeight; }
  try{
    const reply = await callClaudeApiP15(r);
    r.chatHistory.push({role:'assistant', content:reply});
  } catch(err){
    r.chatHistory.push({role:'assistant', content:'[Could not reach the API: '+err.message+']'});
  }
  renderFamilyChatP15(r);
}

  openBusinessPanel();
}
function acceptTakeoverP16(bizId){
  const biz = state.business.companies.find(b=>b.id===bizId); if(!biz || !biz.takeoverOffer) return;
  state.money += biz.takeoverOffer;
  log(`You sold ${biz.name} in a hostile takeover for ${fmtMoney(biz.takeoverOffer)}.`,'neutral');
  state.business.companies = state.business.companies.filter(b=>b.id!==bizId);
  openBusinessPanel();
}
function rejectTakeoverP16(bizId){
  const biz = state.business.companies.find(b=>b.id===bizId); if(!biz) return;
  biz.takeoverOffer = null;
  log(`You rejected the takeover offer for ${biz.name}.`,'neutral');
  openBusinessPanel();
}
function tickBusinessEmpireP16(){
  state.business.companies.forEach(biz=>{
    let revenue = Math.round(biz.employees.length*rand(2000,6000)*biz.locations*(biz.franchise?1.6:1)*(biz.morale/100));
    state.money += revenue;
    biz.employees.forEach(e=>{ state.money -= e.salary; });
    biz.morale = clamp(biz.morale + rand(-6,4),0,100);
    if(biz.morale<30 && biz.employees.length>0 && chance(25)){
      const quitEmp = pick(biz.employees);
      biz.employees = biz.employees.filter(e=>e.id!==quitEmp.id);
      log(`${quitEmp.name} quit ${biz.name} due to low morale.`,'bad');
    }
    if(chance(8)){
      const rivalName = randomEmployeeNameP16()+"'s "+pick(['Corp','Enterprises','Group']);
      log(`A new competitor, ${rivalName}, opened up near ${biz.name} and is stealing customers.`,'bad');
      state.money -= rand(500,3000);
    }
    if(!biz.takeoverOffer && chance(4)){
      biz.takeoverOffer = Math.round((biz.employees.length+1)*biz.locations*15000*(1+Math.random()));
      log(`A larger company offered to acquire ${biz.name} for ${fmtMoney(biz.takeoverOffer)}. Review the offer in the Business panel.`,'neutral');
    }
  });
}
function openBusinessPanel(){
  let html = '';
  if(state.business.companies.length===0){
    html += `<p style="color:var(--sub)">You don't own any businesses yet.</p>`;
    html += `<button class="btn btn-block btn-primary" onclick="startBusinessP16()">Start a Business ($20,000)</button>`;
  } else {
    state.business.companies.forEach(biz=>{
      html += `<div class="list-item"><div class="li-main"><b>${biz.name}${biz.franchise?' 🏷️ Franchise':''}</b><span>${biz.locations} location(s) · Morale ${biz.morale}% · ${biz.employees.length} staff</span></div></div>`;
      biz.employees.forEach(e=>{
        html += `<div class="list-item"><div class="li-main"><b>${e.name}</b><span>${e.role} · ${fmtMoney(e.salary)}/yr</span></div><button class="btn" onclick='fireEmployeeP16(${JSON.stringify(biz.id)},${JSON.stringify(e.id)})'>Fire</button></div>`;
      });
      html += `<button class="btn btn-block" onclick='hireEmployeeP16(${JSON.stringify(biz.id)})'>Hire Employee ($2,000)</button>`;
      html += `<button class="btn btn-block" onclick='openLocationP16(${JSON.stringify(biz.id)})'>Open New Location</button>`;
      html += `<button class="btn btn-block" onclick='boostMoraleP16(${JSON.stringify(biz.id)})'>Boost Morale ($1,000)</button>`;
      if(!biz.franchise) html += `<button class="btn btn-block btn-accent" onclick='franchiseP16(${JSON.stringify(biz.id)})'>Franchise Business</button>`;
      if(biz.takeoverOffer){
        html += `<div class="list-item"><div class="li-main"><b>Hostile Takeover Offer</b><span>${fmtMoney(biz.takeoverOffer)}</span></div></div>`;
        html += `<div class="row"><button class="btn btn-primary" onclick='acceptTakeoverP16(${JSON.stringify(biz.id)})'>Accept</button><button class="btn" onclick='rejectTakeoverP16(${JSON.stringify(biz.id)})'>Reject</button></div>`;
      }
      html += `<hr style="border-color:var(--border)">`;
    });
    if(state.money>=20000) html += `<button class="btn btn-block btn-primary" onclick="startBusinessP16()">Start Another Business ($20,000)</button>`;
  }
  openPanel('Business Empire', html);
}
const _origOpenAssetsPanel_P16 = openAssetsPanel;
openAssetsPanel = function(){
  _origOpenAssetsPanel_P16();
  const body = $('panel-body');
  const btn = document.createElement('button');
  btn.className='btn btn-block btn-primary';
  btn.textContent='🏢 Business Empire';
  btn.onclick = openBusinessPanel;
  body.appendChild(btn);
};

/* ---------------------------------------------------------------------
   16.4 RELATIONSHIP DEPTH — love languages, narrative date nights,
   anniversaries, post-divorce healing, toxic relationship warning signs
   --------------------------------------------------------------------- */
const LOVE_LANGUAGES_P16 = ['acts','gifts','quality','words','touch'];
const LOVE_LANGUAGE_LABELS_P16 = {acts:'Acts of Service', gifts:'Give a Thoughtful Gift', quality:'Quality Time Together', words:'Words of Affirmation', touch:'A Warm Hug'};

function checkToxicSignsP16(r){
  if(r.rel<25 && !r.toxicWarned){
    r.toxicWarned = true;
    log(`⚠️ Warning sign: your relationship with ${r.name} feels increasingly one-sided and tense. This may be turning toxic.`,'bad');
  }
}

const _origInteractWith_P16 = interactWith;
interactWith = function(id){
  const r = state.relationships.find(x=>x.id===id);
  if(r && (r.type==='datingpartner' || r.type==='spouse')){
    if(!r.loveLanguage) r.loveLanguage = pick(LOVE_LANGUAGES_P16);
    const opts = LOVE_LANGUAGES_P16.map(ll=>({
      label: LOVE_LANGUAGE_LABELS_P16[ll],
      run:()=>{
        const match = ll===r.loveLanguage;
        const gain = match ? rand(10,18) : rand(2,6);
        r.rel = clamp(r.rel+gain,0,100);
        state.stats.happiness = clamp(state.stats.happiness+(match?4:1),0,100);
        log(match?`You showed "${LOVE_LANGUAGE_LABELS_P16[ll]}" — exactly what ${r.name} needed! Relationship soared.`:`You showed "${LOVE_LANGUAGE_LABELS_P16[ll]}". ${r.name} appreciated it.`,'good');
        checkToxicSignsP16(r);
      }
    }));
    playScene({title:r.name, text:`How do you want to express love to ${r.name} today?`, choices:opts});
    return;
  }
  _origInteractWith_P16(id);
};

const _origFindDate_P16 = findDate;
findDate = function(){
  _origFindDate_P16();
  const dp = [...state.relationships].reverse().find(r=>r.type==='datingpartner' && r.alive);
  if(dp && !dp.loveLanguage) dp.loveLanguage = pick(LOVE_LANGUAGES_P16);
};

const _origGoOnDateNight_P16 = goOnDateNight;
goOnDateNight = function(){
  const r = state.relationships.find(x=>x.id===state.spouseId);
  if(!r){ _origGoOnDateNight_P16(); return; }
  const cost = 150;
  if(state.money<cost){ log(`You couldn't afford a date night out this year.`,'bad'); closePanel(); render(); return; }
  state.money -= cost;
  closePanel();
  playScene({title:'Date Night: Dinner Reservation', text:`You booked a candlelit table for two with ${r.name}. The night is yours to shape.`, choices:[
    {label:'Order champagne and toast to us', run:()=>{ r.rel=clamp(r.rel+12,0,100); state.stats.happiness=clamp(state.stats.happiness+6,0,100); log(`A magical night with ${r.name}.`,'good'); }},
    {label:'Talk through a recent argument', run:()=>{ r.rel=clamp(r.rel+4,0,100); log(`You and ${r.name} worked through some tension.`,'neutral'); }},
    {label:'Spend the whole dinner on your phone', run:()=>{ r.rel=clamp(r.rel-8,0,100); checkToxicSignsP16(r); log(`${r.name} was hurt that you were on your phone all night.`,'bad'); }},
  ]});
};

function tickAnniversaryP16(){
  if(!state.spouseId || state.flags.anniversaryAge==null) return;
  const years = state.age - state.flags.anniversaryAge;
  const spouse = state.relationships.find(r=>r.id===state.spouseId);
  if(!spouse || years<=0) return;
  if([1,5,10,15,20,25,30,40,50].includes(years)){
    spouse.rel = clamp(spouse.rel+10,0,100);
    state.stats.happiness = clamp(state.stats.happiness+6,0,100);
    log(`💍 Happy ${years}-year anniversary with ${spouse.name}! You celebrated together.`,'good');
    if(years>=25) checkAchievement('long_marriage');
  }
}
function tickHealingArcP16(){
  const h = state.flags.healingArc;
  if(!h) return;
  h.yearsLeft--;
  if(h.yearsLeft===2){ log(`You're still processing the divorce, but starting to feel like yourself again.`,'neutral'); state.stats.happiness=clamp(state.stats.happiness+3,0,100); }
  else if(h.yearsLeft===1){ log(`You've mostly healed from the divorce and feel ready to move forward.`,'good'); state.stats.happiness=clamp(state.stats.happiness+4,0,100); }
  else if(h.yearsLeft<=0){ log(`You've fully healed from your divorce. A new chapter begins.`,'good'); state.stats.happiness=clamp(state.stats.happiness+5,0,100); state.flags.healingArc=null; }
}

/* ---------------------------------------------------------------------
   16.5 TERMINAL ILLNESS ARC — diagnosis, chemo/experimental choices,
   family gathering, bucket list tie-in, survive-or-die
   --------------------------------------------------------------------- */
const ILLNESS_NAMES_P16 = ['cancer','a rare autoimmune disease','a severe heart condition','a degenerative illness'];

function familyGatheringSceneP16(){
  const ill = state.illness; if(!ill || ill.gatheringDone) return;
  ill.gatheringDone = true;
  const family = state.relationships.filter(r=>r.alive && (r.type==='parent'||r.type==='sibling'||r.type==='spouse'||r.type==='child'));
  playScene({title:'Family Gathering', text:`Your family gathered around you, uncertain what to say. This might be your chance to say what matters.`, choices:[
    {label:'Tell them how much you love them', run:()=>{ family.forEach(f=>{f.rel=clamp(f.rel+15,0,100);}); state.stats.happiness=clamp(state.stats.happiness+10,0,100); log(`You told your family how much they mean to you. Tears were shed, but good ones.`,'good'); }},
    {label:'Make peace with old grudges', run:()=>{ family.forEach(f=>{f.rel=clamp(f.rel+8,0,100);}); state.stats.karma=clamp(state.stats.karma+8,0,100); log(`You let go of old resentments and made peace.`,'good'); }},
    {label:"Stay quiet, it's too hard to talk about", run:()=>{ log(`The room sat in heavy silence. Some things went unsaid.`,'bad'); }},
  ]});
}
function illnessTreatmentSceneP16(){
  const ill = state.illness; if(!ill) return;
  playScene({title:'Treatment Decision', text:`Your oncologist lays out your options for this year.`, choices:[
    {label:'Aggressive chemotherapy', run:()=>{ state.stats.health=clamp(state.stats.health-12,0,100); ill.survivalChance=clamp(ill.survivalChance+15,0,100); log(`The chemo was brutal, but it's fighting the illness hard.`,'neutral'); }},
    {label:'Try an experimental treatment trial ($8,000)', run:()=>{
      if(state.money<8000){ log(`You can't afford the experimental treatment this year.`,'bad'); return; }
      state.money-=8000;
      if(chance(50)){ ill.survivalChance=clamp(ill.survivalChance+25,0,100); state.stats.health=clamp(state.stats.health-4,0,100); log(`The experimental treatment showed real promise!`,'good'); }
      else { ill.survivalChance=clamp(ill.survivalChance-5,0,100); state.stats.health=clamp(state.stats.health-8,0,100); log(`The experimental treatment had harsh side effects with little benefit.`,'bad'); }
    }},
    {label:'Choose palliative comfort care', run:()=>{ state.stats.happiness=clamp(state.stats.happiness+10,0,100); ill.survivalChance=clamp(ill.survivalChance-8,0,100); log(`You chose comfort over aggressive treatment, focusing on quality of life.`,'neutral'); }},
  ]});
}
function diagnoseIllnessP16(){
  const name = pick(ILLNESS_NAMES_P16);
  state.illness = {name, stage:1, diagnosedAge: state.age, survivalChance:60, gatheringDone:false};
  log(`🏥 You were diagnosed with ${name}.`,'bad');
  newspaper(`${state.name.toUpperCase()} FACES HEALTH BATTLE`, `Community rallies around ${state.name} after a difficult diagnosis.`);
  playScene({title:'Diagnosis', text:`Your doctor sits you down: "The tests confirm it. You have ${name}. We need to talk about treatment."`, choices:[
    {label:'Get a second opinion', run:()=>{ log(`The second opinion confirmed the diagnosis, but you feel more informed.`,'neutral'); state.illness.survivalChance+=5; }},
    {label:'Start treatment immediately', run:()=>{ log(`You decided to fight this head-on, starting treatment right away.`,'neutral'); state.illness.survivalChance+=3; }},
    {label:'Try to ignore it and hope it goes away', run:()=>{ log(`You put off treatment, hoping for the best.`,'bad'); state.illness.survivalChance-=10; }},
  ]});
}
function tickIllnessOnsetCheck(){
  if(!state.illness && state.age>=30){
    const risk = 0.3 + Math.max(0,(state.age-50))*0.15 + Math.max(0,(50-state.stats.health))*0.05;
    if(chance(risk)) diagnoseIllnessP16();
  }
}
function tickIllnessP16(){
  const ill = state.illness; if(!ill) return;
  ill.stage++;
  if(state.age<60 && state.bucketList.length===0) state.flags.illnessBucketUnlocked = true;
  if(ill.stage===3 && !ill.gatheringDone) familyGatheringSceneP16();
  else illnessTreatmentSceneP16();
  if(ill.stage>=2 && !chance(ill.survivalChance) && chance(35)){ die(ill.name); return; }
  if(ill.survivalChance>=90 && ill.stage>=3 && chance(30)){
    log(`🎉 Your doctors confirmed you're in remission! You beat ${ill.name}.`,'good');
    newspaper(`${state.name.toUpperCase()} BEATS THE ODDS`, `After a hard-fought battle, ${state.name} is declared cancer-free.`);
    checkAchievement('survivor');
    state.illness = null;
  }
}
const _origOpenProfilePanel_P16 = openProfilePanel;
openProfilePanel = function(){
  _origOpenProfilePanel_P16();
  if(state.flags.illnessBucketUnlocked && state.age<60 && state.bucketList.length===0){
    const body = $('panel-body');
    const btn = document.createElement('button');
    btn.className='btn btn-block btn-danger';
    btn.textContent='📝 Set Bucket List (facing illness)';
    btn.onclick = openBucketListSetup;
    body.appendChild(btn);
  }
};

/* ---------------------------------------------------------------------
   16.6 ADDICTION RECOVERY — 12-step arc, sponsor, meetings, chips, relapse
   --------------------------------------------------------------------- */
function tickAddictionOnsetCheck(){
  if(state.addiction) return;
  let risk = 0;
  if(state.drugEmpire.tier>0) risk += 8;
  if(state.stats.happiness<30) risk += 5;
  if(state.criminalRecord.length>0) risk += 2;
  if(risk>0 && chance(risk)){
    const substance = pick(['alcohol','opioids','cocaine','methamphetamine']);
    state.addiction = {substance, inRecovery:false, soberYears:0, sponsor:null, chips:[], meetingsAttended:0, relapses:0};
    state.stats.health=clamp(state.stats.health-10,0,100);
    log(`You developed a dependency on ${substance}. It's starting to control your life.`,'bad');
  }
}
function enterRecoveryP16(){
  const add = state.addiction; if(!add || add.inRecovery) return;
  add.inRecovery = true; add.sponsor = randomEmployeeNameP16(); add.soberYears=0;
  log(`You entered a 12-step recovery program. Your sponsor, ${add.sponsor}, will guide you.`,'good');
  openAddictionPanel();
}
function attendMeetingP16(){
  const add = state.addiction; if(!add || !add.inRecovery) return;
  add.meetingsAttended++;
  state.stats.happiness=clamp(state.stats.happiness+2,0,100);
  log(`You attended a weekly recovery meeting with ${add.sponsor}.`,'good');
  openAddictionPanel();
}
function tickAddictionRecoveryP16(){
  const add = state.addiction; if(!add || !add.inRecovery) return;
  add.soberYears++;
  const relapseChance = clamp(20 - add.meetingsAttended*1.5,2,20);
  if(chance(relapseChance)){
    add.relapses++; add.soberYears=0;
    state.stats.happiness=clamp(state.stats.happiness-10,0,100);
    log(`💔 You relapsed after a hard year. ${add.sponsor} reminds you that recovery isn't linear.`,'bad');
  } else {
    state.stats.health=clamp(state.stats.health+3,0,100);
    state.stats.happiness=clamp(state.stats.happiness+2,0,100);
    if(add.soberYears===1){
      add.chips.push('1 Year Chip');
      log(`🎉 ONE YEAR SOBER! You celebrated your 1-year chip with ${add.sponsor} and your support group.`,'good');
      newspaper(`${state.name.toUpperCase()} CELEBRATES ONE YEAR OF SOBRIETY`, `Friends and family gather to honor this hard-won milestone.`);
      checkAchievement('sober_year');
    } else if([2,5,10].includes(add.soberYears)){
      add.chips.push(add.soberYears+' Year Chip');
      log(`🏅 You earned your ${add.soberYears}-year sobriety chip!`,'good');
    }
    if(add.soberYears>=5 && chance(15)){
      log(`You've been sober for years now. ${add.sponsor} says you're ready to sponsor someone else.`,'good');
      state.stats.karma=clamp(state.stats.karma+5,0,100);
      state.flags.recoveredFromAddiction = true;
      state.addiction = null;
    }
  }
}
function openAddictionPanel(){
  const add = state.addiction;
  let html='';
  if(!add){ html += `<p style="color:var(--sub)">You have no active struggles with addiction.</p>`; openPanel('Recovery', html); return; }
  html += `<div class="list-item"><div class="li-main"><b>Struggling with ${add.substance}</b><span>${add.inRecovery?('In recovery · '+add.soberYears+' yrs sober'):'Not yet in treatment'}</span></div></div>`;
  if(!add.inRecovery){
    html += `<button class="btn btn-block btn-primary" onclick="enterRecoveryP16()">Enter a 12-Step Recovery Program</button>`;
  } else {
    html += `<div class="list-item"><div class="li-main"><b>Sponsor</b><span>${add.sponsor}</span></div></div>`;
    html += `<button class="btn btn-block" onclick="attendMeetingP16()">Attend Weekly Meeting</button>`;
    html += `<div class="list-item"><div class="li-main"><b>Chips Earned</b><span>${add.chips.join(', ')||'None yet'}</span></div></div>`;
    html += `<div class="list-item"><div class="li-main"><b>Relapses</b><span>${add.relapses}</span></div></div>`;
  }
  openPanel('Recovery', html);
}
const _origOpenActivitiesPanel_P16 = openActivitiesPanel;
openActivitiesPanel = function(){
  _origOpenActivitiesPanel_P16();
  const body = $('panel-body');
  const btn = document.createElement('button');
  btn.className='btn btn-block'+(state.addiction && !state.addiction.inRecovery?' btn-danger':'');
  btn.textContent = state.addiction ? '🩹 Recovery Program' : '🩹 Recovery Support';
  btn.onclick = openAddictionPanel;
  body.appendChild(btn);
};

/* ---------------------------------------------------------------------
   16.x SCENE QUEUE FIX — story scenes from different systems (illness,
   scandals, relationships...) can now trigger in the same year. Queue
   them instead of letting a later scene silently overwrite an earlier one.
   --------------------------------------------------------------------- */
const _origPlayScene_P16 = playScene;
const _sceneQueueP16 = [];
playScene = function(scene){
  if(!$('modal-overlay').classList.contains('hidden')){ _sceneQueueP16.push(scene); return; }
  _origPlayScene_P16(scene);
};
const _origCloseModal_P16 = closeModal;
closeModal = function(){
  _origCloseModal_P16();
  if(_sceneQueueP16.length){
    const next = _sceneQueueP16.shift();
    setTimeout(()=>playScene(next), 50);
  }
};

   16.9 BUCKET LIST — completing all 5 before death triggers a special ending
   --------------------------------------------------------------------- */
SECRET_ENDINGS.push(
  {id:'bucket_list_legend', title:'Bucket List Legend', cond:s=>s.flags.bucketListComplete===true},

/* ---------------------------------------------------------------------
   16.10 LEGACY SCORE — extended to weigh goals completed, office held,
   business empire and recovery, on top of the base formula.
   --------------------------------------------------------------------- */
const _origCalcLegacyScore_P16 = calcLegacyScore;
calcLegacyScore = function(){
  let score = _origCalcLegacyScore_P16();
  if(state.flags.bucketListComplete) score += 5;
  if(state.flags.recoveredFromAddiction) score += 3;
  if(state.politics.office) score += 5;
  if(state.business.companies.length>0) score += 3;
  if(state.illness===null && state.flags.illnessBucketUnlocked) score += 2; // beat a terminal illness
  return clamp(Math.round(score),0,100);
};

/* ---------------------------------------------------------------------
   MASTER AGE-UP HOOK — wires every Phase 16 system into the yearly loop
   --------------------------------------------------------------------- */
const _origAgeUp_P16 = ageUp;
ageUp = function(){
  _origAgeUp_P16();
  if(!state || !state.alive) return;
  rollWorldEventP16();
  tickPoliticalTermP16();
  tickBusinessEmpireP16();
  tickAnniversaryP16();
  tickHealingArcP16();
  tickIllnessOnsetCheck();
  if(state.illness && state.illness.diagnosedAge !== state.age) tickIllnessP16();
  tickAddictionOnsetCheck();
  tickAddictionRecoveryP16();
  clampAllStats();
  if(state.alive) checkAchievementsPassive();
  render();
};

/* ---------------------------------------------------------------------
   16.8 NEWSPAPER FRONT PAGE — sports draft & prison release also get covered
   (arrest, election, lottery, marriage, birth, pro sports already emit one)
   --------------------------------------------------------------------- */
const _origTickSports_P16 = tickSports;
tickSports = function(){
  const beforeStage = state.sportsCareer ? state.sportsCareer.stage : -1;
  _origTickSports_P16();

  }
};
