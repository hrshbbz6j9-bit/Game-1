/* ---------------------------------------------------------------------
   P60 — Divorce Settlement: filing for divorce used to be one click
   with a flat 25% money hit and no real decision. Now the "File for
   Divorce" button opens a settlement panel with two real paths: an
   Amicable Split (softer financially and emotionally) or a Contested
   Battle (hire a lawyer and gamble on a bigger payout, at real karma
   and happiness cost). Both paths still route through the existing
   fileDivorce() for the core relationship severance / healing arc /
   achievement logic, then layer differentiated outcomes on top.
   --------------------------------------------------------------------- */
function openDivorceSettlementPanelP60(){
  const spouse = state.relationships.find(r=>r.id===state.spouseId);
  if(!spouse) return;
  let html = `<p style="color:var(--sub)">Divorcing ${spouse.name} is a big step. How do you want to handle the settlement?</p>`;
  html += `<button class="btn btn-block btn-accent" onclick="closePanel(); coupleCounselingP15();">💑 Try Counseling First</button>`;
  html += `<button class="btn btn-block" onclick="divorceAmicableP60()">🤝 Amicable Split — fair and quick, easier on everyone</button>`;
  html += `<button class="btn btn-block btn-danger" onclick="divorceContestedP60()">⚖️ Contested Battle — hire a lawyer and fight for more</button>`;
  openPanel('Divorce Settlement', html);
}
function divorceAmicableP60(){
  const spouse = state.relationships.find(r=>r.id===state.spouseId);
  if(!spouse) return;
  const name = spouse.name;
  const preMoney = state.money;
  fileDivorce();
  const lost = Math.max(0, preMoney - state.money);
  state.money += Math.round(lost*0.5);
  state.stats.happiness = clamp(state.stats.happiness+5,0,100);
  state.stats.karma = clamp(state.stats.karma+3,0,100);
  log(`You and ${name} settled things amicably. It stung less than it could have.`,'good');
  render();
}
function divorceContestedP60(){
  const spouse = state.relationships.find(r=>r.id===state.spouseId);
  if(!spouse) return;
  const name = spouse.name;
  const lawyerCost = Math.round(clamp(state.money,0,999999999)*0.05)+2000;
  state.money -= lawyerCost;
  fileDivorce();
  const win = chance(clamp(50+(state.stats.smarts-50)*0.3,15,85));
  if(win){

/* ---------------------------------------------------------------------
   P61 — International Travel: the existing travel mechanic (P17) only
   ever covered domestic US cities. This adds a real international
   destination list with per-country flavor events (good and bad),
   a chance to make a new friend abroad, and a "Move Abroad" option
   that permanently relocates state.city once you've visited a place
   at least once — a proper emigration arc, not just a vacation.
   --------------------------------------------------------------------- */
const COUNTRIES_P61 = [
  {name:'France', city:'Paris', cost:1800},
  {name:'Japan', city:'Tokyo', cost:2200},
  {name:'Italy', city:'Rome', cost:1900},
  {name:'Brazil', city:'Rio de Janeiro', cost:1600},
  {name:'Australia', city:'Sydney', cost:2400},
  {name:'Egypt', city:'Cairo', cost:1700},
  {name:'Thailand', city:'Bangkok', cost:1500},
  {name:'United Kingdom', city:'London', cost:2000},
  {name:'Kenya', city:'Nairobi', cost:1900},
  {name:'Iceland', city:'Reykjavik', cost:2100},
];
const TRAVEL_GOOD_LINES_P61 = ['toured the local landmarks and took a thousand photos','tried incredible street food','made friends with a group of fellow travelers','found a hidden gem of a cafe','watched the most beautiful sunset of your life'];
const TRAVEL_BAD_LINES_P61 = ['got lost for hours in an unfamiliar city','had your wallet pickpocketed','came down with a nasty case of food poisoning','missed a connecting flight and lost a day of the trip'];
function travelInternationalP61(countryName){
  const c = COUNTRIES_P61.find(x=>x.name===countryName);
  if(!c) return;
  if(state.money<c.cost){ log(`Not enough money for a trip to ${c.name}.`,'bad'); openWorldPanel(); return; }
  state.money -= c.cost;
  if(!state.flags.countriesVisited) state.flags.countriesVisited = [];
  if(!state.flags.countriesVisited.includes(c.name)){
    state.flags.countriesVisited.push(c.name);
    checkAchievement('international_ach');
    if(state.flags.countriesVisited.length>=5) checkAchievement('jetsetter_ach');
  }
  if(chance(70)){
    const line = pick(TRAVEL_GOOD_LINES_P61);
    state.stats.happiness = clamp(state.stats.happiness+rand(6,15),0,100);
    log(`In ${c.city}, you ${line}.`,'good');
  } else {
    const line = pick(TRAVEL_BAD_LINES_P61);
    state.stats.happiness = clamp(state.stats.happiness-rand(2,6),0,100);
    if(line.includes('food poisoning')) state.stats.health = clamp(state.stats.health-8,0,100);
    if(line.includes('pickpocketed')) state.money -= rand(100,500);
    log(`In ${c.city}, you ${line}.`,'bad');
  }
  if(chance(15)){
    const friend = newRelationship('friend', {name:randomFirstName(pick(['Male','Female']))+' '+pick(['Nakamura','Silva','Kowalski','Dubois','Andersen','Osei','Petrov','Nguyen']), age: state.age+rand(-5,5), rel:rand(40,70)});
    state.relationships.push(friend);
    log(`You hit it off with ${friend.name}, a local you met in ${c.city}, and stayed in touch.`,'good');
  }
  openWorldPanel();
}
function moveAbroadP61(countryName){
  const c = COUNTRIES_P61.find(x=>x.name===countryName);
  if(!c) return;
  const moveCost = c.cost*3;
  if(state.money<moveCost){ log(`Not enough money to move to ${c.city}.`,'bad'); openWorldPanel(); return; }
  state.money -= moveCost;
  state.city = c.city;
  state.flags.livedAbroad = true;
  state.stats.happiness = clamp(state.stats.happiness+10,0,100);
  log(`You packed up your life and moved to ${c.city}, ${c.name}. A brand new chapter begins.`,'good');
  newspaper(`${state.name.toUpperCase()} MOVES ABROAD`, `${state.name} has relocated to ${c.city}, ${c.name}, seeking a fresh start.`);
  checkAchievement('expat_ach');

}

/* ---------------------------------------------------------------------
   P62 — Hobbies & Skills: a real skill-building system to back up the
   flavor-only "picked up a hobby" event lines that already existed.
   Ten hobbies, each tied to a stat that practicing nudges upward, with
   an XP/level track (0-10) so mastery actually means something.
   --------------------------------------------------------------------- */
const HOBBIES_P62 = [
  {key:'guitar', name:'Guitar', icon:'🎸', stat:'happiness'},
  {key:'painting', name:'Painting', icon:'🎨', stat:'happiness'},
  {key:'chess', name:'Chess', icon:'♟️', stat:'smarts'},
  {key:'cooking', name:'Cooking', icon:'🍳', stat:'happiness'},
  {key:'martial_arts', name:'Martial Arts', icon:'🥋', stat:'health'},
  {key:'writing', name:'Creative Writing', icon:'✍️', stat:'smarts'},
  {key:'yoga', name:'Yoga', icon:'🧘', stat:'health'},
  {key:'photography', name:'Photography', icon:'📷', stat:'looks'},
  {key:'coding', name:'Coding', icon:'💻', stat:'smarts'},
  {key:'dance', name:'Dance', icon:'💃', stat:'looks'},
];
function practiceHobbyP62(key){
  const h = HOBBIES_P62.find(x=>x.key===key);
  if(!h) return;
  if(!state.hobbies[key]) state.hobbies[key] = {level:0, xp:0};
  const rec = state.hobbies[key];
  const wasZero = rec.level===0 && rec.xp===0;
  rec.xp += rand(8,20);
  while(rec.xp>=100 && rec.level<10){ rec.xp -= 100; rec.level++; }
  if(rec.level>=10) rec.xp = 0;
  state.stats[h.stat] = clamp(state.stats[h.stat]+rand(1,3),0,100);
  state.stats.happiness = clamp(state.stats.happiness+2,0,100);
  if(wasZero) checkAchievement('hobbyist_ach');
  if(rec.level>=10) checkAchievement('hobby_master_ach');
  log(`You spent time on ${h.name}${rec.level>=10?' — you\'ve truly mastered it':''}.`,'good');
  openHobbiesPanelP62();
}
function openHobbiesPanelP62(){
  let html = `<p style="color:var(--sub)">Practicing a hobby builds skill over time and lifts your mood along the way.</p>`;
  HOBBIES_P62.forEach(h=>{
    const rec = state.hobbies[h.key];
    const level = rec?rec.level:0;
    const xp = rec?rec.xp:0;
    const label = level>=10 ? 'MASTERED' : `Level ${level} · ${xp}/100 XP`;
    html += `<div class="list-item"><div class="li-main"><b>${h.icon} ${h.name}</b><span>${label}</span></div>
      <button class="btn" onclick="practiceHobbyP62('${h.key}')">Practice</button></div>`;
  });
  openPanel('Hobbies', html);
}

/* ---------------------------------------------------------------------
   P65 — Pet Breeding & Pet Shows: deepens the existing pet system.
   Two living, same-species pets aged 1+ can be bred for a chance at a
   new litter member; any living pet can be entered into a pet show,
   scored off its happiness/health plus some luck, for placement prizes.
   --------------------------------------------------------------------- */
const PET_BABY_NAMES_P65 = ['Pip','Biscuit','Nugget','Peanut','Clover','Waffles','Bean','Star','Ziggy','Snickers'];
function petsByTypeP65(type){
  return state.pets.map((p,i)=>({p,i})).filter(x=>x.p.alive && x.p.type===type && x.p.age>=1);
}
function breedPetsP65(type){
  const pool = petsByTypeP65(type);
  if(pool.length<2) return;
  const cost = 150;
  if(state.money<cost){ log(`Not enough money for a breeding visit.`,'bad'); openPetCarePanelP15(); return; }
  state.money -= cost;
  const [a,b] = pool;
  if(chance(60)){
    const baby = {name:type+' '+pick(PET_BABY_NAMES_P65), type, age:0, alive:true, happiness:80, health:100, parents:[a.p.name,b.p.name]};
    state.pets.push(baby);
    log(`${a.p.name} and ${b.p.name} had a litter! Welcome, ${baby.name}.`,'good');
    checkAchievement('pet_breeder_ach');
  } else {
    log(`The breeding attempt with ${a.p.name} and ${b.p.name} didn't take this time.`,'neutral');
  }
  openPetCarePanelP15();
}
function enterPetShowP65(idx){
  const p = state.pets[idx]; if(!p || !p.alive) return;
  const health = p.health==null?100:p.health;
  const score = p.happiness*0.4 + health*0.4 + rand(0,20);
  p.happiness = clamp(p.happiness+5,0,100);
  state.stats.happiness = clamp(state.stats.happiness+3,0,100);
  if(score>=90){
    state.money += 2000;
    p.showWins = (p.showWins||0)+1;
    log(`${p.name} took 1st place at the pet show! You win ${fmtMoney(2000)}.`,'good');
    checkAchievement('pet_champion_ach');
    if(p.showWins>=3) checkAchievement('pet_dynasty_ach');
  } else if(score>=70){
    state.money += 800;
    log(`${p.name} placed 2nd at the pet show, winning ${fmtMoney(800)}.`,'good');
  } else if(score>=50){
    state.money += 300;
    log(`${p.name} placed 3rd at the pet show, winning ${fmtMoney(300)}.`,'good');
  } else {
    log(`${p.name} didn't place at the pet show, but had a great time.`,'neutral');
  }

}

/* ---------------------------------------------------------------------
   P66 — Prenuptial Agreement: ties the existing Wedding Planner (P56)
   and Divorce Settlement (P60) systems together. Signing a prenup with
   a dating partner before proposing locks in the player's current
   money as protected; if that marriage ever ends in divorce, fileDivorce()
   (which every divorce path already routes through) refunds whatever
   of that protected amount was lost in the split.
   --------------------------------------------------------------------- */
function signPrenupP66(id){
  const partner = state.relationships.find(r=>r.id===id);
  if(!partner) return;
  const cost = 500;
  if(state.money<cost){ log(`Not enough money for a lawyer to draft a prenup.`,'bad'); openRelationshipsPanel(); return; }
  state.money -= cost;
  state.flags.prenupPartnerId = id;
  log(`You and ${partner.name} signed a prenuptial agreement, protecting what you brought into the marriage.`,'neutral');
  checkAchievement('prenup_ach');
  openRelationshipsPanel();
}
const _origProposeMarriage_P66 = proposeMarriage;
proposeMarriage = function(id){
  const wasSpouseId = state.spouseId;
  const hadPrenupWithThem = state.flags.prenupPartnerId===id;
  _origProposeMarriage_P66(id);
  if(state.spouseId && state.spouseId!==wasSpouseId && hadPrenupWithThem){
    state.flags.hasPrenup = true;
    state.flags.prenupProtectedAmount = state.money;
  }
};
const _origFileDivorce_P66 = fileDivorce;
fileDivorce = function(){
  const preMoney = state.money;
  const hadPrenup = !!state.flags.hasPrenup;
  const protectedAmt = state.flags.prenupProtectedAmount||0;
  _origFileDivorce_P66();
  if(hadPrenup){
    const lost = Math.max(0, preMoney-state.money);
    const refund = Math.min(protectedAmt, lost);
    if(refund>0){
      state.money += refund;
      log(`Thanks to your prenup, ${fmtMoney(refund)} of your pre-marriage assets stayed protected.`,'neutral');
    }
  }
  state.flags.hasPrenup = false;
  state.flags.prenupProtectedAmount = 0;
  state.flags.prenupPartnerId = null;
};
const _origOpenRelationshipsPanel_P66 = openRelationshipsPanel;
openRelationshipsPanel = function(){
  _origOpenRelationshipsPanel_P66();
  const datingPartner = state.relationships.find(r=>r.alive && r.type==='datingpartner');
  if(datingPartner && state.flags.prenupPartnerId!==datingPartner.id){
    const body = $('panel-body');
    const btn = document.createElement('button');
    btn.className = 'btn btn-block';
    btn.textContent = `📝 Draft a Prenup with ${datingPartner.name} ($500)`;
    btn.onclick = ()=>signPrenupP66(datingPartner.id);
    body.appendChild(btn);

/* ---------------------------------------------------------------------
   P67 — Greek Life: college used to only have flavor-only lines about
   "joining Greek life." This adds a real Rush -> Pledge -> Member ->
   Officer -> President ladder with a genuine hazing/pledge-task risk
   (a small chance of it going badly enough to wash out) and social
   mixers that build reputation toward the next rank.
   --------------------------------------------------------------------- */
const GREEK_ORGS_P67 = ['Alpha Beta Gamma','Delta Epsilon Zeta','Kappa Theta Iota','Sigma Chi Omega','Omega Phi Psi'];
function rushGreekLifeP67(name){
  if(state.eduStage!=='college' || state.greekLife) return;
  const cost = 100;
  if(state.money<cost){ log(`Not enough money for rush week fees.`,'bad'); openGreekLifePanelP67(); return; }
  state.money -= cost;
  if(chance(70)){
    state.greekLife = {org:name, rank:'Pledge', reputation:0};
    log(`You got a bid from ${name}! Pledge season begins.`,'good');
  } else {
    log(`You didn't get a bid from ${name} this rush season. Better luck next time.`,'bad');
  }
  openGreekLifePanelP67();
}
function pledgeTaskP67(){
  const g = state.greekLife; if(!g || g.rank!=='Pledge') return;
  if(chance(75)){
    g.reputation += rand(15,30);
    state.stats.happiness = clamp(state.stats.happiness+4,0,100);
    log(`You aced a pledge task for ${g.org}. Respect is building.`,'good');
  } else {
    state.stats.health = clamp(state.stats.health-rand(4,10),0,100);
    state.stats.happiness = clamp(state.stats.happiness-rand(2,6),0,100);
    log(`A rough pledge task for ${g.org} took a toll on you.`,'bad');
    if(chance(15)){
      log(`It was too much. You dropped out of ${g.org}.`,'bad');
      state.greekLife = null;
      openGreekLifePanelP67();
      return;
    }
  }
  if(g.reputation>=100){
    g.rank = 'Member'; g.reputation = 0;
    log(`You're officially a full member of ${g.org}!`,'good');
    checkAchievement('greek_member_ach');
  }
  openGreekLifePanelP67();
}
function attendMixerP67(){
  const g = state.greekLife; if(!g || g.rank==='Pledge') return;
  state.stats.happiness = clamp(state.stats.happiness+rand(3,8),0,100);
  g.reputation += rand(5,15);
  log(`You partied at a ${g.org} mixer.`,'good');
  if(g.rank==='Member' && g.reputation>=100){
    g.rank = 'Officer'; g.reputation = 0;
    log(`Your leadership got noticed — you're now an Officer in ${g.org}!`,'good');
    checkAchievement('greek_officer_ach');
  } else if(g.rank==='Officer' && g.reputation>=150){
    g.rank = 'President'; g.reputation = 0;
    log(`You were elected President of ${g.org}!`,'good');
    checkAchievement('greek_president_ach');
  }
  openGreekLifePanelP67();
}
function leaveGreekLifeP67(){
  if(!state.greekLife) return;
  log(`You left ${state.greekLife.org}.`,'neutral');

  openGreekLifePanelP67();
}
function openGreekLifePanelP67(){
  let html = '';
  if(state.greekLife){
    const g = state.greekLife;
    html += `<div class="list-item"><div class="li-main"><b>${g.org}</b><span>${g.rank}${g.rank!=='President'?(' · '+g.reputation+'/'+(g.rank==='Officer'?150:100)+' rep'):''}</span></div></div>`;
    if(g.rank==='Pledge') html += `<button class="btn btn-block" onclick="pledgeTaskP67()">Complete a Pledge Task</button>`;
    else html += `<button class="btn btn-block" onclick="attendMixerP67()">Attend a Mixer</button>`;

/* ---------------------------------------------------------------------
   P68 — Home Renovation & House Selling: houses could be bought but
   never sold, and had no way to increase in value beyond the purchase
   price. This adds a House Manager panel with six renovation options
   (each raising both resale value and happiness) and a real Sell
   button. House objects gain an optional .renovations array lazily,
   the first time a renovation is applied — freshState() doesn't need
   to know about it since it only exists once a house is purchased.
   --------------------------------------------------------------------- */
const RENOVATION_OPTIONS_P68 = [
  {name:'Kitchen Remodel', cost:15000, valueBoost:20000, happyBoost:5},
  {name:'Swimming Pool', cost:35000, valueBoost:45000, happyBoost:8},
  {name:'Home Theater', cost:20000, valueBoost:25000, happyBoost:6},
  {name:'Smart Home System', cost:12000, valueBoost:16000, happyBoost:4},
  {name:'Backyard Landscaping', cost:8000, valueBoost:10000, happyBoost:3},
  {name:'Master Suite Addition', cost:50000, valueBoost:65000, happyBoost:10},
];
function renovateHouseP68(idx, renoName){
  const h = state.assets.houses[idx]; if(!h) return;
  const r = RENOVATION_OPTIONS_P68.find(x=>x.name===renoName); if(!r) return;
  if(!h.renovations) h.renovations = [];
  if(h.renovations.includes(renoName)) return;
  if(state.money<r.cost){ log(`Not enough money for a ${renoName.toLowerCase()}.`,'bad'); openHouseManagerP68(); return; }
  state.money -= r.cost;
  h.value += r.valueBoost;
  h.renovations.push(renoName);
  state.stats.happiness = clamp(state.stats.happiness+r.happyBoost,0,100);
  log(`You renovated ${h.name} with a ${renoName}. It's worth ${fmtMoney(h.value)} now.`,'good');
  if(h.renovations.length>=3) checkAchievement('renovator_ach');
  openHouseManagerP68();
}
function sellHouseP68(idx){
  const h = state.assets.houses[idx]; if(!h) return;
  const sale = Math.round(h.value*0.85);
  state.money += sale;
  log(`You sold ${h.name} for ${fmtMoney(sale)}.`,'neutral');
  state.assets.houses.splice(idx,1);
  openHouseManagerP68();
}
function openHouseManagerP68(){
  let html = '';
  if(!state.assets.houses.length){
    html += `<p style="color:var(--sub)">You don't own any houses yet.</p>`;
  }
  state.assets.houses.forEach((h,idx)=>{
    html += `<div class="list-item"><div class="li-main"><b>${h.name}</b><span>${fmtMoney(h.value)}${h.renovations&&h.renovations.length?(' · '+h.renovations.length+' upgrade'+(h.renovations.length===1?'':'s')):''}</span></div>
      <button class="btn btn-danger" onclick='sellHouseP68(${idx})'>Sell</button></div>`;
    RENOVATION_OPTIONS_P68.forEach(r=>{
      const done = h.renovations && h.renovations.includes(r.name);
      if(done) return;
      html += `<button class="btn btn-block" onclick='renovateHouseP68(${idx},${JSON.stringify(r.name)})'>${r.name} (${fmtMoney(r.cost)})</button>`;
    });
    html += `<hr style="border-color:var(--border)">`;
  });
  openPanel('House Manager', html);
}
const _origOpenAssetsPanel_P68 = openAssetsPanel;
openAssetsPanel = function(){
  _origOpenAssetsPanel_P68();
  if(!state.assets.houses.length) return;
  const body = $('panel-body');
  const btn = document.createElement('button');
  btn.className = 'btn btn-block btn-accent';
  btn.textContent = '🏠 House Manager';
  btn.onclick = openHouseManagerP68;
  body.appendChild(btn);
};

/* ---------------------------------------------------------------------
   P69 — Author career: a distinct creative path from the existing
   Music/Acting/Modeling fame tracks. Write a manuscript (quality driven
   by smarts and the Creative Writing hobby level from P62), submit it
   to publishers for a chance at an advance, and once published it
   keeps earning royalties every year — with a real shot at hitting the
   bestseller list.
   --------------------------------------------------------------------- */
const BOOK_GENRES_P69 = ['Mystery','Romance','Sci-Fi','Fantasy','Thriller','Memoir','Self-Help','Historical Fiction'];
const BOOK_TITLE_ADJ_P69 = ['The Last','Shadows of','Whispers of the','The Secret','Beyond the','The Forgotten'];
const BOOK_TITLE_NOUN_P69 = ['Garden','Kingdom','Ocean','Mirror','City','Storm','Heart','Truth'];
function generateBookTitleP69(){ return pick(BOOK_TITLE_ADJ_P69)+' '+pick(BOOK_TITLE_NOUN_P69); }
function writeBookP69(genre){
  const hobbyLevel = (state.hobbies.writing && state.hobbies.writing.level) || 0;
  const quality = clamp(Math.round(30+state.stats.smarts*0.4+hobbyLevel*3+rand(-10,10)),1,100);
  const book = {title:generateBookTitleP69(), genre, quality, sales:0, published:false, revisions:0};
  state.author.books.push(book);
  state.stats.happiness = clamp(state.stats.happiness+3,0,100);
  log(`You finished writing your manuscript, "${book.title}" — a ${genre.toLowerCase()} novel.`,'good');
  checkAchievement('author_ach');
  openAuthorPanelP69();
}
function submitToPublisherP69(idx){
  const book = state.author.books[idx]; if(!book || book.published) return;
  const acceptChance = clamp(20+book.quality*0.6,5,90);
  if(chance(acceptChance)){
    book.published = true;
    const advance = Math.round(rand(500,3000)*(book.quality/50));
    state.money += advance;
    log(`"${book.title}" was accepted for publication! You received a ${fmtMoney(advance)} advance.`,'good');
    newspaper(`LOCAL AUTHOR ${state.name.toUpperCase()} PUBLISHES NEW NOVEL`, `"${book.title}" hits shelves this week.`, 'Arts & Culture');
    const publishedCount = state.author.books.filter(b=>b.published).length;
    if(publishedCount>=5) checkAchievement('prolific_author_ach');
  } else {
    book.revisions = (book.revisions||0)+1;
    book.quality = clamp(book.quality+5,1,100);
    state.stats.happiness = clamp(state.stats.happiness-2,0,100);
    log(`"${book.title}" was rejected by the publisher. Back to revisions.`,'bad');
  }
  openAuthorPanelP69();
}
function tickBookRoyaltiesP69(){
  if(!state.author || !state.author.books.length) return;
  state.author.books.forEach(b=>{
    if(!b.published) return;
    const growth = Math.round(rand(50,300)*(b.quality/50));
    b.sales += growth;
    const royalty = Math.round(growth*2.5);
    state.money += royalty;
    if(b.sales>=100000 && !b.bestseller){
      b.bestseller = true;
      log(`"${b.title}" hit the BESTSELLER list!`,'good');
      checkAchievement('bestseller_ach');
      newspaper(`"${b.title.toUpperCase()}" HITS BESTSELLER LIST`, `${state.name}'s novel is flying off shelves nationwide.`, 'Arts & Culture');
    }
  });
}
function openAuthorPanelP69(){
  let html = `<p style="color:var(--sub)">Writing draws on your smarts — and a knack for Creative Writing helps too.</p>`;
  if(state.author.books.length){
    html += `<b>Your Books</b>`;
    state.author.books.forEach((b,i)=>{
      const status = b.published ? (b.bestseller?'BESTSELLER':`Published · ${b.sales} copies sold`) : `Unpublished · Quality ${b.quality}`;
      html += `<div class="list-item"><div class="li-main"><b>${b.title}</b><span>${b.genre} · ${status}</span></div>
        ${!b.published?`<button class="btn" onclick='submitToPublisherP69(${i})'>Submit</button>`:''}</div>`;
    });
    html += `<hr style="border-color:var(--border)">`;
  }
  html += `<b>Write a New Book</b>`;
  BOOK_GENRES_P69.forEach(g=>{ html += `<button class="btn btn-block" onclick='writeBookP69(${JSON.stringify(g)})'>Write a ${g} Novel</button>`; });
  openPanel('Author', html);
}
const _origOpenActivitiesPanel_P69 = openActivitiesPanel;

  const body = $('panel-body');
  const hr = document.createElement('hr'); hr.style.borderColor='var(--border)'; body.appendChild(hr);
  const publishedCount = state.author.books.filter(b=>b.published).length;

/* ---------------------------------------------------------------------
   P75 — Sibling Rivalry & Inheritance Disputes: hooked directly into
   P57's tickRelationshipDeathsP57 (my own earlier same-session code,
   edited in place rather than re-wrapped) so that a parent's death now
   has real financial and family consequences. With no living siblings,
   the player inherits everything; with siblings, there's a 30% chance
   of a bitter dispute (a smaller, uneven cut and a damaged relationship
   with one sibling) versus an even, relationship-building split.
   handleParentInheritanceP75 is a plain function declaration, so it's
   hoisted and safely callable from P57 above despite being defined here.
   --------------------------------------------------------------------- */
const INHERITANCE_POOL_BY_TIER_P75 = {
  'Poor': [1000,8000], 'Working Class': [3000,20000], 'Middle Class': [8000,50000],
  'Wealthy': [30000,150000], 'Elite': [100000,500000],
};
function handleParentInheritanceP75(parent){
  const range = INHERITANCE_POOL_BY_TIER_P75[state.flags.familyWealthTier] || [5000,40000];
  const pool = rand(range[0],range[1]);
  const livingSiblings = state.relationships.filter(r=>r.alive && r.type==='sibling');
  if(!livingSiblings.length){
    state.money += pool;
    log(`As their only surviving child, you inherited ${fmtMoney(pool)} from ${parent.name}'s estate.`,'good');
  } else if(chance(30)){
    const playerShare = clamp(0.3+((parent.rel-50)/200)+rand(-10,10)/100,0.1,0.8);
    const playerCut = Math.round(pool*playerShare);
    state.money += playerCut;
    state.stats.happiness = clamp(state.stats.happiness-5,0,100);
    const rivalSib = pick(livingSiblings);
    rivalSib.rel = clamp(rivalSib.rel-rand(10,25),0,100);
    log(`The inheritance from ${parent.name} turned into a bitter dispute with ${rivalSib.name}. You ended up with ${fmtMoney(playerCut)} after lawyers took their cut.`,'bad');
    checkAchievement('inheritance_dispute_ach');
  } else {
    const share = Math.round(pool/(livingSiblings.length+1));
    state.money += share;
    livingSiblings.forEach(s=>{ s.rel = clamp(s.rel+rand(2,6),0,100); });
    log(`You and your ${livingSiblings.length} sibling${livingSiblings.length===1?'':'s'} split ${parent.name}'s ${fmtMoney(pool)} estate evenly. You received ${fmtMoney(share)}.`,'good');
  }
  checkAchievement('inheritor_ach');
}

function openBodybuildingPanelP80(){
  const tierIdx = state.bodybuilding.tier;
  let html = `<p style="color:var(--sub)">Competitive bodybuilding rewards a strong balance of health and looks, built through gym workouts.</p>`;
  html += `<div class="list-item"><div class="li-main"><b>Workouts Logged</b><span>${state.bodybuilding.workouts}</span></div></div>`;
  if(tierIdx>=BODYBUILDING_TIERS_P80.length){
    html += `<p style="color:var(--gold)">🏆 You've conquered every tier — an Olympia Champion for the ages.</p>`;
  } else {
    const t = BODYBUILDING_TIERS_P80[tierIdx];
    const ready = state.bodybuilding.workouts>=t.minWorkouts;
    html += `<div class="list-item"><div class="li-main"><b>${t.name}</b><span>${ready?'Ready to compete':('Needs '+t.minWorkouts+' workouts ('+state.bodybuilding.workouts+'/'+t.minWorkouts+')')}</span></div>
      <button class="btn"${ready?'':' disabled'} onclick="competeBodybuildingP80()">Compete</button></div>`;
  }
  openPanel('Bodybuilding', html);
}
const _origOpenActivitiesPanel_P80 = openActivitiesPanel;
openActivitiesPanel = function(){
  _origOpenActivitiesPanel_P80();
  if(state.inPrison) return;
  const body = $('panel-body');
  const btn = document.createElement('button');
  btn.className = 'btn btn-block';
  btn.textContent = '🏆 Bodybuilding' + (state.bodybuilding.tier?(' (Tier '+state.bodybuilding.tier+')'):'');
  btn.onclick = openBodybuildingPanelP80;
  body.appendChild(btn);
};
Object.assign(ACHIEVEMENTS, { bodybuilder_ach:'Won your first bodybuilding competition', olympia_champion_ach:'Won every bodybuilding tier' });
</script>
