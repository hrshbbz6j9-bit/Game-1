<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LifePlay</title>
<style>
  /* ==========================================================================
     LifePlay visual identity, take three: "THE GAZETTE" — your life told as
     a personal daily broadsheet. Grounded in a mechanic the game already
     had (the newspaper() front-page cards for big moments) and pushed
     across the whole interface: a masthead, an almanac box in place of
     stat bars/rings, life events set as newspaper column copy instead of
     app cards, section-tab navigation, and an Obituaries page at death.
     Deliberately single-theme (aged newsprint + one spot ink color) rather
     than a light/dark pair — a printed page doesn't have a dark mode.
     All existing JS still renders through the same custom property NAMES
     (--bg, --panel, --panel2, --accent, --accent2, --danger, --text, --sub,
     --border, plus the --gold/--ink-line/--life-* tokens this project
     introduced), so only values change here; nothing downstream breaks.
     ========================================================================== */
  :root{
    --bg:#DBD4BC;           /* the desk the paper sits on */
    --panel:#F3EEDE;        /* newsprint page color */
    --panel2:#E7DFC5;       /* secondary surface — byline boxes, inputs */
    --accent:#3C6140;       /* "good" ink-green */
    --accent2:#2A4566;      /* "info" ink-blue */
    --danger:#9C231C;       /* "bad" ink-red */
    --warn:#8A6A1E;         /* amber ink */
    --text:#1C1A16;         /* warm black ink */
    --sub:#69614F;          /* byline grey */
    --border:#C6BC9C;       /* hairline rule on paper */
    --gold:#9C231C;         /* the one spot color — masthead, Age Up, seals */
    --gold-deep:#6E190F;
    --ink-line:#1C1A16;
    --life-red:#9C231C; --life-green:#3C6140; --life-blue:#2A4566; --life-pink:#6C3450; --life-gold:#8A6A1E;
    --font-display: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    --font-body: Georgia, 'Times New Roman', serif;
    --font-caption: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);font-family:var(--font-body);color:var(--text);}
  #phone{max-width:430px;margin:0 auto;min-height:100vh;background:var(--panel);display:flex;flex-direction:column;position:relative;overflow-x:hidden;box-shadow:0 0 0 1px var(--border);
    background-image:repeating-linear-gradient(0deg, rgba(0,0,0,.015) 0px, rgba(0,0,0,.015) 1px, transparent 1px, transparent 3px);}
  .hidden{display:none !important;}
  h1,h2,h3{font-family:var(--font-display); text-wrap:balance;}
  button, input, select{font-family:inherit;}
  button:focus-visible, input:focus-visible, select:focus-visible{outline:2px solid var(--gold-deep); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }
  .masthead{text-align:center;padding:14px 14px 8px;background:var(--panel);}
  .masthead-title{font-family:var(--font-display);font-weight:700;font-size:1.7em;letter-spacing:.03em;text-transform:uppercase;border-top:3px double var(--ink-line);border-bottom:3px double var(--ink-line);padding:6px 0;}
  .masthead-sub{font-family:var(--font-caption);font-size:.62em;letter-spacing:.14em;text-transform:uppercase;color:var(--sub);margin-top:5px;font-weight:600;}
  /* Loading */
  #screen-loading{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);}
  #screen-loading h1{font-family:var(--font-display);font-size:2.5em;letter-spacing:.02em;margin-bottom:2px;font-weight:700;color:var(--text);text-transform:uppercase;border-top:3px double var(--ink-line);border-bottom:3px double var(--ink-line);padding:8px 14px;}
  #screen-loading p{color:var(--sub);margin-top:10px;font-family:var(--font-caption);font-size:.75em;letter-spacing:.1em;text-transform:uppercase;font-weight:600;}
  .loadbar-track{width:70%;height:3px;background:var(--panel2);overflow:hidden;margin-top:30px;}
  .loadbar-fill{height:100%;width:0%;background:var(--gold);transition:width .1s linear;}
  #loading-tip{margin-top:14px;font-size:.85em;color:var(--sub);text-align:center;padding:0 20px;font-style:italic;}
  /* New life */
  #screen-newlife{padding:24px 20px;display:flex;flex-direction:column;gap:14px;min-height:100vh;background:var(--bg);}
  #screen-newlife h2{text-align:center;margin-bottom:0;font-weight:700;text-transform:uppercase;letter-spacing:.03em;border-top:3px double var(--ink-line);border-bottom:3px double var(--ink-line);padding:8px 0;}
  .field label{display:block;font-size:.72em;color:var(--sub);margin-bottom:4px;font-weight:700;font-family:var(--font-caption);text-transform:uppercase;letter-spacing:.08em;}
  .field input, .field select{width:100%;padding:11px;border-radius:2px;border:1px solid var(--ink-line);background:var(--panel);color:var(--text);font-size:1em;font-family:var(--font-body);}
  .btn{padding:12px 16px;border-radius:2px;border:1.5px solid var(--ink-line);background:var(--panel2);color:var(--text);font-size:.92em;font-weight:700;font-family:var(--font-caption);text-transform:uppercase;letter-spacing:.05em;cursor:pointer;text-align:center;transition:transform .08s, box-shadow .08s;box-shadow:2px 2px 0 var(--ink-line);}
  .btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink-line);}
  .btn-primary{background:var(--gold);color:#F3EEDE;border-color:var(--gold-deep);}
  .btn-danger{background:var(--danger);color:#F3EEDE;}
  .btn-accent{background:var(--accent2);color:#F3EEDE;}
  .btn-block{width:100%;}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}
  /* Game screen */
  #screen-game{display:flex;flex-direction:column;height:100vh;background:var(--bg);}
  #header{padding:10px 14px 12px;background:var(--panel);border-bottom:2px solid var(--ink-line);}
  #header .who{display:flex;align-items:center;gap:10px;}
  .avatar-ring{width:46px;height:46px;border-radius:2px;background:var(--panel2);border:1.5px solid var(--ink-line);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  #header .avatar{font-size:1.6em;line-height:1;filter:grayscale(35%);}
  #header .who-info{flex:1;min-width:0;}
  #header .who-info b{font-size:1.05em;font-family:var(--font-display);font-weight:700;display:block;}
  #header .who-info span{display:block;font-size:.68em;color:var(--sub);font-family:var(--font-caption);text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
  .cash-pill{font-weight:700;color:var(--text);background:var(--panel2);border:1.5px solid var(--ink-line);border-radius:2px;padding:4px 8px;font-size:.78em;white-space:nowrap;font-variant-numeric:tabular-nums;font-family:var(--font-caption);}
  .almanac{margin-top:10px;border:1px solid var(--ink-line);border-radius:2px;}
  .almanac-label{font-family:var(--font-caption);font-size:.58em;letter-spacing:.14em;text-transform:uppercase;color:var(--sub);text-align:center;padding:3px 0;border-bottom:1px solid var(--border);font-weight:700;}
  .almanac-weather{font-family:var(--font-caption);font-size:.62em;color:var(--sub);text-align:center;padding:4px 0;border-top:1px solid var(--border);letter-spacing:.02em;}
  .stats{display:flex;}
  .stat-badge{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px 5px;border-right:1px solid var(--border);animation:statPop .28s ease;}
  .stat-badge:last-child{border-right:none;}
  .stat-badge .stat-ic{font-family:var(--font-caption);font-size:.56em;letter-spacing:.05em;text-transform:uppercase;color:var(--sub);font-weight:700;}
  .stat-badge .stat-num{font-size:1.05em;font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--font-display);border-bottom:2px solid var(--stat-color, var(--ink-line));padding:0 3px 1px;}
  @keyframes statPop{ from{opacity:.3;} to{opacity:1;} }
  #log{flex:1;overflow-y:auto;padding:6px 16px 12px;display:flex;flex-direction:column-reverse;}
  .logline{padding:9px 0;font-size:.92em;line-height:1.45;border-bottom:1px solid var(--border);font-family:var(--font-body);}
  .logline .age{color:var(--text);font-family:var(--font-caption);font-size:.68em;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-right:6px;}
  .logline.good .age{color:var(--accent);}
  .logline.bad .age{color:var(--danger);}
  .logline.neutral .age{color:var(--accent2);}
  .newspaper{background:var(--panel);color:var(--text);border-top:4px double var(--ink-line);border-bottom:4px double var(--ink-line);padding:14px 4px;margin:6px 0;}
  .newspaper .np-name{font-family:var(--font-caption);font-size:.6em;letter-spacing:.25em;text-transform:uppercase;text-align:center;color:var(--gold);font-weight:800;margin-bottom:4px;}
  .newspaper h3{margin:0 0 6px;font-size:1.3em;text-align:center;line-height:1.15;font-weight:700;text-wrap:balance;}
  .newspaper p{margin:0;font-size:.82em;text-align:center;font-style:italic;color:var(--sub);}
  .sports-card{background:var(--panel2);border:3px solid var(--ink-line);padding:12px 14px;margin:8px 0;}
  .sports-card .sd-eyebrow{font-family:var(--font-caption);font-size:.58em;letter-spacing:.2em;text-transform:uppercase;color:var(--accent2);font-weight:800;}
  .sports-card .sd-headline{font-family:var(--font-caption);font-size:1.15em;font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:1.2;margin:3px 0 4px;}
  .sports-card .sd-sub{font-family:var(--font-caption);font-size:.78em;color:var(--sub);}
  .business-card{background:var(--panel2);border:1px solid var(--ink-line);border-left:5px solid var(--accent);padding:11px 13px;margin:8px 0;}
  .business-card .bd-eyebrow{font-family:var(--font-caption);font-size:.58em;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:800;}
  .business-card .bd-headline{font-family:var(--font-display);font-size:1.05em;font-weight:700;margin:3px 0 3px;}
  .business-card .bd-sub{font-family:var(--font-caption);font-size:.78em;color:var(--sub);font-variant-numeric:tabular-nums;}
  #bottomnav{display:grid;grid-template-columns:repeat(6,1fr);background:var(--panel);border-top:2px solid var(--ink-line);}
  #bottomnav button{background:none;border:none;border-right:1px solid var(--border);color:var(--text);padding:8px 2px 7px;font-family:var(--font-caption);font-size:.58em;font-weight:700;text-transform:uppercase;letter-spacing:.02em;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;}
  #bottomnav button:last-child{border-right:none;}
  #bottomnav button .ic{font-size:1.15em;filter:grayscale(55%);}
  #ageup-btn{position:sticky;bottom:0;margin:10px;width:calc(100% - 20px);border-radius:2px;padding:14px;font-size:.95em;letter-spacing:.08em;border:2px solid var(--gold-deep);position:relative;}
  /* Panel / modal */
  #panel-overlay{position:absolute;inset:0;background:rgba(28,26,22,.55);display:flex;align-items:flex-end;z-index:50;}
  #panel{background:var(--panel);width:100%;max-height:82vh;display:flex;flex-direction:column;overflow:hidden;border-top:3px double var(--ink-line);}
  #panel-head{padding:12px 16px;border-bottom:1px solid var(--ink-line);display:flex;justify-content:space-between;align-items:center;background:var(--panel);}
  #panel-head h3{margin:0;font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:1em;}
  #panel-body{padding:6px 16px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:0;}
  .close-x{background:none;border:1px solid var(--ink-line);border-radius:50%;width:24px;height:24px;color:var(--text);font-size:1em;cursor:pointer;line-height:1;}
  .list-item{background:none;border:none;border-bottom:1px solid var(--border);border-radius:0;padding:10px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:none;}
  .list-item .li-main b{display:block;font-family:var(--font-display);font-weight:700;}
  .list-item .li-main span{font-size:.75em;color:var(--sub);font-family:var(--font-caption);}
  #panel-body > .btn{margin:5px 0;}
  .pill{display:inline-block;padding:2px 8px;font-size:.65em;font-weight:700;font-family:var(--font-caption);text-transform:uppercase;letter-spacing:.03em;background:none;color:var(--gold);border:1px solid var(--gold);border-radius:2px;}
  .letter{padding:10px 0 10px 14px;border-left:3px solid var(--border);border-bottom:1px solid var(--border);font-style:italic;font-size:.9em;line-height:1.45;color:var(--sub);}
  .letter .letter-head{display:block;font-style:normal;font-family:var(--font-caption);font-size:.62em;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:800;margin-bottom:3px;}
  .letter .letter-sig{display:block;font-style:normal;font-weight:700;color:var(--text);margin-top:4px;font-size:.85em;}
  .classified{border:1px dashed var(--ink-line);padding:9px 10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .classified .cl-text{font-size:.85em;}
  .classified .cl-text b{display:block;font-family:var(--font-display);}
  .classified .cl-text span{color:var(--sub);font-size:.85em;font-family:var(--font-caption);}
  #modal-overlay{position:absolute;inset:0;background:rgba(28,26,22,.7);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;}
  #modal-card{background:var(--panel);border:3px double var(--ink-line);border-radius:0;padding:20px;max-width:360px;width:100%;max-height:85vh;overflow-y:auto;}
  #modal-card h3{margin-top:0;font-weight:700;text-transform:uppercase;letter-spacing:.03em;text-align:center;border-bottom:1px solid var(--border);padding-bottom:8px;}
  #modal-card .choices{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  /* Death screen — the Obituaries page */
  #screen-dead{padding:0 0 28px;text-align:center;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;align-items:center;}
  .obit-masthead{width:100%;background:var(--panel);padding:16px 14px 10px;border-bottom:3px double var(--ink-line);}
  .obit-masthead .section{font-family:var(--font-caption);font-size:.62em;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);font-weight:800;}
  .obit-masthead h1{font-size:1.8em;margin:4px 0 0;text-transform:uppercase;letter-spacing:.02em;font-weight:700;}
  .obit-photo{width:64px;height:64px;border-radius:2px;background:var(--panel2);border:1.5px solid var(--ink-line);display:flex;align-items:center;justify-content:center;font-size:2em;margin:16px auto 4px;filter:grayscale(45%);}
  .obit-photo-cap{font-family:var(--font-caption);font-size:.56em;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);margin-bottom:10px;}
  .obit-name{font-size:1.3em;font-weight:700;margin:0 0 2px;}
  .obit-years{color:var(--sub);font-family:var(--font-caption);font-size:.78em;margin-bottom:12px;}
  .obit-body{max-width:320px;padding:0 22px;font-size:.92em;line-height:1.6;text-align:left;color:var(--text);}
  .obit-body p{margin:0 0 10px;}
  .almanac-death{margin:16px 22px 0;border:1px solid var(--ink-line);width:calc(100% - 44px);max-width:320px;}
  .almanac-death .almanac-label{background:var(--panel2);}
  .almanac-death-row{display:flex;justify-content:space-between;padding:6px 12px;border-bottom:1px solid var(--border);font-size:.82em;font-family:var(--font-caption);}
  .almanac-death-row:last-child{border-bottom:none;}
  .almanac-death-row b{font-family:var(--font-display);}
  .legacy-badge{font-size:2.6em;font-weight:700;margin:2px 0 0;font-family:var(--font-display);color:var(--gold);}
  .legacy-grade{font-size:.85em;color:var(--sub);font-weight:600;font-family:var(--font-caption);}
  ::-webkit-scrollbar{width:6px;} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
</style>
</head>
<body>
<div id="phone">

  <div id="screen-loading">
    <h1>LifePlay</h1>
    <p>a life simulator</p>
    <div class="loadbar-track"><div class="loadbar-fill" id="loadbar-fill"></div></div>
    <div id="loading-tip">Loading...</div>
  </div>

  <div id="screen-newlife" class="hidden">
    <h2>New Life</h2>
    <div class="field">
      <label>First Name</label>
      <input id="nl-first" type="text" placeholder="Random">
    </div>
    <div class="field">
      <label>Last Name</label>
      <input id="nl-last" type="text" placeholder="Random">
    </div>
    <div class="field">
      <label>Gender</label>
      <select id="nl-gender">
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Nonbinary">Nonbinary</option>
      </select>
    </div>
    <div class="field">
      <label>City</label>
      <select id="nl-city"></select>
    </div>
    <button class="btn btn-primary btn-block" id="nl-start" style="margin-top:10px;">Start Life</button>
  </div>

  <div id="screen-game" class="hidden">
    <div class="masthead">
      <div class="masthead-title" id="masthead-title">The Gazette</div>
      <div class="masthead-sub" id="masthead-sub">Chronicling One Life, Daily</div>
    </div>
    <div id="header">
      <div class="who">
        <div class="avatar-ring"><div class="avatar" id="hd-avatar">👶</div></div>
        <div class="who-info">
          <b id="hd-name">-</b>
          <span id="hd-sub">-</span>
        </div>
        <div class="cash-pill">💵 <span id="hd-money">$0</span></div>
      </div>
      <div class="almanac">
        <div class="almanac-label">Today's Almanac</div>
        <div class="stats" id="hd-stats"></div>
        <div class="almanac-weather" id="hd-weather"></div>
      </div>
    </div>
    <div id="log"></div>
    <button class="btn btn-primary" id="ageup-btn">📰 Next Edition</button>
    <div id="bottomnav">
      <button data-panel="career"><span class="ic">💼</span>Career</button>
      <button data-panel="assets"><span class="ic">💰</span>Assets</button>
      <button data-panel="relationships"><span class="ic">❤️</span>People</button>
      <button data-panel="activities"><span class="ic">🎲</span>Activities</button>
      <button data-panel="world"><span class="ic">🌍</span>World</button>
      <button data-panel="profile"><span class="ic">👤</span>Profile</button>
    </div>
  </div>

  <div id="screen-dead" class="hidden"></div>

  <div id="panel-overlay" class="hidden">
    <div id="panel">
      <div id="panel-head"><h3 id="panel-title">Panel</h3><button class="close-x" id="panel-close">✕</button></div>
      <div id="panel-body"></div>
    </div>
  </div>

  <div id="modal-overlay" class="hidden">
    <div id="modal-card"></div>
  </div>

</div>
<script>
'use strict';
/* =========================================================================
   LIFEPLAY — single file life simulator
   ========================================================================= */

/* ============================ UTILITIES ================================ */
function $(id){ return document.getElementById(id); }
function rand(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[rand(0,arr.length-1)]; }
function chance(pct){ return Math.random()*100 < pct; }
function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
function fmtMoney(n){
  n = Math.round(n);
  const neg = n<0; n = Math.abs(n);
  let s = n.toLocaleString('en-US');
  return (neg?'-$':'$')+s;
}
function uid(){ return 'id'+Math.random().toString(36).slice(2,10); }

/* ============================ DATA: STATIC =============================== */
const CITIES = ["New York","Los Angeles","Chicago","Houston","Miami","Las Vegas","Seattle","Boston",
  "Austin","Denver","Atlanta","Nashville","Phoenix","Portland","New Orleans","San Francisco"];

const MALE_FIRST = ["James","John","Robert","Michael","David","William","Richard","Joseph","Thomas","Charles",
  "Daniel","Matthew","Anthony","Mark","Andrew","Joshua","Kevin","Brian","Tyler","Jordan"];
const FEMALE_FIRST = ["Mary","Patricia","Jennifer","Linda","Elizabeth","Barbara","Susan","Jessica","Sarah","Karen",
  "Lisa","Nancy","Emily","Amanda","Ashley","Megan","Olivia","Sophia","Ava","Mia"];
const NB_FIRST = ["Alex","Jordan","Taylor","Casey","Riley","Morgan","Avery","Quinn","Skyler","Dakota"];
const LAST_NAMES = ["Smith","Johnson","Williams","Brown","Jones","Garcia","Miller","Davis","Rodriguez","Martinez",
  "Hernandez","Lopez","Wilson","Anderson","Thomas","Taylor","Moore","Jackson","Martin","Lee"];

function randomFirstName(gender){
  if(gender==='Male') return pick(MALE_FIRST);
  if(gender==='Female') return pick(FEMALE_FIRST);
  return pick(NB_FIRST);
}

/* ============================ STATE ====================================== */
let state = null;

function freshState(){
  return {
    name:'', first:'', last:'', gender:'Male', city:'New York', age:0, alive:true, birthYear: 2026 - rand(0,0),
    stats:{health:100, happiness:80, smarts:50, looks:50, karma:50},
    money: 0,
    eduStage:'none', // none, elementary, middle, highschool, college, grad
    eduYear:0, major:null, gpa:3.0, dropped:false, expelled:false,
    job:null, jobHistory:[],
    relationships:[], // {id,name,type,rel,alive,gender,age}
    spouseId:null, kids:[],
    assets:{cars:[], houses:[], businesses:[]},
    pets:[],
    crypto:{btc:0, eth:0, lifecoin:0, memetoken:0},
    criminalRecord:[], inPrison:false, prisonYearsLeft:0, prisonRep:0, escapePlan:0,
    gang:null,
    drugEmpire:{tier:0, heat:0, name:null},
    influencer:{tier:0, followers:0, platform:null},
    sportsCareer:null,
    clubs:[],
    achievements:new Set(),
    log:[],
    rival:null, mentor:null,
    religion:null, faithLevel:0,
    flags:{}, // arbitrary story flags
    bucketList:[],
    addiction:null,
    illness:null,
    politics:{office:null, approval:50, campaign:null, termYears:0, scandalCount:0},
    business:{companies:[]},
    loveLanguage:null,
    lastCause:null,
    murders:0,
  };
}

function newRelationship(type, opts){
  opts = opts||{};
  const gender = opts.gender || pick(['Male','Female']);
  return {
    id: uid(), type, gender,
    name: opts.name || (randomFirstName(gender)+' '+ (opts.last || state.last)),
    age: opts.age!=null?opts.age:rand(20,45),
    rel: opts.rel!=null?opts.rel:rand(50,90),
    alive:true, jobless:false,
  };
}

/* ============================ RENDER ENGINE ============================== */
function showScreen(name){
  ['loading','newlife','game','dead'].forEach(s=>{
    $('screen-'+s).classList.toggle('hidden', s!==name);
  });
}
const STAT_BADGES = {
  health:{ic:'Hlth', color:'var(--life-red)'}, happiness:{ic:'Happy', color:'var(--life-gold)'},
  smarts:{ic:'Smart', color:'var(--life-blue)'}, looks:{ic:'Looks', color:'var(--life-pink)'},
  karma:{ic:'Karma', color:'var(--life-green)'},
};

function avatarFor(){
  const a = state.age;
  if(!state.alive) return '💀';
  if(a<2) return '👶';
  if(a<13) return state.gender==='Female'?'👧':(state.gender==='Male'?'👦':'🧒');
  if(a<20) return state.gender==='Female'?'👩‍🦱':(state.gender==='Male'?'👨‍🦱':'🧑');
  if(a<60) return state.gender==='Female'?'👩':(state.gender==='Male'?'👨':'🧑');
  return state.gender==='Female'?'👵':(state.gender==='Male'?'👴':'🧓');
}

const WEATHER_LINES = [
  {ic:'☀️', text:'Fair skies and mild temps'}, {ic:'🌧️', text:'Showers expected this edition'},
  {ic:'⛅', text:'Partly cloudy over the city'}, {ic:'❄️', text:'A cold snap moving through'},
  {ic:'🌩️', text:'Thunderstorms possible tonight'}, {ic:'🌫️', text:'Foggy start to the day'},
  {ic:'🔥', text:'The heatwave continues'}, {ic:'🌬️', text:'Blustery winds expected'},
  {ic:'🌈', text:'Clearing after morning rain'}, {ic:'❅', text:'Light snow flurries'},
  {ic:'🌤️', text:'Sunny with a light breeze'}, {ic:'🌦️', text:'Scattered showers'},
];
function weatherForToday(){
  const idx = (state.age*7 + state.city.length*3) % WEATHER_LINES.length;
  return WEATHER_LINES[idx];
}

function render(){
  if(!state) return;
  if(!state.alive){ renderDeathScreen(); return; }
  showScreen('game');
  $('hd-avatar').textContent = avatarFor();
  $('hd-name').textContent = state.name;
  let sub = '🇺🇸 Age '+state.age+' · '+state.city;
  if(state.job) sub += ' · '+state.job.title;
  else if(state.inPrison) sub += ' · Incarcerated';
  $('hd-sub').textContent = sub;
  $('hd-money').textContent = fmtMoney(state.money);
  const w = weatherForToday();
  $('hd-weather').textContent = w.ic + ' ' + w.text + ' in ' + state.city;
  const statsHtml = ['health','happiness','smarts','looks','karma'].map(k=>{
    const v = clamp(Math.round(state.stats[k]),0,100);
    const b = STAT_BADGES[k];
    return `<div class="stat-badge" title="${k[0].toUpperCase()+k.slice(1)}">
      <span class="stat-ic">${b.ic}</span>
      <span class="stat-num" style="--stat-color:${b.color}">${v}</span></div>`;
  }).join('');
  $('hd-stats').innerHTML = statsHtml;
  renderLog();
}

function renderLog(){
  const el = $('log');
  el.innerHTML = state.log.slice(-200).map(entry=>{
    if(entry.newspaper){
      return `<div class="newspaper"><div class="np-name">${entry.paper||'The Daily Life'}</div>
        <h3>${entry.headline}</h3><p>${entry.sub||''}</p></div>`;
    }
    return `<div class="logline ${entry.type||'neutral'}"><span class="age">Age ${entry.age}</span>${entry.text}</div>`;
  }).join('');
}

function log(text, type, age){
  state.log.push({text, type:type||'neutral', age: age!=null?age:state.age});
  renderLog();
}

function newspaper(headline, sub, paper){
  state.log.push({newspaper:true, headline, sub, paper: paper || pick(['The Daily Life','City Herald','The Chronicle','Metro Times'])});
  renderLog();
}

function openPanel(title, bodyHtml){

function showModal(html){
  $('modal-card').innerHTML = html;
  $('modal-overlay').classList.remove('hidden');
}
function closeModal(){ $('modal-overlay').classList.add('hidden'); }

/* Generic "scene" engine used by many storylines (debate, chemo, therapy, sponsor talks...) */
function playScene(scene){
  // scene: {title, text, choices:[{label, run(){...}}]}
  const choicesHtml = scene.choices.map((c,i)=>`<button class="btn btn-block" data-i="${i}">${c.label}</button>`).join('');
  showModal(`<h3>${scene.title}</h3><p>${scene.text}</p><div class="choices">${choicesHtml}</div>`);
  $('modal-card').querySelectorAll('button[data-i]').forEach(btn=>{
    btn.onclick = ()=>{
      const c = scene.choices[+btn.dataset.i];
      closeModal();
      if(c.run) c.run();
      render();
    };
  });
}

  const chanceToGet = clamp(50 + (state.stats.smarts-50)*0.4 + (state.stats.looks-50)*0.2 - (state.criminalRecord.length*10), 5, 95);

/* ============================ CAREER / EDUCATION PANEL ===================== */
function openCareerPanel(){
  let html = '';
  html += `<div class="list-item"><div class="li-main"><b>Education</b><span>${eduLabel()}</span></div></div>`;
  if(state.eduStage==='none' && state.age>=5 && state.age<11){
    html += `<button class="btn btn-block" onclick="enrollSchool('elementary')">Enroll in Elementary School</button>`;
  }
  if(state.eduStage==='elementary' && state.age>=11){
    html += `<button class="btn btn-block" onclick="enrollSchool('middle')">Enroll in Middle School</button>`;
  }
  if(state.eduStage==='middle' && state.age>=14){
    html += `<button class="btn btn-block" onclick="enrollSchool('highschool')">Enroll in High School</button>`;
  }
  if(state.eduStage==='highschool' && state.eduYear>=4 && state.age>=18){
    html += `<button class="btn btn-block" onclick="applyCollege()">Apply to College</button>`;
  }
  if(state.eduStage==='college' && state.eduYear>=4 && !state.dropped){
    html += `<button class="btn btn-block" onclick="applyGradSchool()">Apply to Grad School</button>`;
  }
  if(state.eduStage==='college' || state.eduStage==='grad'){
    html += `<button class="btn btn-block btn-danger" onclick="dropOut()">Drop Out</button>`;
  }
  html += `<hr style="border-color:var(--border)">`;
  if(state.job){
    html += `<div class="list-item"><div class="li-main"><b>${state.job.title}</b><span>${fmtMoney(state.job.salary)}/yr · ${state.job.years} yrs</span></div>
      <button class="btn" onclick="quitJob()">Quit</button></div>`;
    html += `<button class="btn btn-block btn-accent" onclick="askForRaise()">Ask for Raise</button>`;
  } else if(state.age>=16 && !state.inPrison){
    html += `<b>Available Jobs</b>`;
    jobsAvailable().forEach(j=>{
      html += `<div class="list-item"><div class="li-main"><b>${j.title}</b><span>${fmtMoney(j.salary)}/yr · requires ${j.edu}</span></div>
        <button class="btn" onclick='applyForJobByTitle(${JSON.stringify(j.title)})'>Apply</button></div>`;
    });
  } else {
    html += `<p style="color:var(--sub)">You're too young to work, or currently unavailable.</p>`;
  }
  openPanel('Career', html);
}
function applyForJobByTitle(title){ applyForJob(JOBS.find(j=>j.title===title)); }

function askForRaise(){
  if(!state.job) return;
  const succ = chance(clamp(40+(state.stats.smarts-50)*0.5,10,85));
  if(succ){
    const bump = Math.round(state.job.salary*0.1);
    state.job.salary += bump;
    log(`Your boss approved your raise request! +${fmtMoney(bump)}/yr.`,'good');
  } else {
    log(`Your boss denied your raise request.`,'bad');
    state.stats.happiness = clamp(state.stats.happiness-3,0,100);
  }
  closePanel(); render();
}

function eduLabel(){
  const map = {none:'Not enrolled', elementary:'Elementary School', middle:'Middle School',
    highschool:'High School', college:'College'+(state.major?(' - '+state.major):''), grad:'Grad School'};
  let l = map[state.eduStage] || 'Unknown';
  if(state.eduStage!=='none') l += ` (Year ${state.eduYear}, GPA ${state.gpa.toFixed(1)})`;
  return l;
}

function enrollSchool(stage){
  state.eduStage = stage; state.eduYear = 0;
  log(`You enrolled in ${stage==='highschool'?'High School':stage[0].toUpperCase()+stage.slice(1)+' School'}.`,'good');
  closePanel(); render();
}

const MAJORS = ["Computer Science","Business","Nursing","Education","Engineering","Communications","Art","Psychology","Biology","Law (Pre-Law)"];
function applyCollege(){
  const got = chance(clamp(35+(state.stats.smarts-50)*0.7,5,95));
  if(got){
    state.eduStage='college'; state.eduYear=0; state.major = pick(MAJORS); state.dropped=false;
    log(`You were accepted into college! Major: ${state.major}.`,'good');
    checkAchievement('college_accept');
  } else {
    log(`You were rejected from every college you applied to.`,'bad');
  }
  closePanel(); render();
}
function applyGradSchool(){
  const got = chance(clamp(30+(state.stats.smarts-50)*0.7,5,90));
  if(got){
    state.eduStage='grad'; state.eduYear=0;
    log(`You were accepted into grad school for ${state.major}.`,'good');
  } else {
    log(`Grad schools rejected your application.`,'bad');
  }
  closePanel(); render();
}
function dropOut(){
  state.dropped = true; state.eduStage='highschool'; // fallback credential
  log(`You dropped out of school.`,'bad');
  closePanel(); render();
}

  return ELDER_EVENTS;
}

/* ============================ AGE UP CORE =================================== */
function ageUp(){
  if(!state.alive) return;
  state.age++;

  // education year progression
  if(state.eduStage!=='none' && state.eduStage!=='grad-done'){
    state.eduYear++;
    state.gpa = clamp(state.gpa + (chance(50)?0.1:-0.1)*(state.stats.smarts>50?1:-1), 0, 4);
  }

  // job pay + tenure
  if(state.job){
    state.money += state.job.salary;
    state.job.years++;
  }

  // relationship aging
  state.relationships.forEach(r=>{ if(r.alive) r.age++; });

  // random generic event
  if(chance(55)){
    const pool = ageBracketEvents();
    const e = pick(pool);
    e.fx(state);
    log(e.text, e.type);
  }

  // natural stat drift
  state.stats.happiness = clamp(state.stats.happiness + rand(-2,2), 0, 100);
  if(state.age>50) state.stats.health = clamp(state.stats.health - rand(0,2), 0, 100);
  clampAllStats();

  // prison ticking
  if(state.inPrison){ tickPrison(); }

  // sports ticking
  if(state.sportsCareer){ tickSports(); }

  // crypto market ticks every year
  tickCryptoPrices();

  // death checks
  checkDeath();

  if(state.alive){
    checkAchievementsPassive();
  }
  render();
}

function clampAllStats(){
  for(const k in state.stats) state.stats[k] = clamp(state.stats[k],0,100);
}

/* ============================ DEATH CHECK (base) ============================ */
function checkDeath(){
  if(!state.alive) return;
  if(state.stats.health<=0){ die('poor health'); return; }
  let deathChance = 0;
  if(state.age>70) deathChance = (state.age-70)*1.2;
  if(state.age>90) deathChance += 15;
  if(chance(deathChance)){ die('old age'); return; }
  if(chance(0.3)){ die('a sudden accident'); return; }
}

function die(cause){
  state.alive = false;
  state.lastCause = cause;
  log(`You died of ${cause} at age ${state.age}.`,'bad');
  newspaper(`LOCAL RESIDENT ${state.name.toUpperCase()} DIES AT ${state.age}`, `Cause: ${cause}. Survived by family and friends.`);
}

/* ============================ RELATIONSHIPS ================================= */
function relLabel(type){
  return {parent:'Parent', sibling:'Sibling', spouse:'Spouse', child:'Child', friend:'Friend',
    exspouse:'Ex-Spouse', datingpartner:'Dating'}[type] || type;
}

function openRelationshipsPanel(){
  let html = '';
  const living = state.relationships.filter(r=>r.alive);
  if(living.length===0) html += `<p style="color:var(--sub)">No relationships yet.</p>`;
  living.forEach(r=>{
    html += `<div class="list-item"><div class="li-main"><b>${r.name}</b><span>${relLabel(r.type)} · Age ${r.age} · Relationship ${Math.round(r.rel)}%</span></div>
      <button class="btn" onclick='interactWith(${JSON.stringify(r.id)})'>Interact</button></div>`;
  });
  if(state.age>=16 && !state.spouseId){
    html += `<button class="btn btn-block btn-accent" onclick="findDate()">Find a Date</button>`;
  }
  const datingPartner = living.find(r=>r.type==='datingpartner');
  if(datingPartner){
    html += `<button class="btn btn-block btn-primary" onclick='proposeMarriage(${JSON.stringify(datingPartner.id)})'>Propose Marriage</button>`;
    html += `<button class="btn btn-block btn-danger" onclick='breakUp(${JSON.stringify(datingPartner.id)})'>Break Up</button>`;
  }
  if(state.spouseId){
    html += `<button class="btn btn-block" onclick="goOnDateNight()">Date Night</button>`;
    html += `<button class="btn btn-block btn-danger" onclick="fileDivorce()">File for Divorce</button>`;
    if(state.age>=18) html += `<button class="btn btn-block" onclick="tryForBaby()">Try for a Baby</button>`;
  }
  html += `<button class="btn btn-block" onclick="openTherapyPanel()">Book Therapy Session</button>`;
  openPanel('People', html);
}

function interactWith(id){
  const r = state.relationships.find(x=>x.id===id);
  if(!r) return;
  const opts = [
    {label:'Spend Time Together', run:()=>{ r.rel=clamp(r.rel+rand(3,10),0,100); state.stats.happiness=clamp(state.stats.happiness+3,0,100); log(`You spent quality time with ${r.name}. Relationship improved.`,'good'); }},
    {label:'Give a Gift', run:()=>{ if(state.money>=100){ state.money-=100; r.rel=clamp(r.rel+8,0,100); log(`You gave ${r.name} a gift.`,'good'); } else { log(`Not enough money for a gift.`,'bad'); } }},
    {label:'Compliment Them', run:()=>{ r.rel=clamp(r.rel+rand(1,6),0,100); log(`You complimented ${r.name}.`,'good'); }},
    {label:'Insult Them', run:()=>{ r.rel=clamp(r.rel-rand(5,15),0,100); state.stats.karma=clamp(state.stats.karma-3,0,100); log(`You insulted ${r.name}. Relationship damaged.`,'bad'); }},
  ];
  playScene({title:r.name, text:`How do you want to interact with ${r.name}?`, choices:opts});
}

function findDate(){

const CRIMES = [
  {name:'Shoplifting', risk:20, reward:[50,300], sentence:1},
  {name:'Pickpocketing', risk:25, reward:[30,400], sentence:1},
  {name:'Grand Theft Auto', risk:45, reward:[1000,8000], sentence:3},
  {name:'Armed Robbery', risk:55, reward:[2000,15000], sentence:5},
  {name:'Fraud', risk:35, reward:[1000,20000], sentence:4},
  {name:'Murder', risk:65, reward:[0,0], sentence:20},
];
function commitCrime(name){
  const c = CRIMES.find(x=>x.name===name);
  const caught = chance(clamp(c.risk - (state.stats.smarts-50)*0.2,5,95));
  if(name==='Murder') state.murders++;
  if(caught){
    state.criminalRecord.push(c.name);
    state.inPrison = true;
    state.prisonYearsLeft = c.sentence;
    log(`You were caught committing ${c.name}! Sentenced to ${c.sentence} years in prison.`,'bad');
    newspaper(`${state.name.toUpperCase()} ARRESTED`, `Local resident charged with ${c.name.toLowerCase()}.`);
  } else {
    const gain = rand(c.reward[0], c.reward[1]);
    state.money += gain;
    state.stats.karma = clamp(state.stats.karma - 10, 0, 100);
    log(`You committed ${c.name} and got away with ${fmtMoney(gain)}.`,'neutral');
  }
  closePanel(); render();
}
function tickPrison(){
  state.prisonYearsLeft--;
  state.stats.happiness = clamp(state.stats.happiness-5,0,100);
  if(state.prisonYearsLeft<=0){
    state.inPrison=false;
    log(`You were released from prison.`,'neutral');
  }
}
function prisonActivity(kind){
  if(kind==='workout'){ state.stats.health=clamp(state.stats.health+5,0,100); state.prisonRep+=2; log(`You worked out in the yard.`,'neutral'); }
  if(kind==='socialize'){ state.stats.happiness=clamp(state.stats.happiness+4,0,100); state.prisonRep+=3; log(`You socialized with other inmates.`,'neutral'); }
  if(kind==='escape'){
    state.escapePlan += rand(10,30);
    if(state.escapePlan>=100){
      if(chance(40)){ state.inPrison=false; state.prisonYearsLeft=0; state.escapePlan=0; state.flags.everEscaped=true; log(`You successfully escaped prison!`,'good'); checkAchievement('escaped'); }
      else { state.prisonYearsLeft+=5; state.escapePlan=0; log(`Your escape attempt failed. 5 years added to your sentence.`,'bad'); }
    } else {
      log(`You worked on your escape plan (${state.escapePlan}% ready).`,'neutral');
    }
  }
  if(kind==='parole'){
    if(chance(clamp(state.prisonRep,5,80))){
      state.inPrison=false; state.prisonYearsLeft=0;
      log(`Parole granted! You're free.`,'good');
    } else {
      log(`Parole denied.`,'bad');
    }
  }
  closePanel(); render();
}

const DRUG_TIERS = ["Street Dealer","Corner Boss","Block Captain","District Supplier","Regional Kingpin","Cartel Boss"];
function drugAction(action){
  const de = state.drugEmpire;
  if(action==='deal'){
    const gain = rand(200,1500) * (de.tier+1);
    if(chance(clamp(20+de.heat*0.5,10,80))){

      state.money += gain; de.heat = clamp(de.heat+8,0,100); state.stats.karma=clamp(state.stats.karma-5,0,100);
      log(`You made ${fmtMoney(gain)} dealing on the streets.`,'neutral');
    }
  }
  if(action==='expand' && de.tier<5){
    const cost = 5000*(de.tier+1);
    if(state.money>=cost){ state.money-=cost; de.tier++; de.name=DRUG_TIERS[de.tier]; log(`Your operation expanded. You're now a ${DRUG_TIERS[de.tier]}.`,'good'); checkAchievement('drug_lord'); }
    else log(`Not enough money to expand your operation.`,'bad');
  }
  if(action==='laylow'){ de.heat = clamp(de.heat-30,0,100); log(`You laid low for a while. Heat reduced.`,'neutral'); }
  closePanel(); render();
}

function netWorth(){

  state.assets.houses.forEach(h=>nw+=h.value);
  for(const k in state.crypto) nw += state.crypto[k]*CRYPTO_PRICES[k];
  return nw;
}

  if(state.stats.health>=100) checkAchievement('gym_rat');

  if(state.assets.cars.length>=5) checkAchievement('car_collector');
  if(state.pets.length>=5) checkAchievement('pet_lover');
  if(state.kids.length>=5) checkAchievement('family_person');
  for(const k in state.crypto){ if(state.crypto[k]*CRYPTO_PRICES[k] >= 100000){ checkAchievement('crypto_whale'); break; } }
  if(state.faithLevel>=100) checkAchievement('faithful');

/* ============================ LEGACY SCORE (base, extended in Phase 16) ======== */
function calcLegacyScore(){
  let score = 0;
  const livingFamily = state.relationships.filter(r=>r.alive && r.rel>=50).length;
  score += clamp(livingFamily*4, 0, 20);
  score += clamp((state.job?state.job.tier:0)*4, 0, 20);
  score += clamp(state.stats.karma*0.2, 0, 20);
  score += clamp(state.achievements.size*0.6, 0, 15);
  score += clamp(state.kids.length*3, 0, 10);
  score += clamp(Math.log10(Math.max(1,netWorth()))*1.5, 0, 15);
  return clamp(Math.round(score),0,100);
}
function legacyGrade(score){
  if(score>=90) return {grade:'S', title:'Legendary Life'};
  if(score>=75) return {grade:'A', title:'Remarkable Life'};
  if(score>=60) return {grade:'B', title:'Well-Lived Life'};
  if(score>=40) return {grade:'C', title:'Ordinary Life'};
  if(score>=20) return {grade:'D', title:'Troubled Life'};
  return {grade:'F', title:'Wasted Potential'};
}

   AI FAMILY CONVERSATIONS VIA THE CLAUDE API
   API key + model are stored in this browser's localStorage only, never
   in game state (so they aren't part of any save/export of a life).
   --------------------------------------------------------------------- */
function getApiKeyP15(){ return localStorage.getItem('lifeplay_api_key')||''; }
function setApiKeyP15(k){ localStorage.setItem('lifeplay_api_key', k); }
function getApiModelP15(){ return localStorage.getItem('lifeplay_api_model')||'claude-sonnet-4-5-20250929'; }
function setApiModelP15(m){ localStorage.setItem('lifeplay_api_model', m); }

function escapeHtmlP15(str){
  return String(str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
/* Parses an Anthropic API error response body into a clear, specific message.
   Kept separate from the network-failure path (TypeError from fetch itself,
   almost always CORS/offline/DNS) so users can tell "bad key" from "can't connect". */
async function parseApiErrorP15(res){
  let bodyText = '';
  try{ bodyText = await res.text(); }catch(e){ /* ignore */ }
  let msg = null;
  try{ const j = JSON.parse(bodyText); msg = j && j.error && j.error.message; }catch(e){ /* not JSON */ }
  if(res.status===401) return 'Invalid API key (401). Double-check the key in AI Chat Settings.';
  if(res.status===403) return 'Access denied (403). ' + (msg || 'This key may not have permission for direct browser access.');
  if(res.status===404) return `Model not found (404). "${getApiModelP15()}" may be misspelled or unavailable to your account — try a different model in AI Chat Settings.`;
  if(res.status===429) return 'Rate limited (429). You are sending messages too quickly, or are out of quota — wait a moment and try again.';
  if(res.status>=500) return `Anthropic's servers had an issue (${res.status}). Try again shortly.`;
  return `HTTP ${res.status}${msg ? ': '+msg : (bodyText ? ': '+bodyText.slice(0,150) : '')}`;
}
async function callClaudeApiP15(messages, systemPrompt, maxTokens){
  const apiKey = getApiKeyP15();
  const model = getApiModelP15();
  if(!apiKey) throw new Error('No API key set.');
  let res;
  try{
    res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'content-type':'application/json',
        'x-api-key': apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true',
      },
      body: JSON.stringify({ model, max_tokens:maxTokens||200, system:systemPrompt, messages })
    });
  } catch(networkErr){
    throw new Error('Could not reach api.anthropic.com. This is usually a network problem, an ad/privacy blocker, or the browser blocking the cross-origin request — not necessarily a bad key.');
  }
  if(!res.ok) throw new Error(await parseApiErrorP15(res));
  const data = await res.json();
  const block = (data.content||[]).find(b=>b.type==='text');
  return block ? block.text : '[The model returned an empty response.]';
}

function tickPetsP15(){

    if(!p.alive) return;

    p.happiness = clamp(p.happiness - rand(2,6), 0, 100);
    p.health = clamp((p.health==null?100:p.health) - rand(1,5), 0, 100);
    const lifespan = PET_LIFESPANS_P15[p.type] || 12;
    if(p.age>=15) checkAchievement('animal_whisperer');

    if(deathChance>0 && chance(deathChance)){

      log(`💔 ${p.name} passed away. You'll miss your old friend.`,'bad');
      state.stats.happiness = clamp(state.stats.happiness-10,0,100);
    }
  });
}

const COUPLES_COUNSELING_TOPICS_P15 = ['Communication Breakdown','Trust Issues','Financial Stress','Growing Apart','Intimacy'];
function coupleCounselingP15(){
  const spouse = state.relationships.find(r=>r.id===state.spouseId);
  if(!spouse) return;
  const cost = 200;
  if(state.money<cost){ log(`Not enough money for couples counseling.`,'bad'); closePanel(); render(); return; }
  state.money -= cost;
  const topic = pick(COUPLES_COUNSELING_TOPICS_P15);
  closePanel();
  playScene({title:`Couples Counseling: ${topic}`, text:`You and ${spouse.name} sit down with a marriage counselor to work through ${topic.toLowerCase()}.`, choices:[
    {label:'Both commit to real change', run:()=>{ spouse.rel=clamp(spouse.rel+15,0,100); state.stats.happiness=clamp(state.stats.happiness+6,0,100); log(`The session helped. You and ${spouse.name} feel closer.`,'good'); }},
    {label:'Listen, but stay guarded', run:()=>{ spouse.rel=clamp(spouse.rel+4,0,100); log(`It was a start, but there's still distance between you and ${spouse.name}.`,'neutral'); }},
    {label:'Argue through the whole session', run:()=>{ spouse.rel=clamp(spouse.rel-10,0,100); state.stats.happiness=clamp(state.stats.happiness-4,0,100); log(`The session devolved into an argument. Nothing was resolved.`,'bad'); }},
  ]});
}

/* --- New mechanic: Travel (also powers the pre-existing "wanderer" secret ending) --- */
function travelToCityP17(city){
  const cost = 250;
  if(state.money<cost){ log(`Not enough money to travel to ${city}.`,'bad'); openWorldPanel(); return; }
  state.money -= cost;
  if(!state.flags.citiesVisited) state.flags.citiesVisited = [];
  if(!state.flags.citiesVisited.includes(city)){
    state.flags.citiesVisited.push(city);
    checkAchievement('globe_trotter');

  if(state.money<amount){ log(`You can't afford to donate ${fmtMoney(amount)} right now.`,'bad'); openWorldPanel(); return; }
  state.money -= amount;
  state.stats.karma = clamp(state.stats.karma+Math.round(amount/200),0,100);

const LETTER_TEMPLATES_P18 = {
  warm: [
    r=>`I just wanted to say how proud I am of you lately. Keep going.`,
    r=>`We should talk more. I think about you often and I miss you.`,
    r=>`You've really grown into yourself. It's been something to watch.`,
    r=>`I know things have been hard, but I believe in you completely.`,
    r=>`Thank you for always being there when it counts. It means more than you know.`,
  ],
  tense: [
    r=>`We need to talk. Things haven't felt right between us for a while.`,
    r=>`I don't say this lightly, but I'm worried about the choices you've been making.`,
    r=>`I'm not angry, just disappointed. I hoped for better.`,
  ],
  rival: [
    r=>`Don't think I've forgotten our little rivalry. I'm just getting started.`,
    r=>`Enjoy the lead while it lasts. I'll be right behind you.`,
    r=>`We both know how this ends — with me on top.`,
  ],
};
function tickLettersP18(){
  if(!chance(7)) return;
  const family = state.relationships.filter(r=>r.alive && (r.type==='parent'||r.type==='sibling'||r.type==='spouse'||r.type==='child'||r.type==='friend'||r.type==='datingpartner'));
  const rival = state.rival;
  const candidates = [];
  family.forEach(r=>candidates.push({r, pool: r.rel>=45 ? LETTER_TEMPLATES_P18.warm : LETTER_TEMPLATES_P18.tense}));
  if(rival) candidates.push({r:rival, pool:LETTER_TEMPLATES_P18.rival});
  if(!candidates.length) return;
  const pickCand = pick(candidates);
  const template = pick(pickCand.pool);
  const text = template(pickCand.r);
  state.log.push({letter:true, text, sig:pickCand.r.name, age:state.age});
  renderLog();
}
const _origRenderLog_P18 = renderLog;
renderLog = function(){
  const el = $('log');

        <h3>${entry.headline}</h3><p>${entry.sub||''}</p></div>`;
    }
    if(entry.letter){
      return `<div class="letter"><span class="letter-head">Letter to the Editor · Age ${entry.age}</span>"${entry.text}"<span class="letter-sig">— ${entry.sig}</span></div>`;
    }
    return `<div class="logline ${entry.type||'neutral'}"><span class="age">Age ${entry.age}</span>${entry.text}</div>`;
  }).join('');
};
