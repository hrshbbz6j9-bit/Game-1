<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LifePlay</title>
<style>
  /* ==========================================================================
     LifePlay visual identity — a warm cream "scrapbook" world, in the spirit
     of BitLife's paper-and-gold look, built as our own take rather than a
     copy: rounded system type, a mustard-gold accent, and life-stat colors
     (red/green/blue/pink/gold) standing in for the icon-badge row.
     This is a deliberate single-theme (light/paper) design — see note below
     the token block — so there is no separate dark-mode palette to keep in
     sync.
     All existing JS renders through these same custom property NAMES
     (--bg, --panel, --panel2, --accent, --accent2, --danger, --text, --sub,
     --border), so only the values change here; nothing downstream breaks.
     ========================================================================== */
  :root{
    --bg:#EADFBC;          /* desk behind the page */
    --panel:#FFFBF1;       /* card / panel surface (was dark panel) */
    --panel2:#F4E9CB;      /* secondary surface, inputs, chips */
    --accent:#3F9142;      /* "good" green, also karma */
    --accent2:#2F72A8;     /* "info" blue */
    --danger:#D6503A;      /* "bad" red */
    --warn:#C97F0E;        /* amber warn */
    --text:#241B10;        /* ink */
    --sub:#8A7856;         /* soft ink / labels */
    --border:#E4D3A4;      /* hairline on cream */
    --gold:#EFA722;        /* signature accent — Age Up, primary actions */
    --gold-deep:#B9740A;
    --ink-line:#241B10;    /* bold outline used sparingly, sticker-style */
    --life-red:#D6503A; --life-green:#3F9142; --life-blue:#2F72A8; --life-pink:#C4507F; --life-gold:#C9840E;
    --font-display: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, sans-serif;
    --font-body: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);font-family:var(--font-body);color:var(--text);}
  #phone{max-width:430px;margin:0 auto;min-height:100vh;background:var(--panel);display:flex;flex-direction:column;position:relative;overflow-x:hidden;box-shadow:0 0 0 1px var(--border);}
  .hidden{display:none !important;}
  h1,h2,h3{font-family:var(--font-display); text-wrap:balance;}
  button, input, select{font-family:inherit;}
  button:focus-visible, input:focus-visible, select:focus-visible{outline:2px solid var(--gold-deep); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }
  /* Loading */
  #screen-loading{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:
      radial-gradient(circle at 30% 20%, #FBEFCE 0%, var(--bg) 70%);}
  #screen-loading h1{font-size:2.6em;letter-spacing:1px;margin-bottom:2px;font-weight:800;color:var(--text);}
  #screen-loading p{color:var(--sub);margin-top:0;font-weight:600;}
  .loadbar-track{width:70%;height:12px;background:var(--panel2);border:2px solid var(--ink-line);border-radius:8px;overflow:hidden;margin-top:30px;}
  .loadbar-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--gold-deep),var(--gold));transition:width .1s linear;}
  #loading-tip{margin-top:14px;font-size:.85em;color:var(--sub);text-align:center;padding:0 20px;font-weight:600;}
  /* New life */
  #screen-newlife{padding:24px 20px;display:flex;flex-direction:column;gap:14px;min-height:100vh;background:var(--bg);}
  #screen-newlife h2{text-align:center;margin-bottom:0;font-weight:800;}
  .field label{display:block;font-size:.78em;color:var(--sub);margin-bottom:4px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  .field input, .field select{width:100%;padding:11px;border-radius:12px;border:2px solid var(--border);background:var(--panel);color:var(--text);font-size:1em;font-weight:600;}
  .btn{padding:12px 16px;border-radius:14px;border:2px solid var(--ink-line);background:var(--panel2);color:var(--text);font-size:1em;font-weight:700;cursor:pointer;text-align:center;box-shadow:0 3px 0 var(--ink-line);transition:transform .08s, box-shadow .08s;}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink-line);}
  .btn-primary{background:linear-gradient(180deg,var(--gold),var(--gold-deep));color:#2B1B02;}
  .btn-danger{background:linear-gradient(180deg,#E96952,var(--danger));color:#fff;}
  .btn-accent{background:linear-gradient(180deg,#4C93C9,var(--accent2));color:#fff;}
  .btn-block{width:100%;}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}
  /* Game screen */
  #screen-game{display:flex;flex-direction:column;height:100vh;background:var(--bg);}
  #header{padding:12px 14px;background:var(--panel);border-bottom:2px solid var(--ink-line);}
  #header .who{display:flex;align-items:center;gap:10px;}
  .avatar-ring{width:52px;height:52px;border-radius:50%;background:var(--panel2);border:2px solid var(--ink-line);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  #header .avatar{font-size:1.9em;line-height:1;}
  #header .who-info{flex:1;min-width:0;}
  #header .who-info b{font-size:1.08em;font-family:var(--font-display);font-weight:800;display:block;}
  #header .who-info span{display:block;font-size:.75em;color:var(--sub);font-weight:600;}
  .cash-pill{font-weight:800;color:#2B1B02;background:linear-gradient(180deg,var(--gold),var(--gold-deep));border:2px solid var(--ink-line);border-radius:20px;padding:4px 10px;font-size:.85em;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .stats{display:flex;justify-content:space-between;gap:6px;margin-top:10px;}
  .stat-badge{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel2);border-radius:12px;padding:6px 2px;border:1px solid var(--border);}
  .stat-badge .stat-ic{font-size:1.15em;line-height:1;}
  .stat-badge .stat-num{font-size:.78em;font-weight:800;font-variant-numeric:tabular-nums;}
  #log{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column-reverse;gap:9px;}
  .logline{background:var(--panel);border:1.5px solid var(--ink-line);border-radius:12px;padding:9px 12px;font-size:.88em;line-height:1.4;box-shadow:2px 3px 0 var(--border);}
  .logline:nth-child(odd){transform:rotate(-0.4deg);}
  .logline:nth-child(even){transform:rotate(0.4deg);}
  .logline .age{color:var(--sub);font-size:.72em;font-weight:800;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:2px;}
  .logline.good{border-left:5px solid var(--life-green);}
  .logline.bad{border-left:5px solid var(--danger);}
  .logline.neutral{border-left:5px solid var(--accent2);}
  .newspaper{background:#FBF6E7;color:#241B10;border:2px solid var(--ink-line);border-radius:4px;padding:12px 14px;font-family:Georgia,'Times New Roman',serif;transform:rotate(0deg);box-shadow:2px 3px 0 var(--border);}
  .newspaper .np-name{font-size:.65em;letter-spacing:3px;text-transform:uppercase;text-align:center;border-bottom:2px solid var(--ink-line);border-top:2px solid var(--ink-line);padding:3px 0;margin-bottom:6px;font-family:var(--font-display);font-weight:800;}
  .newspaper h3{margin:0 0 4px;font-size:1.15em;text-align:center;line-height:1.2;}
  .newspaper p{margin:0;font-size:.78em;text-align:center;font-style:italic;}
  #bottomnav{display:grid;grid-template-columns:repeat(6,1fr);background:var(--panel);border-top:2px solid var(--ink-line);gap:1px;padding:6px 4px;}
  #bottomnav button{background:var(--tile-color, var(--panel2));border:1.5px solid var(--ink-line);border-radius:12px;color:var(--text);padding:7px 2px;font-size:.62em;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;margin:2px;}
  #bottomnav button .ic{font-size:1.3em;}
  #bottomnav button:nth-child(1){--tile-color:#FBE0B0;}
  #bottomnav button:nth-child(2){--tile-color:#D9EFC7;}
  #bottomnav button:nth-child(3){--tile-color:#F6CFDC;}
  #bottomnav button:nth-child(4){--tile-color:#CFE3F5;}
  #bottomnav button:nth-child(5){--tile-color:#E4D6F5;}
  #bottomnav button:nth-child(6){--tile-color:#F5E2B8;}
  #ageup-btn{position:sticky;bottom:0;margin:8px;width:calc(100% - 16px);border-radius:16px;padding:15px;font-size:1.05em;letter-spacing:.02em;}
  /* Panel / modal */
  #panel-overlay{position:absolute;inset:0;background:rgba(36,27,16,.55);display:flex;align-items:flex-end;z-index:50;}
  #panel{background:var(--bg);width:100%;max-height:82vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;border-top:2px solid var(--ink-line);}
  #panel-head{padding:14px 16px;border-bottom:2px solid var(--ink-line);display:flex;justify-content:space-between;align-items:center;background:var(--panel);}
  #panel-head h3{margin:0;font-weight:800;}
  #panel-body{padding:14px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;}
  .close-x{background:var(--panel2);border:1.5px solid var(--ink-line);border-radius:50%;width:28px;height:28px;color:var(--text);font-size:1.1em;cursor:pointer;line-height:1;}
  .list-item{background:var(--panel);border:1.5px solid var(--ink-line);border-radius:14px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:2px 2px 0 var(--border);}
  .list-item .li-main b{display:block;font-family:var(--font-display);}
  .list-item .li-main span{font-size:.78em;color:var(--sub);font-weight:600;}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.68em;font-weight:700;background:var(--panel2);color:var(--sub);border:1px solid var(--border);}
  #modal-overlay{position:absolute;inset:0;background:rgba(36,27,16,.7);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;}
  #modal-card{background:var(--panel);border:2px solid var(--ink-line);border-radius:18px;padding:20px;max-width:360px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:4px 5px 0 var(--border);}
  #modal-card h3{margin-top:0;font-weight:800;}
  #modal-card .choices{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  /* Death screen */
  #screen-dead{padding:28px 20px;text-align:center;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:12px;}
  #screen-dead h1{color:var(--text);font-size:1.5em;}
  .tombstone{background:#DCD3B9;border:2px solid var(--ink-line);border-radius:50% 50% 10px 10px / 30% 30% 10px 10px;padding:34px 20px 18px;width:78%;max-width:260px;box-shadow:3px 4px 0 var(--border);}
  .tombstone .rip{font-family:var(--font-display);font-weight:800;font-size:1.3em;letter-spacing:.08em;color:var(--sub);}
  .death-cause{color:var(--sub);font-weight:600;font-size:.95em;max-width:320px;}
  .legacy-badge{font-size:3em;font-weight:800;margin:6px 0 0;font-family:var(--font-display);color:var(--gold-deep);}
  .legacy-grade{font-size:1em;color:var(--sub);font-weight:700;}
  ::-webkit-scrollbar{width:6px;} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
</style>
</head>
<body>
<div id="phone">

  <div id="screen-loading">
    <h1>LifePlay</h1>
    <p>a life simulator</p>
    <div class="loadbar-track"><div class="loadbar-fill" id="loadbar-fill"></div></div>
    <div id="loading-tip">Loading...</div>
  </div>

  <div id="screen-newlife" class="hidden">
    <h2>New Life</h2>
    <div class="field">
      <label>First Name</label>
      <input id="nl-first" type="text" placeholder="Random">
    </div>
    <div class="field">
      <label>Last Name</label>
      <input id="nl-last" type="text" placeholder="Random">
    </div>
    <div class="field">
      <label>Gender</label>
      <select id="nl-gender">
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Nonbinary">Nonbinary</option>
      </select>
    </div>
    <div class="field">
      <label>City</label>
      <select id="nl-city"></select>
    </div>
    <button class="btn btn-primary btn-block" id="nl-start" style="margin-top:10px;">Start Life</button>
  </div>

  <div id="screen-game" class="hidden">
    <div id="header">
      <div class="who">
        <div class="avatar-ring"><div class="avatar" id="hd-avatar">👶</div></div>
        <div class="who-info">
          <b id="hd-name">-</b>
          <span id="hd-sub">-</span>
        </div>
        <div class="cash-pill">💵 <span id="hd-money">$0</span></div>
      </div>
      <div class="stats" id="hd-stats"></div>
    </div>
    <div id="log"></div>
    <button class="btn btn-primary" id="ageup-btn">🎂 Age Up</button>
    <div id="bottomnav">
      <button data-panel="career"><span class="ic">💼</span>Career</button>
      <button data-panel="assets"><span class="ic">💰</span>Assets</button>
      <button data-panel="relationships"><span class="ic">❤️</span>People</button>
      <button data-panel="activities"><span class="ic">🎲</span>Activities</button>
      <button data-panel="world"><span class="ic">🌍</span>World</button>
      <button data-panel="profile"><span class="ic">👤</span>Profile</button>
    </div>
  </div>

  <div id="screen-dead" class="hidden"></div>

  <div id="panel-overlay" class="hidden">
    <div id="panel">
      <div id="panel-head"><h3 id="panel-title">Panel</h3><button class="close-x" id="panel-close">✕</button></div>
      <div id="panel-body"></div>
    </div>
  </div>

  <div id="modal-overlay" class="hidden">
    <div id="modal-card"></div>
  </div>

</div>
<script>
'use strict';
/* =========================================================================
   LIFEPLAY — single file life simulator
   ========================================================================= */

/* ============================ UTILITIES ================================ */
function $(id){ return document.getElementById(id); }
function rand(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[rand(0,arr.length-1)]; }
function chance(pct){ return Math.random()*100 < pct; }
function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
function fmtMoney(n){
  n = Math.round(n);
  const neg = n<0; n = Math.abs(n);
  let s = n.toLocaleString('en-US');
  return (neg?'-$':'$')+s;
}
function uid(){ return 'id'+Math.random().toString(36).slice(2,10); }

/* ============================ DATA: STATIC =============================== */
const CITIES = ["New York","Los Angeles","Chicago","Houston","Miami","Las Vegas","Seattle","Boston",
  "Austin","Denver","Atlanta","Nashville","Phoenix","Portland","New Orleans","San Francisco"];

const MALE_FIRST = ["James","John","Robert","Michael","David","William","Richard","Joseph","Thomas","Charles",
  "Daniel","Matthew","Anthony","Mark","Andrew","Joshua","Kevin","Brian","Tyler","Jordan"];
const FEMALE_FIRST = ["Mary","Patricia","Jennifer","Linda","Elizabeth","Barbara","Susan","Jessica","Sarah","Karen",
  "Lisa","Nancy","Emily","Amanda","Ashley","Megan","Olivia","Sophia","Ava","Mia"];
const NB_FIRST = ["Alex","Jordan","Taylor","Casey","Riley","Morgan","Avery","Quinn","Skyler","Dakota"];
const LAST_NAMES = ["Smith","Johnson","Williams","Brown","Jones","Garcia","Miller","Davis","Rodriguez","Martinez",
  "Hernandez","Lopez","Wilson","Anderson","Thomas","Taylor","Moore","Jackson","Martin","Lee"];

function randomFirstName(gender){
  if(gender==='Male') return pick(MALE_FIRST);
  if(gender==='Female') return pick(FEMALE_FIRST);
  return pick(NB_FIRST);
}

/* ============================ STATE ====================================== */
let state = null;

function freshState(){
  return {
    name:'', first:'', last:'', gender:'Male', city:'New York', age:0, alive:true, birthYear: 2026 - rand(0,0),
    stats:{health:100, happiness:80, smarts:50, looks:50, karma:50},
    money: 0,
    eduStage:'none', // none, elementary, middle, highschool, college, grad
    eduYear:0, major:null, gpa:3.0, dropped:false, expelled:false,
    job:null, jobHistory:[],
    relationships:[], // {id,name,type,rel,alive,gender,age}
    spouseId:null, kids:[],
    assets:{cars:[], houses:[], businesses:[]},
    pets:[],
    crypto:{btc:0, eth:0, lifecoin:0, memetoken:0},
    criminalRecord:[], inPrison:false, prisonYearsLeft:0, prisonRep:0, escapePlan:0,
    gang:null,
    drugEmpire:{tier:0, heat:0, name:null},
    influencer:{tier:0, followers:0, platform:null},
    sportsCareer:null,
    clubs:[],
    achievements:new Set(),
    log:[],
    rival:null, mentor:null,
    religion:null, faithLevel:0,
    flags:{}, // arbitrary story flags
    bucketList:[],
    addiction:null,
    illness:null,
    politics:{office:null, approval:50, campaign:null, termYears:0, scandalCount:0},
    business:{companies:[]},
    loveLanguage:null,
    lastCause:null,
    murders:0,
  };
}

function newRelationship(type, opts){
  opts = opts||{};
  const gender = opts.gender || pick(['Male','Female']);
  return {
    id: uid(), type, gender,
    name: opts.name || (randomFirstName(gender)+' '+ (opts.last || state.last)),
    age: opts.age!=null?opts.age:rand(20,45),
    rel: opts.rel!=null?opts.rel:rand(50,90),
    alive:true, jobless:false,
  };
}

/* ============================ RENDER ENGINE ============================== */
function showScreen(name){
  ['loading','newlife','game','dead'].forEach(s=>{
    $('screen-'+s).classList.toggle('hidden', s!==name);
  });
}
const STAT_BADGES = {
  health:{ic:'❤️', color:'var(--life-red)'}, happiness:{ic:'😀', color:'var(--life-gold)'},
  smarts:{ic:'🧠', color:'var(--life-blue)'}, looks:{ic:'✨', color:'var(--life-pink)'},
  karma:{ic:'☯️', color:'var(--life-green)'},
};

function avatarFor(){
  const a = state.age;
  if(!state.alive) return '💀';
  if(a<2) return '👶';
  if(a<13) return state.gender==='Female'?'👧':(state.gender==='Male'?'👦':'🧒');
  if(a<20) return state.gender==='Female'?'👩‍🦱':(state.gender==='Male'?'👨‍🦱':'🧑');
  if(a<60) return state.gender==='Female'?'👩':(state.gender==='Male'?'👨':'🧑');
  return state.gender==='Female'?'👵':(state.gender==='Male'?'👴':'🧓');
}

function render(){
  if(!state) return;
  if(!state.alive){ renderDeathScreen(); return; }
  showScreen('game');
  $('hd-avatar').textContent = avatarFor();
  $('hd-name').textContent = state.name;
  let sub = 'Age '+state.age+' · '+state.city;
  if(state.job) sub += ' · '+state.job.title;
  else if(state.inPrison) sub += ' · Incarcerated';
  $('hd-sub').textContent = sub;
  $('hd-money').textContent = fmtMoney(state.money);
  const statsHtml = ['health','happiness','smarts','looks','karma'].map(k=>{
    const v = clamp(Math.round(state.stats[k]),0,100);
    const b = STAT_BADGES[k];
    return `<div class="stat-badge" title="${k[0].toUpperCase()+k.slice(1)}"><span class="stat-ic">${b.ic}</span><span class="stat-num" style="color:${b.color}">${v}</span></div>`;
  }).join('');
  $('hd-stats').innerHTML = statsHtml;
  renderLog();
}

function renderLog(){
  const el = $('log');
  el.innerHTML = state.log.slice(-200).map(entry=>{
    if(entry.newspaper){
      return `<div class="newspaper"><div class="np-name">${entry.paper||'The Daily Life'}</div>
        <h3>${entry.headline}</h3><p>${entry.sub||''}</p></div>`;
    }
    return `<div class="logline ${entry.type||'neutral'}"><span class="age">Age ${entry.age}</span>${entry.text}</div>`;
  }).join('');
}

function log(text, type, age){
  state.log.push({text, type:type||'neutral', age: age!=null?age:state.age});
  renderLog();
}

function newspaper(headline, sub, paper){
  state.log.push({newspaper:true, headline, sub, paper: paper || pick(['The Daily Life','City Herald','The Chronicle','Metro Times'])});
  renderLog();
}

/* ============================ MODAL / PANEL HELPERS ======================= */
function openPanel(title, bodyHtml){
  $('panel-title').textContent = title;
  $('panel-body').innerHTML = bodyHtml;
  $('panel-overlay').classList.remove('hidden');
}
function closePanel(){ $('panel-overlay').classList.add('hidden'); }
$('panel-close').onclick = closePanel;
$('panel-overlay').addEventListener('click', e=>{ if(e.target.id==='panel-overlay') closePanel(); });

function showModal(html){
  $('modal-card').innerHTML = html;
  $('modal-overlay').classList.remove('hidden');
}
function closeModal(){ $('modal-overlay').classList.add('hidden'); }
$('modal-overlay').addEventListener('click', e=>{ if(e.target.id==='modal-overlay') closeModal(); });

/* Generic "scene" engine used by many storylines (debate, chemo, therapy, sponsor talks...) */
function playScene(scene){
  // scene: {title, text, choices:[{label, run(){...}}]}
  const choicesHtml = scene.choices.map((c,i)=>`<button class="btn btn-block" data-i="${i}">${c.label}</button>`).join('');
  showModal(`<h3>${scene.title}</h3><p>${scene.text}</p><div class="choices">${choicesHtml}</div>`);
  $('modal-card').querySelectorAll('button[data-i]').forEach(btn=>{
    btn.onclick = ()=>{
      const c = scene.choices[+btn.dataset.i];
      closeModal();
      if(c.run) c.run();
      render();
    };
  });
}

/* ============================ NEW LIFE FLOW =============================== */
function populateCitySelect(){
  const sel = $('nl-city');
  sel.innerHTML = CITIES.map(c=>`<option value="${c}">${c}</option>`).join('');
}

function startNewLife(){
  state = freshState();
  const gender = $('nl-gender').value;
  state.gender = gender;
  state.first = $('nl-first').value.trim() || randomFirstName(gender);
  state.last = $('nl-last').value.trim() || pick(LAST_NAMES);
  state.name = state.first+' '+state.last;
  state.city = $('nl-city').value;
  state.stats.smarts = clamp(rand(20,80),0,100);
  state.stats.looks = clamp(rand(20,80),0,100);
  state.stats.health = rand(80,100);
  state.stats.happiness = rand(60,100);
  state.stats.karma = 50;
  state.money = 0;

  // parents

  }
  if(state.eduStage==='elementary' && state.age>=11){
    html += `<button class="btn btn-block" onclick="enrollSchool('middle')">Enroll in Middle School</button>`;
  }
  if(state.eduStage==='middle' && state.age>=14){
    html += `<button class="btn btn-block" onclick="enrollSchool('highschool')">Enroll in High School</button>`;
  }

/* ============================ AGE UP CORE =================================== */
function ageUp(){
  if(!state.alive) return;
  state.age++;

  // education year progression
  if(state.eduStage!=='none' && state.eduStage!=='grad-done'){
    state.eduYear++;
    state.gpa = clamp(state.gpa + (chance(50)?0.1:-0.1)*(state.stats.smarts>50?1:-1), 0, 4);
  }

  // job pay + tenure
  if(state.job){
    state.money += state.job.salary;
    state.job.years++;
  }

  // relationship aging
  state.relationships.forEach(r=>{ if(r.alive) r.age++; });

  // random generic event
  if(chance(55)){
    const pool = ageBracketEvents();
    const e = pick(pool);
    e.fx(state);
    log(e.text, e.type);
  }

  // natural stat drift
  state.stats.happiness = clamp(state.stats.happiness + rand(-2,2), 0, 100);
  if(state.age>50) state.stats.health = clamp(state.stats.health - rand(0,2), 0, 100);
  clampAllStats();

  // prison ticking
  if(state.inPrison){ tickPrison(); }

  // sports ticking
  if(state.sportsCareer){ tickSports(); }

  // crypto market ticks every year
  tickCryptoPrices();

  // death checks
  checkDeath();

  if(state.alive){
    checkAchievementsPassive();
  }
  render();
}

function clampAllStats(){
  for(const k in state.stats) state.stats[k] = clamp(state.stats[k],0,100);
}

/* ============================ DEATH CHECK (base) ============================ */
function checkDeath(){
  if(!state.alive) return;
  if(state.stats.health<=0){ die('poor health'); return; }
  let deathChance = 0;
  if(state.age>70) deathChance = (state.age-70)*1.2;
  if(state.age>90) deathChance += 15;
  if(chance(deathChance)){ die('old age'); return; }
  if(chance(0.3)){ die('a sudden accident'); return; }
}

function die(cause){
  state.alive = false;
  state.lastCause = cause;
  log(`You died of ${cause} at age ${state.age}.`,'bad');
  newspaper(`LOCAL RESIDENT ${state.name.toUpperCase()} DIES AT ${state.age}`, `Cause: ${cause}. Survived by family and friends.`);
}

const CRIMES = [
  {name:'Shoplifting', risk:20, reward:[50,300], sentence:1},
  {name:'Pickpocketing', risk:25, reward:[30,400], sentence:1},
  {name:'Grand Theft Auto', risk:45, reward:[1000,8000], sentence:3},
  {name:'Armed Robbery', risk:55, reward:[2000,15000], sentence:5},
  {name:'Fraud', risk:35, reward:[1000,20000], sentence:4},
  {name:'Murder', risk:65, reward:[0,0], sentence:20},

function commitCrime(name){
  const c = CRIMES.find(x=>x.name===name);
  const caught = chance(clamp(c.risk - (state.stats.smarts-50)*0.2,5,95));
  if(name==='Murder') state.murders++;
  if(caught){
    state.criminalRecord.push(c.name);
    state.inPrison = true;

const BUCKET_LIST_OPTIONS = ["Skydive out of a plane","Visit every continent","Write a memoir","Learn to play piano",

  "See the northern lights","Give away $10,000 to charity","Learn a new language","Reconnect with an old friend"];
function openBucketListSetup(){
  let picks = [];
  let html = `<p>Select 5 bucket list goals for your remaining years:</p>`;
  html += BUCKET_LIST_OPTIONS.map((o,i)=>`<label style="display:flex;gap:8px;align-items:center;"><input type="checkbox" value="${i}" class="bl-check"> ${o}</label>`).join('');
  html += `<button class="btn btn-block btn-primary" style="margin-top:10px" onclick="confirmBucketList()">Confirm</button>`;

function confirmBucketList(){
  const checked = [...document.querySelectorAll('.bl-check:checked')].map(c=>+c.value).slice(0,5);
  if(checked.length===0){ return; }
  state.bucketList = checked.map(i=>({text:BUCKET_LIST_OPTIONS[i], done:false}));
  log(`You set your bucket list for your golden years.`,'good');
  closePanel(); render();
}
function attemptBucketItem(i){
  const item = state.bucketList[i];
  if(!item || item.done) return;
  const succ = chance(60);
  if(succ){ item.done=true; state.stats.happiness=clamp(state.stats.happiness+8,0,100); log(`Bucket list complete: "${item.text}"!`,'good'); }
  else { state.stats.happiness=clamp(state.stats.happiness-2,0,100); log(`You attempted "${item.text}" but it didn't work out this year.`,'bad'); }

/* ============================ LEGACY SCORE (base, extended in Phase 16) ======== */
function calcLegacyScore(){
  let score = 0;
  const livingFamily = state.relationships.filter(r=>r.alive && r.rel>=50).length;
  score += clamp(livingFamily*4, 0, 20);
  score += clamp((state.job?state.job.tier:0)*4, 0, 20);
  score += clamp(state.stats.karma*0.2, 0, 20);
  score += clamp(state.achievements.size*0.6, 0, 15);
  score += clamp(state.kids.length*3, 0, 10);
  score += clamp(Math.log10(Math.max(1,netWorth()))*1.5, 0, 15);
  return clamp(Math.round(score),0,100);
}
function legacyGrade(score){
  if(score>=90) return {grade:'S', title:'Legendary Life'};
  if(score>=75) return {grade:'A', title:'Remarkable Life'};
  if(score>=60) return {grade:'B', title:'Well-Lived Life'};
  if(score>=40) return {grade:'C', title:'Ordinary Life'};
  if(score>=20) return {grade:'D', title:'Troubled Life'};
  return {grade:'F', title:'Wasted Potential'};
}

  ]});
}
function tickAffairDiscoveryP15(){
  if(!state.flags.affair) return;
  const spouse = state.relationships.find(r=>r.id===state.spouseId);
  if(!spouse){ state.flags.affair=false; return; }
  if(chance(35)){

  } else if(chance(15)){
    state.flags.affair = false;
    log(`The affair fizzled out on its own before anyone found out.`,'neutral');
  }
}

/* ---------------------------------------------------------------------
   AI FAMILY CONVERSATIONS VIA THE CLAUDE API
   API key + model are stored in this browser's localStorage only, never
   in game state (so they aren't part of any save/export of a life).
   --------------------------------------------------------------------- */
function getApiKeyP15(){ return localStorage.getItem('lifeplay_api_key')||''; }
function setApiKeyP15(k){ localStorage.setItem('lifeplay_api_key', k); }
function getApiModelP15(){ return localStorage.getItem('lifeplay_api_model')||'claude-sonnet-4-5-20250929'; }
function setApiModelP15(m){ localStorage.setItem('lifeplay_api_model', m); }

function escapeHtmlP15(str){
  return String(str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
/* Parses an Anthropic API error response body into a clear, specific message.
   Kept separate from the network-failure path (TypeError from fetch itself,
   almost always CORS/offline/DNS) so users can tell "bad key" from "can't connect". */
async function parseApiErrorP15(res){
  let bodyText = '';
  try{ bodyText = await res.text(); }catch(e){ /* ignore */ }
  let msg = null;
  try{ const j = JSON.parse(bodyText); msg = j && j.error && j.error.message; }catch(e){ /* not JSON */ }
  if(res.status===401) return 'Invalid API key (401). Double-check the key in AI Chat Settings.';
  if(res.status===403) return 'Access denied (403). ' + (msg || 'This key may not have permission for direct browser access.');
  if(res.status===404) return `Model not found (404). "${getApiModelP15()}" may be misspelled or unavailable to your account — try a different model in AI Chat Settings.`;
  if(res.status===429) return 'Rate limited (429). You are sending messages too quickly, or are out of quota — wait a moment and try again.';
  if(res.status>=500) return `Anthropic's servers had an issue (${res.status}). Try again shortly.`;
  return `HTTP ${res.status}${msg ? ': '+msg : (bodyText ? ': '+bodyText.slice(0,150) : '')}`;
}
async function callClaudeApiP15(messages, systemPrompt, maxTokens){
  const apiKey = getApiKeyP15();
  const model = getApiModelP15();
  if(!apiKey) throw new Error('No API key set.');
  let res;
  try{
    res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'content-type':'application/json',
        'x-api-key': apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true',
      },
      body: JSON.stringify({ model, max_tokens:maxTokens||200, system:systemPrompt, messages })
    });
  } catch(networkErr){
    throw new Error('Could not reach api.anthropic.com. This is usually a network problem, an ad/privacy blocker, or the browser blocking the cross-origin request — not necessarily a bad key.');
  }
  if(!res.ok) throw new Error(await parseApiErrorP15(res));
  const data = await res.json();
  const block = (data.content||[]).find(b=>b.type==='text');
  return block ? block.text : '[The model returned an empty response.]';
}

function openApiSettingsPanelP15(){
  const key = getApiKeyP15();
  const model = getApiModelP15();
  let html = `<p style="color:var(--sub)">Enter your Anthropic Claude API key to unlock AI-powered conversations with your in-game family and friends. Your key is stored only in this browser's local storage and is sent directly to Anthropic's API — never anywhere else.</p>`;
  html += `<div class="field"><label>API Key</label><input id="api-key-input" type="password" value="${escapeHtmlP15(key)}" placeholder="sk-ant-..."></div>`;
  html += `<div class="field"><label>Model</label><input id="api-model-input" type="text" value="${escapeHtmlP15(model)}"></div>`;
  html += `<button class="btn btn-block btn-primary" onclick="saveApiSettingsP15()">Save</button>`;
  html += `<button class="btn btn-block btn-accent" id="api-test-btn" onclick="testApiConnectionP15()">Test Connection</button>`;
  html += `<div id="api-test-result" style="font-size:.85em;color:var(--sub);margin-top:4px;"></div>`;
  openPanel('AI Chat Settings', html);
}
function saveApiSettingsP15(){
  setApiKeyP15($('api-key-input').value.trim());
  setApiModelP15($('api-model-input').value.trim() || 'claude-sonnet-4-5-20250929');
  log(`Claude API settings saved.`,'neutral');
  const resultEl = document.getElementById('api-test-result');
  if(resultEl) resultEl.textContent = 'Saved. Click "Test Connection" to verify it works.';
}
async function testApiConnectionP15(){
  saveApiSettingsP15();
  const btn = document.getElementById('api-test-btn');
  const resultEl = document.getElementById('api-test-result');
  if(!getApiKeyP15()){ if(resultEl){ resultEl.textContent = '⚠️ Enter an API key first.'; resultEl.style.color='var(--danger)'; } return; }
  if(btn) btn.textContent = 'Testing...';
  if(resultEl){ resultEl.textContent = 'Contacting api.anthropic.com...'; resultEl.style.color='var(--sub)'; }
  try{
    const reply = await callClaudeApiP15([{role:'user', content:'Reply with just the single word: OK'}], 'You are a connection test. Reply with exactly one word.', 10);
    if(resultEl){ resultEl.textContent = '✅ Connected! Model replied: "'+reply.trim()+'"'; resultEl.style.color='var(--accent)'; }
  } catch(err){
    if(resultEl){ resultEl.textContent = '❌ '+err.message; resultEl.style.color='var(--danger)'; }
  }
  if(btn) btn.textContent = 'Test Connection';
}

function openFamilyChatP15(relId){
  const r = state.relationships.find(x=>x.id===relId);
  if(!r) return;
  if(!r.chatHistory) r.chatHistory = [];
  renderFamilyChatP15(r);
}
function renderFamilyChatP15(r){
  const key = getApiKeyP15();
  let html = `<h3>💬 ${escapeHtmlP15(r.name)}</h3>`;
  if(!key){
    html += `<p style="color:var(--sub)">Set your Claude API key first to chat with ${escapeHtmlP15(r.name)}.</p>`;
    html += `<button class="btn btn-block" onclick="closeModal(); openApiSettingsPanelP15();">Open AI Chat Settings</button>`;
    showModal(html);
    return;
  }
  html += `<div id="chat-log" style="display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto;margin-bottom:10px;">`;
  r.chatHistory.forEach(m=>{
    const mine = m.role==='user';
    html += `<div style="align-self:${mine?'flex-end':'flex-start'};background:${mine?'var(--panel2)':'var(--panel)'};border:1px solid var(--border);border-radius:10px;padding:6px 10px;max-width:80%;font-size:.85em;white-space:pre-wrap;">${escapeHtmlP15(m.content)}</div>`;
  });
  html += `</div>`;
  html += `<div class="row"><input id="chat-input" type="text" placeholder="Say something..." style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);"><button class="btn btn-primary" id="chat-send-btn">Send</button></div>`;
  html += `<button class="btn btn-block" style="margin-top:8px" onclick="closeModal()">Close</button>`;
  showModal(html);
  const logEl = document.getElementById('chat-log');
  if(logEl) logEl.scrollTop = logEl.scrollHeight;
  document.getElementById('chat-send-btn').onclick = ()=>sendFamilyChatP15(r);
  document.getElementById('chat-input').addEventListener('keydown', e=>{ if(e.key==='Enter') sendFamilyChatP15(r); });
}
async function sendFamilyChatP15(r){
  const input = document.getElementById('chat-input');
  if(!input) return;
  const text = input.value.trim();
  if(!text) return;
  r.chatHistory.push({role:'user', content:text});
  renderFamilyChatP15(r);
  const logEl = document.getElementById('chat-log');
  if(logEl){
    const typingEl = document.createElement('div');
    typingEl.style.cssText = 'align-self:flex-start;color:var(--sub);font-size:.8em;';
    typingEl.textContent = `${r.name} is typing...`;
    logEl.appendChild(typingEl);
    logEl.scrollTop = logEl.scrollHeight;
  }
  const persona = `You are roleplaying as ${r.name}, the ${relLabel(r.type)} of ${state.name} in a life simulation game called LifePlay. ${r.name} is ${r.age} years old. Your relationship closeness with ${state.name} is ${Math.round(r.rel)}/100. Stay fully in character as ${r.name} — warm or distant depending on the relationship score, with a distinct personality. Keep replies conversational and under 60 words. Never break character or mention that you are an AI.`;
  try{
    const messages = r.chatHistory.filter(m=>m.role==='user'||m.role==='assistant').map(m=>({role:m.role, content:m.content}));
    const reply = await callClaudeApiP15(messages, persona, 200);
    r.chatHistory.push({role:'assistant', content:reply});
  } catch(err){
    r.chatHistory.push({role:'assistant', content:'⚠️ '+err.message});
  }
  renderFamilyChatP15(r);
}

/* ---------------------------------------------------------------------
   FULL PET SYSTEM — aging, care, vet visits, natural death
   --------------------------------------------------------------------- */
const PET_LIFESPANS_P15 = {Dog:14, Cat:16, Parrot:45, Hamster:3, Snake:18, Rabbit:10};

const _origAdoptPet_P15 = adoptPet;
adoptPet = function(type){
  const before = state.pets.length;
  _origAdoptPet_P15(type);
  if(state.pets.length>before){
    const p = state.pets[state.pets.length-1];
    p.health = 100;
  }
};

function careForPetP15(idx){
  const p = state.pets[idx]; if(!p || !p.alive) return;
  p.happiness = clamp(p.happiness+rand(8,15),0,100);
  state.stats.happiness = clamp(state.stats.happiness+2,0,100);
  log(`You spent time playing with ${p.name}.`,'good');
  openPetCarePanelP15();
}
function vetVisitP15(idx){
  const p = state.pets[idx]; if(!p || !p.alive) return;
  const cost = 80;
  if(state.money<cost){ log(`Not enough money for a vet visit.`,'bad'); openPetCarePanelP15(); return; }
  state.money -= cost;
  p.health = clamp(p.health+rand(20,40),0,100);
  log(`You took ${p.name} to the vet for a checkup.`,'good');
  openPetCarePanelP15();
}
function rehomePetP15(idx){
  const p = state.pets[idx]; if(!p) return;
  log(`You found ${p.name} a loving new home. It was hard to say goodbye.`,'neutral');
  state.stats.happiness = clamp(state.stats.happiness-3,0,100);
  state.pets.splice(idx,1);
  openPetCarePanelP15();
}
function tickPetsP15(){
  state.pets.forEach(p=>{
    if(!p.alive) return;
    p.age++;
    p.happiness = clamp(p.happiness - rand(2,6), 0, 100);
    p.health = clamp((p.health==null?100:p.health) - rand(1,5), 0, 100);
    const lifespan = PET_LIFESPANS_P15[p.type] || 12;
    if(p.age>=15) checkAchievement('animal_whisperer');
    let deathChance = 0;
    if(p.age>=lifespan) deathChance += (p.age-lifespan+1)*10;
    if(p.health<20) deathChance += 15;
    if(p.happiness<15) deathChance += 5;
    if(deathChance>0 && chance(deathChance)){
      p.alive = false;
      log(`💔 ${p.name} passed away. You'll miss your old friend.`,'bad');
      state.stats.happiness = clamp(state.stats.happiness-10,0,100);
    }
  });
}
function openPetCarePanelP15(){
  let html = '';
  const living = state.pets.filter(p=>p.alive);
  if(!living.length){
    html += `<p style="color:var(--sub)">You have no pets right now.</p>`;
  } else {
    living.forEach(p=>{
      const idx = state.pets.indexOf(p);
      html += `<div class="list-item"><div class="li-main"><b>${p.name}</b><span>${p.type} · Age ${p.age} · Happiness ${p.happiness}% · Health ${p.health==null?100:p.health}%</span></div></div>`;
      html += `<div class="row"><button class="btn" onclick='careForPetP15(${idx})'>Play & Feed</button><button class="btn" onclick='vetVisitP15(${idx})'>Vet Visit ($80)</button></div>`;
      html += `<button class="btn btn-block" onclick='rehomePetP15(${idx})'>Rehome ${p.name}</button>`;
    });
  }
  const deceased = state.pets.filter(p=>!p.alive);
  if(deceased.length){
    html += `<hr style="border-color:var(--border)"><b>In Memory</b>`;
    deceased.forEach(p=>{ html += `<div class="list-item"><div class="li-main"><b>${p.name}</b><span>${p.type} · Lived to age ${p.age}</span></div></div>`; });
  }
  openPanel('Pet Care', html);
}
