<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LifePlay</title>
<style>
  /* ==========================================================================
     LifePlay visual identity, take three: "THE GAZETTE" — your life told as
     a personal daily broadsheet. Grounded in a mechanic the game already
     had (the newspaper() front-page cards for big moments) and pushed
     across the whole interface: a masthead, an almanac box in place of
     stat bars/rings, life events set as newspaper column copy instead of
     app cards, section-tab navigation, and an Obituaries page at death.
     Deliberately single-theme (aged newsprint + one spot ink color) rather
     than a light/dark pair — a printed page doesn't have a dark mode.
     All existing JS still renders through the same custom property NAMES
     (--bg, --panel, --panel2, --accent, --accent2, --danger, --text, --sub,
     --border, plus the --gold/--ink-line/--life-* tokens this project
     introduced), so only values change here; nothing downstream breaks.
     ========================================================================== */
  :root{
    /* Jewel-tone pass: the newsprint bones stay (masthead, almanac, column
       log) but the ink is no longer a single spot-red doing every job.
       Gold is finally actually gold; green/blue/red/amber are pulled
       toward saturated jewel tones instead of desaturated "ink" versions,
       so the whole thing reads richer without losing paper legibility. */
    --bg:#E8D8A0;           /* the desk the paper sits on — warm gilded parchment */
    --panel:#F7EFDA;        /* newsprint page color */
    --panel2:#EEE0B8;       /* secondary surface — byline boxes, inputs */
    --accent:#0F6B4C;       /* "good" — deep emerald */
    --accent2:#1E4D8C;      /* "info" — deep sapphire */
    --danger:#A81C3E;       /* "bad" — deep ruby */
    --warn:#B8860B;         /* amber / goldenrod */
    --text:#1C1A16;         /* warm black ink */
    --sub:#6B5E3F;          /* byline, warmed toward gold */
    --border:#D0BD7A;       /* hairline rule on paper, gold-tinted */
    --gold:#A8841C;         /* the spot color — masthead, Age Up, seals, sparkle. Deep
                                enough for AA contrast as small caption text on cream. */
    --gold-deep:#7A5C10;
    --ink-line:#1C1A16;
    --life-red:#A81C3E; --life-green:#0F6B4C; --life-blue:#1E4D8C; --life-pink:#8C3565; --life-gold:#B8860B;
    --font-display: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    --font-body: Georgia, 'Times New Roman', serif;
    --font-caption: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);font-family:var(--font-body);color:var(--text);}
  #phone{max-width:430px;margin:0 auto;min-height:100vh;background:var(--panel);display:flex;flex-direction:column;position:relative;overflow-x:hidden;box-shadow:0 0 0 1px var(--border);
    background-image:repeating-linear-gradient(0deg, rgba(0,0,0,.015) 0px, rgba(0,0,0,.015) 1px, transparent 1px, transparent 3px);}
  .hidden{display:none !important;}
  /* Desktop / wide-viewport treatment: a newspaper still reads as a fixed-width
     column on a big screen, so widen it modestly and let it rest on a proper
     desk surface instead of floating in empty white space. Mobile is untouched. */
  @media (min-width: 760px){
    html,body{background:radial-gradient(ellipse at 50% 0%, #EEDFA8 0%, var(--bg) 45%, #2A3B2E 100%);}
    #phone{max-width:560px;min-height:calc(100vh - 48px);margin:24px auto;box-shadow:0 24px 60px rgba(15,20,15,.45), 0 0 0 1px var(--gold-deep);border-radius:3px;}
    .btn{cursor:pointer;transition:transform .08s, box-shadow .08s, filter .12s;}
    .btn:hover{filter:brightness(1.04);}
    .btn:hover:not(:active){transform:translateY(-1px);box-shadow:3px 4px 0 var(--ink-line);}
    #bottomnav button{cursor:pointer;transition:background .12s;}
    #bottomnav button:hover{background:var(--panel2);}
    .list-item{transition:background .12s;}
    .list-item:hover{background:var(--panel2);}
  }
  h1,h2,h3{font-family:var(--font-display); text-wrap:balance;}
  button, input, select{font-family:inherit;}
  button:focus-visible, input:focus-visible, select:focus-visible{outline:2px solid var(--gold-deep); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }
  .masthead{text-align:center;padding:14px 14px 8px;background:var(--panel);position:relative;}
  .masthead::after{content:"";display:block;height:5px;margin-top:8px;background-image:linear-gradient(135deg, var(--gold) 25%, transparent 25%, transparent 50%, var(--gold) 50%, var(--gold) 75%, transparent 75%, transparent);background-size:8px 8px;opacity:.55;}
  .crest{display:block;margin:0 auto 4px;}
  #screen-loading .crest-big{margin-bottom:10px;}
  .masthead-title{font-family:var(--font-display);font-weight:700;font-size:1.7em;letter-spacing:.03em;text-transform:uppercase;border-top:3px double var(--ink-line);border-bottom:3px double var(--ink-line);padding:6px 0;text-wrap:balance;}
  .masthead-sub{font-family:var(--font-caption);font-size:.62em;letter-spacing:.14em;text-transform:uppercase;color:var(--sub);margin-top:5px;font-weight:600;}
  /* Loading */
  #screen-loading{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);}
  #screen-loading h1{font-family:var(--font-display);font-size:2.5em;letter-spacing:.02em;margin-bottom:2px;font-weight:700;color:var(--text);text-transform:uppercase;border-top:3px double var(--ink-line);border-bottom:3px double var(--ink-line);padding:8px 14px;}
  #screen-loading p{color:var(--sub);margin-top:10px;font-family:var(--font-caption);font-size:.75em;letter-spacing:.1em;text-transform:uppercase;font-weight:600;}
  .loadbar-track{width:70%;height:3px;background:var(--panel2);overflow:hidden;margin-top:30px;}
  .loadbar-fill{height:100%;width:0%;background:var(--gold);transition:width .1s linear;}
  #loading-tip{margin-top:14px;font-size:.85em;color:var(--sub);text-align:center;padding:0 20px;font-style:italic;}
  /* New life */
  #screen-newlife{padding:24px 20px;display:flex;flex-direction:column;gap:14px;min-height:100vh;background:var(--bg);}
  #screen-newlife h2{text-align:center;margin-bottom:0;font-weight:700;text-transform:uppercase;letter-spacing:.03em;border-top:3px double var(--ink-line);border-bottom:3px double var(--ink-line);padding:8px 0;}
  .field label{display:block;font-size:.72em;color:var(--sub);margin-bottom:4px;font-weight:700;font-family:var(--font-caption);text-transform:uppercase;letter-spacing:.08em;}
  .field input, .field select{width:100%;padding:11px;border-radius:2px;border:1px solid var(--ink-line);background:var(--panel);color:var(--text);font-size:1em;font-family:var(--font-body);}
  .btn{padding:12px 16px;border-radius:2px;border:1.5px solid var(--ink-line);background:var(--panel2);color:var(--text);font-size:.92em;font-weight:700;font-family:var(--font-caption);text-transform:uppercase;letter-spacing:.05em;cursor:pointer;text-align:center;transition:transform .08s, box-shadow .08s;box-shadow:2px 2px 0 var(--ink-line);}
  .btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink-line);}
  .btn-primary{background:linear-gradient(180deg, color-mix(in srgb, var(--gold) 82%, white) 0%, var(--gold) 55%, var(--gold-deep) 100%);color:#2A1F04;border-color:var(--gold-deep);text-shadow:0 1px 0 rgba(255,255,255,.25);}
  .btn-danger{background:linear-gradient(180deg, color-mix(in srgb, var(--danger) 75%, white) 0%, var(--danger) 60%, color-mix(in srgb, var(--danger) 75%, black) 100%);color:#F7EFDA;}
  .btn-accent{background:linear-gradient(180deg, color-mix(in srgb, var(--accent2) 75%, white) 0%, var(--accent2) 60%, color-mix(in srgb, var(--accent2) 75%, black) 100%);color:#F7EFDA;}
  .btn-block{width:100%;}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}
  /* Game screen */
  #screen-game{display:flex;flex-direction:column;height:100vh;background:var(--bg);}
  #header{padding:10px 14px 12px;background:var(--panel);border-bottom:2px solid var(--ink-line);}
  #header .who{display:flex;align-items:center;gap:10px;}
  .avatar-ring{width:46px;height:46px;border-radius:2px;background:var(--panel2);border:1.5px solid var(--ink-line);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
  #header .avatar{width:100%;height:100%;line-height:1;}
  #header .avatar svg{display:block;width:100%;height:100%;}
  #header .who-info{flex:1;min-width:0;}
  #header .who-info b{font-size:1.05em;font-family:var(--font-display);font-weight:700;display:block;}
  #header .who-info span{display:block;font-size:.68em;color:var(--sub);font-family:var(--font-caption);text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
  .cash-pill{font-weight:700;color:var(--text);background:var(--panel2);border:1.5px solid var(--ink-line);border-radius:2px;padding:4px 8px;font-size:.78em;white-space:nowrap;font-variant-numeric:tabular-nums;font-family:var(--font-caption);}
  .almanac{margin-top:10px;border:1px solid var(--ink-line);border-radius:2px;}
  .almanac-label{font-family:var(--font-caption);font-size:.58em;letter-spacing:.14em;text-transform:uppercase;color:var(--sub);text-align:center;padding:3px 0;border-bottom:1px solid var(--border);font-weight:700;}
  .almanac-weather{font-family:var(--font-caption);font-size:.62em;color:var(--sub);text-align:center;padding:4px 0;border-top:1px solid var(--border);letter-spacing:.02em;}
  .stats{display:flex;}
  .stat-badge{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px 5px;border-right:1px solid var(--border);animation:statPop .28s ease;}
  .stat-badge:last-child{border-right:none;}
  .stat-badge .stat-ic{font-family:var(--font-caption);font-size:.56em;letter-spacing:.05em;text-transform:uppercase;color:var(--sub);font-weight:700;}
  .stat-badge .stat-num{font-size:1.05em;font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--font-display);border-bottom:2px solid var(--stat-color, var(--ink-line));padding:0 3px 1px;}
  @keyframes statPop{ from{opacity:.3;} to{opacity:1;} }
  #log{flex:1;overflow-y:auto;padding:6px 16px 12px;display:flex;flex-direction:column-reverse;}
  .logline{padding:9px 0;font-size:.92em;line-height:1.45;border-bottom:1px solid var(--border);font-family:var(--font-body);}
  .logline .age{color:var(--text);font-family:var(--font-caption);font-size:.68em;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-right:6px;}
  .logline.good .age{color:var(--accent);}
  .logline.bad .age{color:var(--danger);}
  .logline.neutral .age{color:var(--accent2);}
  .newspaper{background:var(--panel);color:var(--text);border-top:4px double var(--ink-line);border-bottom:4px double var(--ink-line);padding:14px 4px;margin:6px 0;}
  .newspaper .np-name{font-family:var(--font-caption);font-size:.6em;letter-spacing:.25em;text-transform:uppercase;text-align:center;color:var(--gold);font-weight:800;margin-bottom:4px;}
  .newspaper h3{margin:0 0 6px;font-size:1.3em;text-align:center;line-height:1.15;font-weight:700;text-wrap:balance;}
  .newspaper p{margin:0;font-size:.82em;text-align:center;font-style:italic;color:var(--sub);}
  .sports-card{background:var(--panel2);border:3px solid var(--ink-line);padding:12px 14px;margin:8px 0;}
  .sports-card .sd-eyebrow{font-family:var(--font-caption);font-size:.58em;letter-spacing:.2em;text-transform:uppercase;color:var(--accent2);font-weight:800;}
  .sports-card .sd-headline{font-family:var(--font-caption);font-size:1.15em;font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:1.2;margin:3px 0 4px;}
  .sports-card .sd-sub{font-family:var(--font-caption);font-size:.78em;color:var(--sub);}
  .business-card{background:var(--panel2);border:1px solid var(--ink-line);border-left:5px solid var(--accent);padding:11px 13px;margin:8px 0;}
  .business-card .bd-eyebrow{font-family:var(--font-caption);font-size:.58em;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:800;}
  .business-card .bd-headline{font-family:var(--font-display);font-size:1.05em;font-weight:700;margin:3px 0 3px;}
  .business-card .bd-sub{font-family:var(--font-caption);font-size:.78em;color:var(--sub);font-variant-numeric:tabular-nums;}
  #bottomnav{display:grid;grid-template-columns:repeat(6,1fr);background:var(--panel);border-top:2px solid var(--ink-line);}
  #bottomnav button{background:none;border:none;border-right:1px solid var(--border);color:var(--text);padding:8px 2px 7px;font-family:var(--font-caption);font-size:.58em;font-weight:700;text-transform:uppercase;letter-spacing:.02em;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;}
  #bottomnav button:last-child{border-right:none;}
  #bottomnav button .ic{font-size:1.15em;filter:saturate(1.15);}
  #bottomnav button.active{color:var(--gold-deep);}
  #bottomnav button.active .ic{filter:saturate(1.4) drop-shadow(0 0 2px color-mix(in srgb, var(--gold) 50%, transparent));}
  #ageup-btn{position:sticky;bottom:0;margin:10px;width:calc(100% - 20px);border-radius:2px;padding:14px;font-size:.95em;letter-spacing:.08em;border:2px solid var(--gold-deep);position:relative;box-shadow:2px 2px 0 var(--gold-deep), 0 4px 14px rgba(139,105,20,.35);}
  /* Panel / modal */
  #panel-overlay{position:absolute;inset:0;background:rgba(28,26,22,.55);display:flex;align-items:flex-end;z-index:50;}
  #panel{background:var(--panel);width:100%;max-height:82vh;display:flex;flex-direction:column;overflow:hidden;border-top:3px double var(--ink-line);}
  #panel-head{padding:12px 16px;border-bottom:1px solid var(--ink-line);display:flex;justify-content:space-between;align-items:center;background:var(--panel);}
  #panel-head h3{margin:0;font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:1em;}
  #panel-body{padding:6px 16px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:0;}
  .close-x{background:none;border:1px solid var(--ink-line);border-radius:50%;width:24px;height:24px;color:var(--text);font-size:1em;cursor:pointer;line-height:1;}
  .list-item{background:none;border:none;border-bottom:1px solid var(--border);border-radius:0;padding:10px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:none;}
  .list-item .li-main{flex:1;min-width:0;}
  .list-item .li-main b{display:block;font-family:var(--font-display);font-weight:700;}
  .list-item .li-main span{font-size:.75em;color:var(--sub);font-family:var(--font-caption);}
  .li-portrait{width:34px;height:34px;flex-shrink:0;border:1.5px solid var(--ink-line);background:var(--panel2);overflow:hidden;}
  .li-portrait svg{display:block;width:100%;height:100%;}
  .best-friend-badge{color:var(--gold-deep, var(--gold));font-size:.85em;}
  .family-tree{display:flex;flex-direction:column;gap:14px;}
  .ft-gen-label{font-family:var(--font-caption);font-size:.66em;letter-spacing:.12em;text-transform:uppercase;color:var(--sub);text-align:center;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:3px 0;margin-bottom:8px;font-weight:600;}
  .ft-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;}
  .ft-node{display:flex;flex-direction:column;align-items:center;width:58px;text-align:center;}
  .ft-portrait{width:44px;height:44px;border:1.5px solid var(--ink-line);background:var(--panel2);overflow:hidden;border-radius:50%;}
  .ft-portrait svg{display:block;width:100%;height:100%;}
  .ft-name{font-size:.62em;font-weight:700;margin-top:3px;line-height:1.15;}
  .ft-rel{font-size:.58em;color:var(--sub);}
  .ft-you .ft-portrait{border:2px solid var(--gold-deep);box-shadow:0 0 0 2px var(--gold);}
  .ft-you .ft-name{color:var(--gold-deep);}
  .yb-header{text-align:center;font-family:var(--font-caption);font-size:.7em;letter-spacing:.12em;text-transform:uppercase;color:var(--sub);border-top:3px double var(--ink-line);border-bottom:3px double var(--ink-line);padding:6px 0;margin-bottom:12px;font-weight:700;}
  .yb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px;}
  .yb-tile{display:flex;flex-direction:column;align-items:center;text-align:center;background:var(--panel2);border:1px solid var(--border);padding:6px 3px 8px;}
  .yb-portrait{width:48px;height:48px;border:1.5px solid var(--ink-line);background:var(--panel);overflow:hidden;border-radius:50%;margin-bottom:4px;}
  .yb-portrait svg{display:block;width:100%;height:100%;}
  .yb-name{font-size:.62em;font-weight:700;line-height:1.15;}
  .yb-role{font-size:.56em;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;margin-top:1px;}
  #panel-body > .btn{margin:5px 0;}
  .pill{display:inline-block;padding:2px 8px;font-size:.65em;font-weight:700;font-family:var(--font-caption);text-transform:uppercase;letter-spacing:.03em;background:none;color:var(--gold);border:1px solid var(--gold);border-radius:2px;}
  .letter{padding:10px 0 10px 14px;border-left:3px solid var(--border);border-bottom:1px solid var(--border);font-style:italic;font-size:.9em;line-height:1.45;color:var(--sub);}
  .letter .letter-head{display:block;font-style:normal;font-family:var(--font-caption);font-size:.62em;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:800;margin-bottom:3px;}
  .letter .letter-sig{display:block;font-style:normal;font-weight:700;color:var(--text);margin-top:4px;font-size:.85em;}
  .classified{border:1px dashed var(--ink-line);padding:9px 10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .classified .cl-text{font-size:.85em;}
  .classified .cl-text b{display:block;font-family:var(--font-display);}
  .classified .cl-text span{color:var(--sub);font-size:.85em;font-family:var(--font-caption);}
  #modal-overlay{position:absolute;inset:0;background:rgba(28,26,22,.7);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;}
  #modal-card{background:var(--panel);border:3px double var(--ink-line);border-radius:0;padding:20px;max-width:360px;width:100%;max-height:85vh;overflow-y:auto;}
  #modal-card h3{margin-top:0;font-weight:700;text-transform:uppercase;letter-spacing:.03em;text-align:center;border-bottom:1px solid var(--border);padding-bottom:8px;}
  #modal-card .choices{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  /* Death screen — the Obituaries page */
  #screen-dead{padding:0 0 28px;text-align:center;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;align-items:center;}
  .obit-masthead{width:100%;background:var(--panel);padding:16px 14px 10px;border-bottom:3px double var(--ink-line);}
  .obit-masthead .section{font-family:var(--font-caption);font-size:.62em;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);font-weight:800;}
  .obit-masthead h1{font-size:1.8em;margin:4px 0 0;text-transform:uppercase;letter-spacing:.02em;font-weight:700;}
  .obit-photo{width:64px;height:64px;border-radius:2px;background:var(--panel2);border:1.5px solid var(--ink-line);display:flex;align-items:center;justify-content:center;font-size:2em;margin:16px auto 4px;filter:grayscale(45%);}
  .obit-photo-cap{font-family:var(--font-caption);font-size:.56em;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);margin-bottom:10px;}
  .obit-name{font-size:1.3em;font-weight:700;margin:0 0 2px;}
  .obit-years{color:var(--sub);font-family:var(--font-caption);font-size:.78em;margin-bottom:12px;}
  .obit-body{max-width:320px;padding:0 22px;font-size:.92em;line-height:1.6;text-align:left;color:var(--text);}
  .obit-body p{margin:0 0 10px;}
  .almanac-death{margin:16px 22px 0;border:1px solid var(--ink-line);width:calc(100% - 44px);max-width:320px;}
  .almanac-death .almanac-label{background:var(--panel2);}
  .almanac-death-row{display:flex;justify-content:space-between;padding:6px 12px;border-bottom:1px solid var(--border);font-size:.82em;font-family:var(--font-caption);}
  .almanac-death-row:last-child{border-bottom:none;}
  .almanac-death-row b{font-family:var(--font-display);}
  .legacy-badge{font-size:2.6em;font-weight:700;margin:2px 0 0;font-family:var(--font-display);color:var(--gold);}
  .legacy-grade{font-size:.85em;color:var(--sub);font-weight:600;font-family:var(--font-caption);}
  ::-webkit-scrollbar{width:6px;} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
</style>
</head>
<body>
<div id="phone">

  <div id="screen-loading">
    <svg class="crest crest-big" viewBox="-3 -3 40 40" width="72" height="72">
      <circle cx="17" cy="17" r="15" fill="none" stroke="var(--gold)" stroke-width="1.6"/>
      <circle cx="17" cy="17" r="11" fill="none" stroke="var(--gold)" stroke-width="1"/>
      <line x1="32" y1="17" x2="36" y2="17" stroke="var(--gold)" stroke-width="1.6"/>
      <line x1="17" y1="32" x2="17" y2="36" stroke="var(--gold)" stroke-width="1.6"/>
      <line x1="2" y1="17" x2="-2" y2="17" stroke="var(--gold)" stroke-width="1.6"/>
      <line x1="17" y1="2" x2="17" y2="-2" stroke="var(--gold)" stroke-width="1.6"/>
      <text x="17" y="22" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="13" fill="var(--text)">LP</text>
    </svg>
    <h1>LifePlay</h1>
    <p>a life simulator</p>
    <div class="loadbar-track"><div class="loadbar-fill" id="loadbar-fill"></div></div>
    <div id="loading-tip">Loading...</div>

<script>
'use strict';
/* =========================================================================
   LIFEPLAY — single file life simulator
   ========================================================================= */

/* ============================ UTILITIES ================================ */
function $(id){ return document.getElementById(id); }
function rand(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[rand(0,arr.length-1)]; }
function chance(pct){ return Math.random()*100 < pct; }
function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
function fmtMoney(n){
  n = Math.round(n);
  const neg = n<0; n = Math.abs(n);
  let s = n.toLocaleString('en-US');
  return (neg?'-$':'$')+s;
}
function uid(){ return 'id'+Math.random().toString(36).slice(2,10); }

/* ============================ DATA: STATIC =============================== */
const CITIES = ["New York","Los Angeles","Chicago","Houston","Miami","Las Vegas","Seattle","Boston",
  "Austin","Denver","Atlanta","Nashville","Phoenix","Portland","New Orleans","San Francisco"];

const MALE_FIRST = ["James","John","Robert","Michael","David","William","Richard","Joseph","Thomas","Charles",

/* ============================ STATE ====================================== */

}

function newRelationship(type, opts){

/* ============================ RENDER ENGINE ============================== */
function showScreen(name){
  ['loading','newlife','game','dead'].forEach(s=>{
    $('screen-'+s).classList.toggle('hidden', s!==name);
  });
}
const STAT_BADGES = {
  health:{ic:'Hlth', color:'var(--life-red)'}, happiness:{ic:'Happy', color:'var(--life-gold)'},
  smarts:{ic:'Smart', color:'var(--life-blue)'}, looks:{ic:'Looks', color:'var(--life-pink)'},
  karma:{ic:'Karma', color:'var(--life-green)'},
};

/* Engraved-silhouette portrait, cameo style — replaces the plain emoji avatar
   with original hand-authored art that fits the Gazette's paper-and-ink world. */
const DEAD_AVATAR_SVG = `<svg viewBox="0 0 64 64" width="100%" height="100%"><path d="M32,10 C20,10 12,19 12,31 C12,40 17,46 21,50 L21,56 L27,56 L27,52 L30,52 L30,56 L34,56 L34,52 L37,52 L37,56 L43,56 L43,50 C47,46 52,40 52,31 C52,19 44,10 32,10 Z" fill="var(--ink-line)"/><circle cx="24" cy="30" r="4" fill="var(--panel2)"/><circle cx="40" cy="30" r="4" fill="var(--panel2)"/></svg>`;

/* Deterministic string hash — same person always gets the same look, different
   people (almost) always look different, no randomness/state needed. */
function seedFromString(str){
  let h = 5381;
  str = String(str||'anon');
  for(let i=0;i<str.length;i++){ h = ((h*33) ^ str.charCodeAt(i)) >>> 0; }
  return h;
}
const FEMALE_HAIR = [
  cy=>`<ellipse cx="20" cy="${cy+5}" rx="5.5" ry="10" fill="var(--ink-line)"/><ellipse cx="44" cy="${cy+5}" rx="5.5" ry="10" fill="var(--ink-line)"/><circle cx="32" cy="${cy-8}" r="9" fill="var(--ink-line)"/>`,
  cy=>`<ellipse cx="19" cy="${cy+10}" rx="6" ry="15" fill="var(--ink-line)"/><ellipse cx="45" cy="${cy+10}" rx="6" ry="15" fill="var(--ink-line)"/><circle cx="32" cy="${cy-8}" r="9" fill="var(--ink-line)"/>`,
  cy=>`<circle cx="32" cy="${cy-8}" r="9" fill="var(--ink-line)"/><ellipse cx="47" cy="${cy+8}" rx="4" ry="9" fill="var(--ink-line)"/>`,
  cy=>`<circle cx="32" cy="${cy-9}" r="7.5" fill="var(--ink-line)"/>`,
  cy=>`<circle cx="20" cy="${cy-4}" r="5" fill="var(--ink-line)"/><circle cx="44" cy="${cy-4}" r="5" fill="var(--ink-line)"/><circle cx="26" cy="${cy-11}" r="5.5" fill="var(--ink-line)"/><circle cx="38" cy="${cy-11}" r="5.5" fill="var(--ink-line)"/><circle cx="32" cy="${cy-13}" r="5" fill="var(--ink-line)"/>`,
];
const MALE_HAIR = [
  cy=>`<circle cx="32" cy="${cy-8}" r="9" fill="var(--ink-line)"/>`,
  cy=>``,
  cy=>`<ellipse cx="29" cy="${cy-9}" rx="10" ry="7" fill="var(--ink-line)"/>`,
  cy=>`<path d="M20,${cy-10} Q32,${cy-16} 44,${cy-10} L44,${cy-6} Q32,${cy-11} 20,${cy-6} Z" fill="var(--ink-line)"/>`,
  cy=>`<circle cx="32" cy="${cy-9}" r="12" fill="var(--ink-line)"/>`,
];
const NEUTRAL_HAIR = [
  cy=>``,
  cy=>`<circle cx="32" cy="${cy-9}" r="7" fill="var(--ink-line)"/>`,
  cy=>`<ellipse cx="21" cy="${cy+2}" rx="4.5" ry="7" fill="var(--ink-line)"/><ellipse cx="43" cy="${cy+2}" rx="4.5" ry="7" fill="var(--ink-line)"/>`,
];
function accessoryPoolFor(bracket, gender){
  const pool = [ cy=>'' ];
  pool.push(cy=>`<circle cx="26.5" cy="${cy+1}" r="3" fill="none" stroke="var(--panel2)" stroke-width="1.3"/><circle cx="37.5" cy="${cy+1}" r="3" fill="none" stroke="var(--panel2)" stroke-width="1.3"/><line x1="29.5" y1="${cy+1}" x2="34.5" y2="${cy+1}" stroke="var(--panel2)" stroke-width="1.3"/>`);
  pool.push(cy=>`<path d="M18,${cy-10} Q32,${cy-22} 46,${cy-10} L46,${cy-6} L18,${cy-6} Z" fill="var(--ink-line)"/><ellipse cx="32" cy="${cy-6}" rx="16" ry="2.5" fill="var(--ink-line)"/>`);
  if(bracket!=='child'){
    if(gender==='Male') pool.push(cy=>`<ellipse cx="32" cy="${cy+9}" rx="5" ry="1.6" fill="var(--ink-line)"/>`);
    else pool.push(cy=>`<circle cx="19" cy="${cy+3}" r="1.6" fill="var(--gold)"/><circle cx="45" cy="${cy+3}" r="1.6" fill="var(--gold)"/>`);
  }
  if(bracket==='elder') pool.push(cy=>`<line x1="46" y1="42" x2="49" y2="61" stroke="var(--ink-line)" stroke-width="2.6" stroke-linecap="round"/><circle cx="45.5" cy="41" r="2.2" fill="var(--ink-line)"/>`);
  return pool;
}
/* Small distinguishing marks, layered on top of everything else — purely
   cosmetic variety within the monochrome ink-silhouette style. */
const MARK_POOL = [
  cy=>'',
  cy=>`<circle cx="27" cy="${cy+4}" r=".7" fill="var(--panel2)"/><circle cx="29.5" cy="${cy+6}" r=".7" fill="var(--panel2)"/><circle cx="36" cy="${cy+5}" r=".7" fill="var(--panel2)"/>`,
  cy=>`<circle cx="38" cy="${cy+6}" r="1" fill="var(--panel2)"/>`,
  cy=>`<path d="M27,${cy+9} Q29,${cy+11} 27,${cy+12}" fill="none" stroke="var(--panel2)" stroke-width=".8"/><path d="M37,${cy+9} Q39,${cy+11} 37,${cy+12}" fill="none" stroke="var(--panel2)" stroke-width=".8"/>`,
];
/* Two silhouette builds — narrow vs broad shoulders — for further variety. */
const BODY_PATHS = [
  `<path d="M12,62 C12,45 20,39 32,39 C44,39 52,45 52,62 Z" fill="var(--ink-line)"/>`,
  `<path d="M9,62 C9,43 18,36 32,36 C46,36 55,43 55,62 Z" fill="var(--ink-line)"/>`,
  `<path d="M15,62 C15,47 22,41 32,41 C42,41 49,47 49,62 Z" fill="var(--ink-line)"/>`,
];
/* Outfit accents on the collar — a small formal touch that reads as
   "dressed differently." Each person's accent is picked from a jewel-tone
   palette (not just gold), so the People/Family Tree/Album screens show
   real color variety across a family rather than one repeated hue. */
const OUTFIT_COLORS_P31 = ['var(--gold)', 'var(--accent)', 'var(--accent2)', 'var(--danger)', 'var(--life-pink)'];
const OUTFIT_POOL = [
  (cy,c)=>'',
  (cy,c)=>`<path d="M27,42 L32,48 L37,42" fill="none" stroke="${c}" stroke-width="1.6"/>`,
  (cy,c)=>`<circle cx="32" cy="44" r="1.4" fill="${c}"/><circle cx="32" cy="48" r="1.4" fill="${c}"/>`,
  (cy,c)=>`<rect x="29" y="41" width="6" height="10" fill="${c}"/>`,
];
/* Looks stat (0-100) is genetic, set at birth from the parents' own
   values rather than pure RNG (see P28 below) — and it drives actual
   drawn facial features here, not just a silhouette. Five percentage
   bands (0-20 / 20-40 / 40-60 / 60-80 / 80-100) each get their own
   eyes, brows, nose, mouth and jawline, so the face itself changes as
   the stat moves, all in panel2 linework "engraved" onto the dark
   ink-silhouette head — same trick real woodcut portraits use to show
   features on a solid dark shape. */
function looksBandP29(looksVal){
  const v = looksVal==null ? 50 : looksVal;
  if(v<20) return 0;
  if(v<40) return 1;
  if(v<60) return 2;
  if(v<80) return 3;
  return 4;
}
function jawShapeP29(band, cx, cy, r){
  if(band<=1){
    return `<ellipse cx="${cx-1.5}" cy="${cy}" rx="${r+1}" ry="${r-1.5}" fill="var(--ink-line)"/><ellipse cx="${cx+3.5}" cy="${cy+2.5}" rx="${r-5}" ry="${r-5}" fill="var(--ink-line)"/>`;
  }
  if(band>=3){
    return `<circle cx="${cx}" cy="${cy-1}" r="${r-1}" fill="var(--ink-line)"/><path d="M${cx-r+1},${cy-1} L${cx-4},${cy+r+3} L${cx+4},${cy+r+3} L${cx+r-1},${cy-1} Z" fill="var(--ink-line)"/>`;
  }
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--ink-line)"/>`;
}
function eyesP29(band, cy){
  if(band===0) return `<ellipse cx="26" cy="${cy+1.5}" rx="1.6" ry="1" fill="var(--panel2)"/><ellipse cx="39" cy="${cy+2.3}" rx="1.2" ry=".8" fill="var(--panel2)"/>`;
  if(band===1) return `<ellipse cx="26.5" cy="${cy+1}" rx="1.6" ry="1.1" fill="var(--panel2)"/><ellipse cx="38.5" cy="${cy+1}" rx="1.6" ry="1.1" fill="var(--panel2)"/>`;
  if(band===2) return `<circle cx="27" cy="${cy+1}" r="1.5" fill="var(--panel2)"/><circle cx="38" cy="${cy+1}" r="1.5" fill="var(--panel2)"/>`;
  if(band===3) return `<circle cx="27" cy="${cy+1}" r="1.8" fill="var(--panel2)"/><circle cx="38" cy="${cy+1}" r="1.8" fill="var(--panel2)"/>`;
  return `<circle cx="27" cy="${cy+1}" r="2" fill="var(--panel2)"/><circle cx="27.7" cy="${cy+.3}" r=".55" fill="var(--ink-line)"/><circle cx="38" cy="${cy+1}" r="2" fill="var(--panel2)"/><circle cx="38.7" cy="${cy+.3}" r=".55" fill="var(--ink-line)"/>`;
}
function browsP29(band, cy){
  if(band===0) return `<path d="M23,${cy-3} Q32,${cy-6} 41,${cy-2}" stroke="var(--panel2)" stroke-width="1.7" fill="none" stroke-linecap="round"/>`;
  if(band===1) return `<path d="M23,${cy-3} L29,${cy-2}" stroke="var(--panel2)" stroke-width="1.3" fill="none" stroke-linecap="round"/><path d="M35,${cy-2} L41,${cy-3}" stroke="var(--panel2)" stroke-width="1.3" fill="none" stroke-linecap="round"/>`;
  if(band===2) return `<path d="M24,${cy-2.5} L30,${cy-2.5}" stroke="var(--panel2)" stroke-width="1" fill="none" stroke-linecap="round"/><path d="M34,${cy-2.5} L40,${cy-2.5}" stroke="var(--panel2)" stroke-width="1" fill="none" stroke-linecap="round"/>`;
  if(band===3) return `<path d="M24,${cy-2.5} Q27,${cy-3.4} 30,${cy-2.3}" stroke="var(--panel2)" stroke-width="1" fill="none" stroke-linecap="round"/><path d="M34,${cy-2.3} Q37,${cy-3.4} 40,${cy-2.5}" stroke="var(--panel2)" stroke-width="1" fill="none" stroke-linecap="round"/>`;
  return `<path d="M23.5,${cy-2.5} Q27,${cy-4.2} 30.5,${cy-2}" stroke="var(--panel2)" stroke-width="1.1" fill="none" stroke-linecap="round"/><path d="M33.5,${cy-2} Q37,${cy-4.2} 40.5,${cy-2.5}" stroke="var(--panel2)" stroke-width="1.1" fill="none" stroke-linecap="round"/>`;
}
function noseP29(band, cy){
  if(band===0) return `<path d="M32,${cy+2} L29.5,${cy+6.5} L33,${cy+7.3}" stroke="var(--panel2)" stroke-width=".9" fill="none" stroke-linecap="round"/>`;
  if(band===4) return `<path d="M32,${cy+2.5} L32,${cy+5.5}" stroke="var(--panel2)" stroke-width=".7" fill="none" stroke-linecap="round"/>`;
  return `<path d="M32,${cy+2} L32,${cy+6.5}" stroke="var(--panel2)" stroke-width=".85" fill="none" stroke-linecap="round"/>`;
}
function mouthP29(band, cy){
  if(band===0) return `<path d="M27,${cy+11} Q32,${cy+8.5} 37,${cy+11}" stroke="var(--panel2)" stroke-width="1.3" fill="none" stroke-linecap="round"/>`;
  if(band===1) return `<path d="M27,${cy+10.5} Q32,${cy+9.5} 37,${cy+10.5}" stroke="var(--panel2)" stroke-width="1.1" fill="none" stroke-linecap="round"/>`;
  if(band===2) return `<path d="M27,${cy+10} L37,${cy+10}" stroke="var(--panel2)" stroke-width="1.1" fill="none" stroke-linecap="round"/>`;
  if(band===3) return `<path d="M27,${cy+9.5} Q32,${cy+11.5} 37,${cy+9.5}" stroke="var(--panel2)" stroke-width="1.1" fill="none" stroke-linecap="round"/>`;
  return `<path d="M26,${cy+9} Q32,${cy+12.5} 38,${cy+9}" stroke="var(--panel2)" stroke-width="1.3" fill="none" stroke-linecap="round"/>`;
}
function faceExtrasP29(band, headCx, headCy, headR){
  if(band===0) return `<circle cx="37" cy="${headCy+5}" r="1.1" fill="var(--panel2)"/>`;
  if(band===4){
    const sx = headCx+headR+3, sy = headCy-headR-1;
    return `<path d="M${sx},${sy-3} L${sx+1},${sy} L${sx+4},${sy+1} L${sx+1},${sy+2} L${sx},${sy+5} L${sx-1},${sy+2} L${sx-4},${sy+1} L${sx-1},${sy} Z" fill="var(--gold)"/>`;
  }
  return '';
}
/* Age leaves its own mark regardless of looks — a few soft creases at
   the eyes for elders, so a 30-year-old and an 80-year-old with the
   same looks stat still read as different people. */
function wrinklesP29(headCy){
  return `<path d="M20,${headCy+1} L23,${headCy+.5}" stroke="var(--panel2)" stroke-width=".6" fill="none" stroke-linecap="round"/><path d="M41,${headCy+.5} L44,${headCy+1}" stroke="var(--panel2)" stroke-width=".6" fill="none" stroke-linecap="round"/><path d="M25,${headCy-6} L27,${headCy-7}" stroke="var(--panel2)" stroke-width=".5" fill="none" stroke-linecap="round"/><path d="M39,${headCy-7} L37,${headCy-6}" stroke="var(--panel2)" stroke-width=".5" fill="none" stroke-linecap="round"/>`;
}
/* Renders any person's portrait (player or a relationship): {name, age, gender, alive, looks} */
function personAvatarSVG(person){
  if(person.alive===false) return DEAD_AVATAR_SVG;
  const a = person.age, g = person.gender || 'Nonbinary';
  const bracket = a<2 ? 'baby' : a<13 ? 'child' : a<60 ? 'adult' : 'elder';
  const seed = seedFromString(person.name);
  const looksVal = person.looks!=null ? person.looks : (person.stats ? person.stats.looks : 50);
  const band = looksBandP29(looksVal);
  let bodyIdx = Math.floor(seed/29) % BODY_PATHS.length;
  if(band>=3 && bodyIdx===2) bodyIdx = 1;
  if(band<=1 && bodyIdx===1) bodyIdx = 2;
  const body = bracket==='baby' ? BODY_PATHS[0] : BODY_PATHS[bodyIdx];
  const headR = bracket==='baby' ? 15 : 13;
  const headCy = bracket==='baby' ? 30 : 25;
  const head = bracket==='baby' ? `<circle cx="32" cy="${headCy}" r="${headR}" fill="var(--ink-line)"/>` : jawShapeP29(band, 32, headCy, headR);
  let hair = '', accessory = '', marks = '', outfit = '', face = '';
  if(bracket!=='baby'){
    const styles = g==='Female' ? FEMALE_HAIR : g==='Male' ? MALE_HAIR : NEUTRAL_HAIR;
    hair = styles[seed % styles.length](headCy);
    const accPool = accessoryPoolFor(bracket, g);
    accessory = accPool[Math.floor(seed/7) % accPool.length](headCy);
    marks = MARK_POOL[Math.floor(seed/17) % MARK_POOL.length](headCy);
    outfit = OUTFIT_POOL[Math.floor(seed/41) % OUTFIT_POOL.length](headCy, OUTFIT_COLORS_P31[Math.floor(seed/53) % OUTFIT_COLORS_P31.length]);
    face = eyesP29(band, headCy) + browsP29(band, headCy) + noseP29(band, headCy) + mouthP29(band, headCy) + faceExtrasP29(band, 32, headCy, headR);
    if(bracket==='elder') face += wrinklesP29(headCy);
  }
  return `<svg viewBox="0 0 64 64" width="100%" height="100%">${body}${outfit}${hair}${head}${accessory}${face}${marks}</svg>`;
}

/* Generic "scene" engine used by many storylines (debate, chemo, therapy, sponsor talks...) */
function playScene(scene){
  // scene: {title, text, choices:[{label, run(){...}}]}
  const choicesHtml = scene.choices.map((c,i)=>`<button class="btn btn-block" data-i="${i}">${c.label}</button>`).join('');

      closeModal();
      if(c.run) c.run();
      render();
    };
  });
}

  }

/* ============================ AGE UP CORE =================================== */
function ageUp(){
  if(!state.alive) return;
  state.age++;

  // education year progression
  if(state.eduStage!=='none' && state.eduStage!=='grad-done'){
    state.eduYear++;
    state.gpa = clamp(state.gpa + (chance(50)?0.1:-0.1)*(state.stats.smarts>50?1:-1), 0, 4);
  }

  // job pay + tenure
  if(state.job){
    state.money += state.job.salary;
    state.job.years++;
  }

  // relationship aging
  state.relationships.forEach(r=>{ if(r.alive) r.age++; });

  // random generic event
  if(chance(55)){
    const pool = ageBracketEvents();
    const e = pick(pool);
    e.fx(state);
    log(e.text, e.type);
  }

  // natural stat drift
  state.stats.happiness = clamp(state.stats.happiness + rand(-2,2), 0, 100);
  if(state.age>50) state.stats.health = clamp(state.stats.health - rand(0,2), 0, 100);
  clampAllStats();

  // prison ticking
  if(state.inPrison){ tickPrison(); }

  // sports ticking
  if(state.sportsCareer){ tickSports(); }

  // crypto market ticks every year
  tickCryptoPrices();

  // death checks
  checkDeath();

  if(state.alive){
    checkAchievementsPassive();
  }
  render();
}

function clampAllStats(){
  for(const k in state.stats) state.stats[k] = clamp(state.stats[k],0,100);
}

/* ============================ DEATH CHECK (base) ============================ */
function checkDeath(){
  if(!state.alive) return;
  if(state.stats.health<=0){ die('poor health'); return; }
  let deathChance = 0;
  if(state.age>70) deathChance = (state.age-70)*1.2;
  if(state.age>90) deathChance += 15;
  if(chance(deathChance)){ die('old age'); return; }
  if(chance(0.3)){ die('a sudden accident'); return; }
}

function die(cause){
  state.alive = false;
  state.lastCause = cause;
  log(`You died of ${cause} at age ${state.age}.`,'bad');
  newspaper(`LOCAL RESIDENT ${state.name.toUpperCase()} DIES AT ${state.age}`, `Cause: ${cause}. Survived by family and friends.`);
}

function interactWith(id){
  const r = state.relationships.find(x=>x.id===id);
  if(!r) return;
  const opts = [
    {label:'Spend Time Together', run:()=>{ r.rel=clamp(r.rel+rand(3,10),0,100); state.stats.happiness=clamp(state.stats.happiness+3,0,100); log(`You spent quality time with ${r.name}. Relationship improved.`,'good'); }},
    {label:'Give a Gift', run:()=>{ if(state.money>=100){ state.money-=100; r.rel=clamp(r.rel+8,0,100); log(`You gave ${r.name} a gift.`,'good'); } else { log(`Not enough money for a gift.`,'bad'); } }},
    {label:'Compliment Them', run:()=>{ r.rel=clamp(r.rel+rand(1,6),0,100); log(`You complimented ${r.name}.`,'good'); }},
    {label:'Insult Them', run:()=>{ r.rel=clamp(r.rel-rand(5,15),0,100); state.stats.karma=clamp(state.stats.karma-3,0,100); log(`You insulted ${r.name}. Relationship damaged.`,'bad'); }},
  ];

function tickSports(){
  const sc = state.sportsCareer;
  if(!sc) return;
  const ageGates = [6,14,16,18,19,21,22]; // youth,jv,varsity,scholarship,collegestar,draft,pro
  const nextStage = sc.stage+1;
  if(nextStage < SPORTS_STAGES.length && state.age>=ageGates[nextStage] && sc.skill>=(30+nextStage*8)){
    if(chance(clamp(30+sc.skill*0.5,10,90))){
      sc.stage = nextStage;
      log(`Your ${sc.sport} career advanced to: ${SPORTS_STAGES[sc.stage]}!`,'good');
      if(sc.stage===6){
        const salary = rand(80000,900000);
        state.job = {title:`Pro ${sc.sport} Athlete`, salary, tier:5, years:0};
        checkAchievement('pro_athlete');
      }
    }
  }
  if(sc.stage<6 && chance(15)){
    sc.skill = clamp(sc.skill-rand(1,6),0,100);
  }
}

/* ============================ CRIME & PRISON =============================== */
const CRIMES = [
  {name:'Shoplifting', risk:20, reward:[50,300], sentence:1},
  {name:'Pickpocketing', risk:25, reward:[30,400], sentence:1},
  {name:'Grand Theft Auto', risk:45, reward:[1000,8000], sentence:3},
  {name:'Armed Robbery', risk:55, reward:[2000,15000], sentence:5},
  {name:'Fraud', risk:35, reward:[1000,20000], sentence:4},
  {name:'Murder', risk:65, reward:[0,0], sentence:20},
];
function commitCrime(name){
  const c = CRIMES.find(x=>x.name===name);
  const caught = chance(clamp(c.risk - (state.stats.smarts-50)*0.2,5,95));
  if(name==='Murder') state.murders++;
  if(caught){
    state.criminalRecord.push(c.name);
    state.inPrison = true;
    state.prisonYearsLeft = c.sentence;
    log(`You were caught committing ${c.name}! Sentenced to ${c.sentence} years in prison.`,'bad');
    newspaper(`${state.name.toUpperCase()} ARRESTED`, `Local resident charged with ${c.name.toLowerCase()}.`);
  } else {
    const gain = rand(c.reward[0], c.reward[1]);
    state.money += gain;
    state.stats.karma = clamp(state.stats.karma - 10, 0, 100);
    log(`You committed ${c.name} and got away with ${fmtMoney(gain)}.`,'neutral');
  }
  closePanel(); render();
}
function tickPrison(){
  state.prisonYearsLeft--;
  state.stats.happiness = clamp(state.stats.happiness-5,0,100);
  if(state.prisonYearsLeft<=0){
    state.inPrison=false;
    log(`You were released from prison.`,'neutral');
  }
}
function prisonActivity(kind){
  if(kind==='workout'){ state.stats.health=clamp(state.stats.health+5,0,100); state.prisonRep+=2; log(`You worked out in the yard.`,'neutral'); }
  if(kind==='socialize'){ state.stats.happiness=clamp(state.stats.happiness+4,0,100); state.prisonRep+=3; log(`You socialized with other inmates.`,'neutral'); }
  if(kind==='escape'){
    state.escapePlan += rand(10,30);
    if(state.escapePlan>=100){
      if(chance(40)){ state.inPrison=false; state.prisonYearsLeft=0; state.escapePlan=0; state.flags.everEscaped=true; log(`You successfully escaped prison!`,'good'); checkAchievement('escaped'); }
      else { state.prisonYearsLeft+=5; state.escapePlan=0; log(`Your escape attempt failed. 5 years added to your sentence.`,'bad'); }
    } else {
      log(`You worked on your escape plan (${state.escapePlan}% ready).`,'neutral');
    }
  }
  if(kind==='parole'){
    if(chance(clamp(state.prisonRep,5,80))){
      state.inPrison=false; state.prisonYearsLeft=0;
      log(`Parole granted! You're free.`,'good');
    } else {
      log(`Parole denied.`,'bad');
    }
  }
  closePanel(); render();
}

/* ============================ CRYPTO ======================================== */
const CRYPTO_PRICES = {btc:40000, eth:2500, lifecoin:1, memetoken:0.01};
function tickCryptoPrices(){
  for(const k in CRYPTO_PRICES){
    const vol = k==='memetoken'?0.6:(k==='lifecoin'?0.3:0.15);
    CRYPTO_PRICES[k] = Math.max(0.001, CRYPTO_PRICES[k]*(1+(Math.random()*2-1)*vol));
  }
}
function openCryptoPanel(){
  let html = '';
  for(const k in CRYPTO_PRICES){
    html += `<div class="list-item"><div class="li-main"><b>${k.toUpperCase()}</b><span>Price: ${fmtMoney(CRYPTO_PRICES[k])} · Holding: ${state.crypto[k].toFixed(4)}</span></div>
      <div class="row"><button class="btn" onclick='buyCrypto(${JSON.stringify(k)})'>Buy $500</button><button class="btn" onclick='sellCrypto(${JSON.stringify(k)})'>Sell All</button></div></div>`;
  }
  openPanel('Crypto Exchange', html);
}
function buyCrypto(k){
  const amt = 500;
  if(state.money<amt){ log(`Not enough cash to buy ${k.toUpperCase()}.`,'bad'); closePanel(); render(); return; }
  state.money -= amt;
  state.crypto[k] += amt/CRYPTO_PRICES[k];
  log(`You bought ${fmtMoney(amt)} of ${k.toUpperCase()}.`,'neutral');
  openCryptoPanel();
}
function sellCrypto(k){
  const value = state.crypto[k]*CRYPTO_PRICES[k];
  state.money += value; state.crypto[k]=0;
  log(`You sold all your ${k.toUpperCase()} for ${fmtMoney(value)}.`,'neutral');
  openCryptoPanel();
}

/* ============================ GANG / DRUG EMPIRE ============================= */
const DRUG_TIERS = ["Street Dealer","Corner Boss","Block Captain","District Supplier","Regional Kingpin","Cartel Boss"];
function drugAction(action){
  const de = state.drugEmpire;
  if(action==='deal'){
    const gain = rand(200,1500) * (de.tier+1);
    if(chance(clamp(20+de.heat*0.5,10,80))){
      state.inPrison=true; state.prisonYearsLeft = 2+de.tier; de.heat=0;
      log(`Police busted your operation! You're headed to prison.`,'bad');
    } else {
      state.money += gain; de.heat = clamp(de.heat+8,0,100); state.stats.karma=clamp(state.stats.karma-5,0,100);
      log(`You made ${fmtMoney(gain)} dealing on the streets.`,'neutral');
    }
  }
  if(action==='expand' && de.tier<5){
    const cost = 5000*(de.tier+1);
    if(state.money>=cost){ state.money-=cost; de.tier++; de.name=DRUG_TIERS[de.tier]; log(`Your operation expanded. You're now a ${DRUG_TIERS[de.tier]}.`,'good'); checkAchievement('drug_lord'); }
    else log(`Not enough money to expand your operation.`,'bad');
  }
  if(action==='laylow'){ de.heat = clamp(de.heat-30,0,100); log(`You laid low for a while. Heat reduced.`,'neutral'); }
  closePanel(); render();
}

/* ============================ INFLUENCER ====================================== */
const INFLUENCER_TIERS = ["Nobody","Micro-Influencer","Rising Star","Verified Influencer","Celebrity","Global Icon"];
function influencerAction(action){
  const inf = state.influencer;
  if(!inf.platform) inf.platform = pick(['InstaFame','TikTome','YouStar']);
  if(action==='post'){
    const gain = rand(0,500)*(inf.tier+1);
    inf.followers += rand(50,5000)*(inf.tier+1);
    state.money += gain;
    log(`Your ${inf.platform} post blew up! +${inf.followers>0?rand(50,5000):0} followers, +${fmtMoney(gain)}.`,'good');
  }
  if(action==='brand-deal' && inf.tier>=1){
    const gain = rand(1000,20000)*inf.tier;
    state.money += gain; log(`You landed a brand deal worth ${fmtMoney(gain)}.`,'good');
  }
  if(inf.followers > (inf.tier+1)*20000 && inf.tier<5){
    inf.tier++; log(`You leveled up to ${INFLUENCER_TIERS[inf.tier]}!`,'good'); checkAchievement('influencer');
  }
  closePanel(); render();
}

function netWorth(){

  state.assets.houses.forEach(h=>nw+=h.value);
  for(const k in state.crypto) nw += state.crypto[k]*CRYPTO_PRICES[k];
  return nw;
}

  if(state.stats.health>=100) checkAchievement('gym_rat');

  if(state.assets.cars.length>=5) checkAchievement('car_collector');
  if(state.pets.length>=5) checkAchievement('pet_lover');
  if(state.kids.length>=5) checkAchievement('family_person');
  for(const k in state.crypto){ if(state.crypto[k]*CRYPTO_PRICES[k] >= 100000){ checkAchievement('crypto_whale'); break; } }
  if(state.faithLevel>=100) checkAchievement('faithful');

/* ============================ LEGACY SCORE (base, extended in Phase 16) ======== */
function calcLegacyScore(){
  let score = 0;
  const livingFamily = state.relationships.filter(r=>r.alive && r.rel>=50).length;
  score += clamp(livingFamily*4, 0, 20);
  score += clamp((state.job?state.job.tier:0)*4, 0, 20);
  score += clamp(state.stats.karma*0.2, 0, 20);
  score += clamp(state.achievements.size*0.6, 0, 15);
  score += clamp(state.kids.length*3, 0, 10);
  score += clamp(Math.log10(Math.max(1,netWorth()))*1.5, 0, 15);
  return clamp(Math.round(score),0,100);
}
function legacyGrade(score){
  if(score>=90) return {grade:'S', title:'Legendary Life'};
  if(score>=75) return {grade:'A', title:'Remarkable Life'};
  if(score>=60) return {grade:'B', title:'Well-Lived Life'};
  if(score>=40) return {grade:'C', title:'Ordinary Life'};
  if(score>=20) return {grade:'D', title:'Troubled Life'};
  return {grade:'F', title:'Wasted Potential'};
}

   AI FAMILY CONVERSATIONS VIA THE CLAUDE API
   API key + model are stored in this browser's localStorage only, never
   in game state (so they aren't part of any save/export of a life).
   --------------------------------------------------------------------- */
function getApiKeyP15(){ return localStorage.getItem('lifeplay_api_key')||''; }
function setApiKeyP15(k){ localStorage.setItem('lifeplay_api_key', k); }
function getApiModelP15(){ return localStorage.getItem('lifeplay_api_model')||'claude-sonnet-4-5-20250929'; }
function setApiModelP15(m){ localStorage.setItem('lifeplay_api_model', m); }

function escapeHtmlP15(str){
  return String(str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
/* Parses an Anthropic API error response body into a clear, specific message.
   Kept separate from the network-failure path (TypeError from fetch itself,
   almost always CORS/offline/DNS) so users can tell "bad key" from "can't connect". */
async function parseApiErrorP15(res){
  let bodyText = '';
  try{ bodyText = await res.text(); }catch(e){ /* ignore */ }
  let msg = null;
  try{ const j = JSON.parse(bodyText); msg = j && j.error && j.error.message; }catch(e){ /* not JSON */ }
  if(res.status===401) return 'Invalid API key (401). Double-check the key in AI Chat Settings.';
  if(res.status===403) return 'Access denied (403). ' + (msg || 'This key may not have permission for direct browser access.');
  if(res.status===404) return `Model not found (404). "${getApiModelP15()}" may be misspelled or unavailable to your account — try a different model in AI Chat Settings.`;
  if(res.status===429) return 'Rate limited (429). You are sending messages too quickly, or are out of quota — wait a moment and try again.';
  if(res.status>=500) return `Anthropic's servers had an issue (${res.status}). Try again shortly.`;
  return `HTTP ${res.status}${msg ? ': '+msg : (bodyText ? ': '+bodyText.slice(0,150) : '')}`;
}
async function callClaudeApiP15(messages, systemPrompt, maxTokens){
  const apiKey = getApiKeyP15();
  const model = getApiModelP15();
  if(!apiKey) throw new Error('No API key set.');
  let res;
  try{
    res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'content-type':'application/json',
        'x-api-key': apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true',
      },
      body: JSON.stringify({ model, max_tokens:maxTokens||200, system:systemPrompt, messages })
    });
  } catch(networkErr){
    throw new Error('Could not reach api.anthropic.com. This is usually a network problem, an ad/privacy blocker, or the browser blocking the cross-origin request — not necessarily a bad key.');
  }
  if(!res.ok) throw new Error(await parseApiErrorP15(res));
  const data = await res.json();
  const block = (data.content||[]).find(b=>b.type==='text');
  return block ? block.text : '[The model returned an empty response.]';
}

function tickPetsP15(){

    if(!p.alive) return;

    p.happiness = clamp(p.happiness - rand(2,6), 0, 100);
    p.health = clamp((p.health==null?100:p.health) - rand(1,5), 0, 100);
    const lifespan = PET_LIFESPANS_P15[p.type] || 12;
    if(p.age>=15) checkAchievement('animal_whisperer');

    if(deathChance>0 && chance(deathChance)){

      log(`💔 ${p.name} passed away. You'll miss your old friend.`,'bad');
      state.stats.happiness = clamp(state.stats.happiness-10,0,100);
    }
  });
}

const COUPLES_COUNSELING_TOPICS_P15 = ['Communication Breakdown','Trust Issues','Financial Stress','Growing Apart','Intimacy'];
function coupleCounselingP15(){
  const spouse = state.relationships.find(r=>r.id===state.spouseId);
  if(!spouse) return;
  const cost = 200;
  if(state.money<cost){ log(`Not enough money for couples counseling.`,'bad'); closePanel(); render(); return; }
  state.money -= cost;
  const topic = pick(COUPLES_COUNSELING_TOPICS_P15);
  closePanel();
  playScene({title:`Couples Counseling: ${topic}`, text:`You and ${spouse.name} sit down with a marriage counselor to work through ${topic.toLowerCase()}.`, choices:[
    {label:'Both commit to real change', run:()=>{ spouse.rel=clamp(spouse.rel+15,0,100); state.stats.happiness=clamp(state.stats.happiness+6,0,100); log(`The session helped. You and ${spouse.name} feel closer.`,'good'); }},
    {label:'Listen, but stay guarded', run:()=>{ spouse.rel=clamp(spouse.rel+4,0,100); log(`It was a start, but there's still distance between you and ${spouse.name}.`,'neutral'); }},
    {label:'Argue through the whole session', run:()=>{ spouse.rel=clamp(spouse.rel-10,0,100); state.stats.happiness=clamp(state.stats.happiness-4,0,100); log(`The session devolved into an argument. Nothing was resolved.`,'bad'); }},
  ]});
}

/* --- New mechanic: Travel (also powers the pre-existing "wanderer" secret ending) --- */
function travelToCityP17(city){
  const cost = 250;
  if(state.money<cost){ log(`Not enough money to travel to ${city}.`,'bad'); openWorldPanel(); return; }
  state.money -= cost;
  if(!state.flags.citiesVisited) state.flags.citiesVisited = [];
  if(!state.flags.citiesVisited.includes(city)){
    state.flags.citiesVisited.push(city);
    checkAchievement('globe_trotter');

/* =========================================================================
   BRANCHING CHOICE EVENTS — pop-up scenarios with real choices and
   consequences, distinct from the passive flavor-event pools above (which
   just apply an effect automatically). These use the existing playScene()
   modal + scene queue, so they never collide with other pop-ups.

   TO ADD A NEW EVENT: push an object onto the right bracket array in
   CHOICE_EVENTS ('child' <13, 'teen' 13-17, 'adult' 18-64, 'elder' 65+):
     {
       title: 'Short scene title',
       text: 'Setup text describing the situation.',
       choices: [
         { label:'What the player picks', type:'good'|'bad'|'neutral',
           fx: s=>{ ...mutate s.stats / s.money / relationships... },
           result: 'Shown in the log after picking' // or a function(s)=>string
                                                       // for chance-based outcomes
         },
         ... 2-4 choices ...
       ]
     }
   Optional: cond: s=>boolean — gates the event out of the pool entirely
   unless true (e.g. only show it if s.mafia exists). Omit for an event
   anyone in that life stage can hit.
   That's the whole contract. No other wiring is needed — rollChoiceEvent()
   already picks a random one from the current life stage and displays it.
   ========================================================================= */
const CHOICE_EVENTS = { child:[], teen:[], adult:[], elder:[] };

function choiceBracketKey(){
  if(state.age<13) return 'child';
  if(state.age<18) return 'teen';
  if(state.age<65) return 'adult';
  return 'elder';
}
function rollChoiceEvent(){
  const pool = CHOICE_EVENTS[choiceBracketKey()].filter(ev=>!ev.cond || ev.cond(state));
  if(!pool || !pool.length) return false;
  const ev = pick(pool);
  playScene({
    title: ev.title, text: ev.text,
    choices: ev.choices.map(c=>({label:c.label, run:()=>{
      c.fx(state); clampAllStats();
      const resultText = typeof c.result==='function' ? c.result(state) : c.result;
      log(resultText, c.type||'neutral');
    }}))
  });
  return true;
}

/* ---------------------------------------------------------------------

   in-laws on marriage. Real relationships in state.relationships, not

const _origRelLabel_P23 = relLabel;
relLabel = function(type){
  const extra = {grandparent:'Grandparent', aunt_uncle:'Aunt/Uncle', cousin:'Cousin', in_law:'In-Law'};
  return extra[type] || _origRelLabel_P23(type);
};

function addAuntsUnclesAndCousinsP23(parent, surname){
  if(!parent) return;
  const count = rand(0,2);
  for(let i=0;i<count;i++){
    const gender = pick(['Male','Female']);
    const au = newRelationship('aunt_uncle', {gender, age:clamp(parent.age+rand(-8,8),18,90), rel:rand(40,85), last:surname});
    au.name = randomFirstName(gender)+' '+surname;
    state.relationships.push(au);
    if(chance(55)){
      const cousinCount = rand(1,2);
      for(let j=0;j<cousinCount;j++){
        const cg = pick(['Male','Female']);
        const cousin = newRelationship('cousin', {gender:cg, age:rand(0,16), rel:rand(40,80), last:surname});
        cousin.name = randomFirstName(cg)+' '+surname;
        state.relationships.push(cousin);
      }
    }
  }
}
function generateExtendedFamilyP23(){
  const dad = state.relationships.find(r=>r.type==='parent' && r.gender==='Male');
  const mom = state.relationships.find(r=>r.type==='parent' && r.gender==='Female');
  const maternalSurname = pick(LAST_NAMES);
  if(dad && chance(65)){ const g=newRelationship('grandparent',{gender:'Male', age:dad.age+rand(24,34), rel:rand(50,90), last:state.last}); g.name=randomFirstName('Male')+' '+state.last; state.relationships.push(g); }
  if(dad && chance(65)){ const g=newRelationship('grandparent',{gender:'Female', age:dad.age+rand(22,32), rel:rand(50,90), last:state.last}); g.name=randomFirstName('Female')+' '+state.last; state.relationships.push(g); }
  if(mom && chance(65)){ const g=newRelationship('grandparent',{gender:'Male', age:mom.age+rand(24,34), rel:rand(50,90), last:maternalSurname}); g.name=randomFirstName('Male')+' '+maternalSurname; state.relationships.push(g); }
  if(mom && chance(65)){ const g=newRelationship('grandparent',{gender:'Female', age:mom.age+rand(22,32), rel:rand(50,90), last:maternalSurname}); g.name=randomFirstName('Female')+' '+maternalSurname; state.relationships.push(g); }
  addAuntsUnclesAndCousinsP23(dad, state.last);
  addAuntsUnclesAndCousinsP23(mom, maternalSurname);
}
const _origStartNewLife_P23 = startNewLife;
startNewLife = function(){
  _origStartNewLife_P23();
  if(state) generateExtendedFamilyP23();
};

const _origProposeMarriage_P23 = proposeMarriage;
proposeMarriage = function(id){
  const wasSpouseId = state.spouseId;
  _origProposeMarriage_P23(id);
  if(state.spouseId && state.spouseId!==wasSpouseId){
    const spouse = state.relationships.find(r=>r.id===state.spouseId);
    const inLawSurname = spouse.name.split(' ').slice(-1)[0];
    if(chance(60)){ const il=newRelationship('in_law',{gender:'Male', age:spouse.age+rand(20,32), rel:rand(40,75), last:inLawSurname}); il.name=randomFirstName('Male')+' '+inLawSurname; state.relationships.push(il); }
    if(chance(60)){ const il=newRelationship('in_law',{gender:'Female', age:spouse.age+rand(18,30), rel:rand(40,75), last:inLawSurname}); il.name=randomFirstName('Female')+' '+inLawSurname; state.relationships.push(il); }

};

/* ---------------------------------------------------------------------
   PEOPLE PANEL — grouped into Immediate Family / Extended Family /
   Friends, each entry with a portrait thumbnail, like a society-page
   photo directory. Folds in everything the earlier append-only layers
   added (rival/mentor, couples counseling, AI chat) since a flat
   append can't reorganize content that renders before it — the same
   limitation that required full reimplementations of renderLog().
   --------------------------------------------------------------------- */
function groupedRelationshipsP23(){
  const living = state.relationships.filter(r=>r.alive);
  const immediateTypes = ['parent','sibling','spouse','child','datingpartner','exspouse'];
  const extendedTypes = ['grandparent','aunt_uncle','cousin','in_law','niece_nephew','godparent','grandchild'];
  return {
    immediate: living.filter(r=>immediateTypes.includes(r.type)),
    extended: living.filter(r=>extendedTypes.includes(r.type)),
    friends: living.filter(r=>r.type==='friend'),
  };
}
function personListItemP23(r){
  const isBest = state.bestFriendId===r.id;
  const badge = isBest ? ` <span class="best-friend-badge" title="Best Friend">★</span>` : '';
  return `<div class="list-item"><div class="li-portrait">${personAvatarSVG(r)}</div><div class="li-main"><b>${r.name}${badge}</b><span>${relLabel(r.type)} · Age ${r.age} · Rel ${Math.round(r.rel)}%</span></div>
    <button class="btn" onclick='interactWith(${JSON.stringify(r.id)})'>Interact</button></div>`;
}
const _origOpenRelationshipsPanel_P23 = openRelationshipsPanel;
openRelationshipsPanel = function(){
  const groups = groupedRelationshipsP23();
  let html = '';
  if(!groups.immediate.length && !groups.extended.length && !groups.friends.length){
    html += `<p style="color:var(--sub)">No relationships yet.</p>`;
  }
  if(groups.immediate.length){ html += `<b>Immediate Family</b>`; groups.immediate.forEach(r=>{ html+=personListItemP23(r); }); }
  if(groups.extended.length){ html += `<hr style="border-color:var(--border)"><b>Extended Family</b>`; groups.extended.forEach(r=>{ html+=personListItemP23(r); }); }
  if(groups.friends.length){ html += `<hr style="border-color:var(--border)"><b>Friends</b>`; groups.friends.forEach(r=>{ html+=personListItemP23(r); }); }
  html += `<hr style="border-color:var(--border)">`;
  if(groups.immediate.length || groups.extended.length) html += `<button class="btn btn-block btn-accent" onclick="openFamilyTreeP25()">🌳 View Family Tree</button>`;
  html += `<button class="btn btn-block" onclick="makeNewFriendP23()">Make a New Friend</button>`;
  if(state.age>=16 && !state.spouseId) html += `<button class="btn btn-block btn-accent" onclick="findDate()">Find a Date</button>`;
  const datingPartner = state.relationships.find(r=>r.alive && r.type==='datingpartner');
  if(datingPartner){
    html += `<button class="btn btn-block btn-primary" onclick='proposeMarriage(${JSON.stringify(datingPartner.id)})'>Propose Marriage</button>`;
    html += `<button class="btn btn-block btn-danger" onclick='breakUp(${JSON.stringify(datingPartner.id)})'>Break Up</button>`;
  }
  if(state.spouseId){
    html += `<button class="btn btn-block" onclick="goOnDateNight()">Date Night</button>`;
    html += `<button class="btn btn-block btn-accent" onclick="coupleCounselingP15()">💑 Couples Counseling ($200)</button>`;
    html += `<button class="btn btn-block btn-danger" onclick="fileDivorce()">File for Divorce</button>`;
    if(state.age>=18) html += `<button class="btn btn-block" onclick="tryForBaby()">Try for a Baby</button>`;
  }
  html += `<button class="btn btn-block" onclick="openTherapyPanel()">Book Therapy Session</button>`;
  html += `<hr style="border-color:var(--border)">`;
  html += `<button class="btn btn-block${state.rival?' btn-danger':''}" onclick="openRivalPanelP15()">${state.rival?('😠 Rival: '+state.rival.name):'😠 Rival'}</button>`;
  html += `<button class="btn btn-block${(state.mentor&&state.mentor.alive)?' btn-accent':''}" onclick="openMentorPanelP15()">${(state.mentor&&state.mentor.alive)?('🌟 Mentor: '+state.mentor.name):'🌟 Mentor'}</button>`;
  const allLiving = groups.immediate.concat(groups.extended, groups.friends);
  if(allLiving.length){
    html += `<hr style="border-color:var(--border)"><b>💬 AI Conversations</b>`;
    allLiving.forEach(r=>{ html += `<button class="btn btn-block" onclick='openFamilyChatP15(${JSON.stringify(r.id)})'>Chat with ${r.name}</button>`; });
  }
  html += `<button class="btn btn-block btn-accent" onclick="openApiSettingsPanelP15()">🔑 AI Chat Settings</button>`;
  openPanel('People', html);
};

function refreshBestFriendP24(){
  const candidates = state.relationships.filter(r=>r.alive && r.type==='friend' && r.rel>=85);
  if(!candidates.length){ return; }
  candidates.sort((a,b)=>b.rel-a.rel);
  const top = candidates[0];
  if(state.bestFriendId!==top.id){
    state.bestFriendId = top.id;
    log(`${top.name} is now your best friend.`,'good');
    checkAchievement('best_friend_ach');
  }
}

/* ---------------------------------------------------------------------
   P25 — Family Tree view: a genealogical-record-style panel laid out
   by generation, using the same portrait art as the People list.
   --------------------------------------------------------------------- */
function familyTreeNodeP25(person, isYou){
  const rel = isYou ? '' : `<div class="ft-rel">${Math.round(person.rel)}%</div>`;
  return `<div class="ft-node${isYou?' ft-you':''}"><div class="ft-portrait">${personAvatarSVG(person)}</div><div class="ft-name">${person.name}</div>${rel}</div>`;
}
function openFamilyTreeP25(){
  const rel = state.relationships.filter(r=>r.alive);
  const grandparents = rel.filter(r=>r.type==='grandparent');
  const parentsGen = rel.filter(r=>r.type==='parent' || r.type==='aunt_uncle' || r.type==='godparent');
  const selfGenOthers = rel.filter(r=>['spouse','sibling','cousin','in_law','datingpartner'].includes(r.type));
  const childGen = rel.filter(r=>r.type==='child' || r.type==='niece_nephew');
  const grandchildGen = rel.filter(r=>r.type==='grandchild');
  let html = `<div class="family-tree">`;
  if(grandparents.length){
    html += `<div class="ft-gen"><div class="ft-gen-label">The Elders</div><div class="ft-row">${grandparents.map(p=>familyTreeNodeP25(p)).join('')}</div></div>`;
  }
  if(parentsGen.length){
    html += `<div class="ft-gen"><div class="ft-gen-label">Parents &amp; Family</div><div class="ft-row">${parentsGen.map(p=>familyTreeNodeP25(p)).join('')}</div></div>`;
  }
  html += `<div class="ft-gen"><div class="ft-gen-label">Your Generation</div><div class="ft-row">${familyTreeNodeP25({name:state.name, age:state.age, gender:state.gender, alive:state.alive, looks:state.stats.looks}, true)}${selfGenOthers.map(p=>familyTreeNodeP25(p)).join('')}</div></div>`;
  if(childGen.length){
    html += `<div class="ft-gen"><div class="ft-gen-label">The Next Generation</div><div class="ft-row">${childGen.map(p=>familyTreeNodeP25(p)).join('')}</div></div>`;
  }
  if(grandchildGen.length){
    html += `<div class="ft-gen"><div class="ft-gen-label">The Grandchildren</div><div class="ft-row">${grandchildGen.map(p=>familyTreeNodeP25(p)).join('')}</div></div>`;
  }
  html += `</div><button class="btn btn-block" onclick="openRelationshipsPanel()" style="margin-top:12px;">← Back to People</button>`;
  openPanel('Family Tree', html);
}

   siblings') is rerolled from your parents' looks values right after
   birth, instead of being pure luck-of-the-draw independent of them.
   Kids you have later inherit from you and your spouse the same way.
   --------------------------------------------------------------------- */
function inheritedLooksP28(a, b){
  return clamp(Math.round((a+b)/2 + rand(-15,15)), 8, 96);
}
const _origStartNewLife_P28 = startNewLife;
startNewLife = function(){
  _origStartNewLife_P28();
  if(!state) return;
  const dad = state.relationships.find(r=>r.type==='parent' && r.gender==='Male');
  const mom = state.relationships.find(r=>r.type==='parent' && r.gender==='Female');
  if(dad && mom){
    state.stats.looks = inheritedLooksP28(dad.looks, mom.looks);
    state.relationships.filter(r=>r.type==='sibling').forEach(sib=>{
      sib.looks = inheritedLooksP28(dad.looks, mom.looks);
    });
  }
};
const _origTryForBaby_P28 = tryForBaby;
tryForBaby = function(){
  const before = state.kids.length;
  _origTryForBaby_P28();
  if(state.kids.length>before){
    const kid = state.relationships.find(r=>r.id===state.kids[state.kids.length-1]);
    const spouse = state.relationships.find(r=>r.id===state.spouseId);
    if(kid) kid.looks = inheritedLooksP28(state.stats.looks, spouse ? spouse.looks : rand(15,90));
  }
};

/* ---------------------------------------------------------------------
   P33 — Mafia career: a proper rank ladder (Associate to Don) layered
   on top of the normal job system, distinct from the street-gang
   mechanic. Heat builds from every job and comes back around as arrest
   or rival-family risk each year; walking away is its own gamble.
   --------------------------------------------------------------------- */
const MAFIA_RANKS_P33 = ['Associate','Soldier','Capo','Underboss','Consigliere','Don'];
const MAFIA_SALARY_P33 = [12000, 30000, 65000, 110000, 160000, 260000];
const MAFIA_FAMILIES_P33 = ['The Moretti Family','The Costa Family','The Falcone Family','The Vitale Family','The Russo Family','The Amato Family'];
Object.assign(ACHIEVEMENTS, {
  made_man_ach:'Became a made man in the Mafia',
  mafia_don_ach:'Rose to Don of a crime family',
});
SECRET_ENDINGS.push({id:'godfather', title:'The Godfather', cond:s=>!!(s.flags && s.flags.becameDon)});

function mafiaJobTitleP33(rank){ return 'Mafia '+MAFIA_RANKS_P33[rank]; }

function joinMafiaP33(){
  if(state.mafia || state.inPrison || state.job) return;
  state.mafia = {rank:0, loyalty:0, heat:0, family: pick(MAFIA_FAMILIES_P33)};
  state.job = {title:mafiaJobTitleP33(0), salary:MAFIA_SALARY_P33[0], tier:5, years:0, isMafia:true};
  log(`You were brought into ${state.mafia.family} as an Associate. There's no easy way out now.`,'bad');
  closePanel(); render();
}

function mafiaPromoteCheckP33(){
  const m = state.mafia; if(!m) return;
  const threshold = (m.rank+1)*22;
  if(m.rank < MAFIA_RANKS_P33.length-1 && m.loyalty >= threshold){
    m.rank++;
    m.loyalty = 0;
    state.job.title = mafiaJobTitleP33(m.rank);
    state.job.salary = MAFIA_SALARY_P33[m.rank];
    log(`You were promoted to ${MAFIA_RANKS_P33[m.rank]} in ${m.family}.`,'good');
    newspaper(`UNDERWORLD SHAKEUP: NEW ${MAFIA_RANKS_P33[m.rank].toUpperCase()} NAMED`, `Sources whisper that a rising figure has been elevated within ${m.family}.`, 'Underworld Desk');
    if(m.rank===1) checkAchievement('made_man_ach');
    if(m.rank===MAFIA_RANKS_P33.length-1){ checkAchievement('mafia_don_ach'); state.flags.becameDon = true; }
  }
}

function mafiaActivity(type){
  const m = state.mafia; if(!m) return;
  if(type==='numbers'){
    const amt = rand(500,2000);
    state.money += amt; m.heat = clamp(m.heat+rand(1,3),0,100); m.loyalty += rand(2,4);
    log(`You ran numbers for the family, pulling in ${fmtMoney(amt)}.`,'good');
  } else if(type==='extortion'){
    const amt = rand(1200,4500);
    state.money += amt; m.heat = clamp(m.heat+rand(3,7),0,100); m.loyalty += rand(3,6);
    state.stats.karma = clamp(state.stats.karma-rand(2,5),0,100);
    log(`You collected protection money from local businesses. ${fmtMoney(amt)} richer, one shopkeeper poorer.`,'good');
  } else if(type==='hit'){
    if(m.rank<1){ log(`You're not trusted with that kind of work yet.`,'bad'); closePanel(); render(); return; }
    if(chance(70)){
      const amt = rand(6000,16000);
      state.money += amt; m.loyalty += rand(6,10); m.heat = clamp(m.heat+rand(6,12),0,100);
      state.stats.karma = clamp(state.stats.karma-12,0,100);
      state.murders = (state.murders||0)+1;
      log(`The job was done clean. ${fmtMoney(amt)} landed in your pocket, and the family took notice.`,'bad');
    } else if(chance(50)){
      m.heat = 100;
      state.inPrison = true; state.prisonYearsLeft = rand(10,25); state.prisonRep = 0;
      log(`The job went sideways. You were pinched at the scene — ${state.prisonYearsLeft} years.`,'bad');
      newspaper(`MOB HIT GONE WRONG: SUSPECT ARRESTED`, `Police say the botched job has ties to ${m.family}.`, 'Underworld Desk');
    } else {
      die("a rival family's retaliation");
    }
  } else if(type==='laylow'){
    m.heat = clamp(m.heat-rand(12,22),0,100);
    log(`You kept a low profile for a while.`,'neutral');
  }
  mafiaPromoteCheckP33();
  closePanel(); render();
}

function leaveMafiaP33(){
  const m = state.mafia; if(!m) return;
  if(chance(65)){
    log(`You managed to walk away from ${m.family} clean. Not everyone gets that chance.`,'good');
    state.mafia = null;
    if(state.job){ state.jobHistory.push(state.job); state.job = null; }
  } else if(chance(50)){
    m.heat = clamp(m.heat+25,0,100);
    log(`"Nobody just walks away." They made sure you understood that.`,'bad');
  } else {
    die('trying to leave the family');
  }
  closePanel(); render();
}

function tickMafiaRiskP33(){
  const m = state.mafia; if(!m || state.inPrison) return;
  const hitChance = (m.rank>=2 ? m.heat*0.15 : m.heat*0.05);
  if(chance(hitChance)){ die('a mob hit ordered by a rival family'); return; }
  const arrestChance = m.heat*0.35;
  if(chance(arrestChance)){
    state.inPrison = true; state.prisonYearsLeft = rand(5,20); state.prisonRep = 0;
    m.heat = clamp(m.heat-40,0,100);
    log(`The feds finally caught up with you. RICO charges — ${state.prisonYearsLeft} years.`,'bad');
    newspaper(`MOB FIGURE INDICTED IN SWEEPING RICO CASE`, `Federal prosecutors say the case could take down much of ${m.family}.`, 'Underworld Desk');
  }
}

   P40 — Stock Market: a second investment system alongside crypto, but
   calmer (lower volatility) and company-flavored, with rare market-wide
   crash/boom events that move every stock at once.
   --------------------------------------------------------------------- */
const STOCKS_P40 = [
  {sym:'TCHX', name:'Techora Inc.'},
  {sym:'GRLD', name:'Global Retail Ltd.'},
  {sym:'ENRG', name:'Enrique Energy'},
  {sym:'MEDX', name:'MedixCorp'},
  {sym:'AERO', name:'AeroDyne Systems'},
];
const STOCK_PRICES_P40 = {TCHX:120, GRLD:65, ENRG:45, MEDX:90, AERO:200};
Object.assign(ACHIEVEMENTS, { investor_ach:'Held $50,000 in stocks' });
function tickStockPricesP40(){
  for(const sym in STOCK_PRICES_P40){
    STOCK_PRICES_P40[sym] = Math.max(1, STOCK_PRICES_P40[sym]*(1+(Math.random()*2-1)*0.08));
  }
  if(chance(4)){
    for(const sym in STOCK_PRICES_P40) STOCK_PRICES_P40[sym] = Math.max(1, STOCK_PRICES_P40[sym]*(0.6+Math.random()*0.15));
    newspaper('MARKET PLUNGES IN SUDDEN CRASH', 'Investors watch billions evaporate in a single session.', 'Business Desk');
  } else if(chance(4)){
    for(const sym in STOCK_PRICES_P40) STOCK_PRICES_P40[sym] *= (1.2+Math.random()*0.2);
    newspaper('MARKETS SURGE TO RECORD HIGHS', 'A broad rally lifts stocks across every sector.', 'Business Desk');
  }
}
function stockPortfolioValueP40(){
  if(!state.stocks) return 0;
  let v = 0;
  for(const sym in state.stocks) v += (state.stocks[sym]||0)*STOCK_PRICES_P40[sym];
  return v;
}
function buyStockP40(sym){
  const amt = 1000;
  if(state.money<amt){ log(`Not enough cash to buy ${sym} shares.`,'bad'); closePanel(); render(); return; }
  state.money -= amt;
  if(!state.stocks) state.stocks = {};
  state.stocks[sym] = (state.stocks[sym]||0) + amt/STOCK_PRICES_P40[sym];
  log(`You bought ${fmtMoney(amt)} of ${sym} stock.`,'neutral');
  openStockPanelP40();
}
function sellStockP40(sym){
  const shares = (state.stocks && state.stocks[sym]) || 0;
  const value = shares*STOCK_PRICES_P40[sym];
  state.money += value;
  if(!state.stocks) state.stocks = {};
  state.stocks[sym] = 0;
  log(`You sold all your ${sym} shares for ${fmtMoney(value)}.`,'neutral');
  openStockPanelP40();
}
function openStockPanelP40(){
  if(!state.stocks) state.stocks = {};
  let html = '';
  STOCKS_P40.forEach(s=>{
    const held = state.stocks[s.sym]||0;
    html += `<div class="list-item"><div class="li-main"><b>${s.sym}</b><span>${s.name} · ${fmtMoney(STOCK_PRICES_P40[s.sym])}/share · Holding: ${held.toFixed(2)}</span></div>
      <div class="row"><button class="btn" onclick='buyStockP40(${JSON.stringify(s.sym)})'>Buy $1,000</button><button class="btn" onclick='sellStockP40(${JSON.stringify(s.sym)})'>Sell All</button></div></div>`;
  });
  openPanel('Stock Market', html);
}

  render();
};

/* ---------------------------------------------------------------------
   P52 — Family wealth tier: every character used to start from an
   identical blank slate (always $0, no variation in circumstances).
   Now a weighted family background at birth nudges starting stats and,
   for the rare Elite tier, sets up a trust fund that matures at 18.
   --------------------------------------------------------------------- */
const FAMILY_WEALTH_TIERS_P52 = [
  {name:'Poor', weight:15, statMod:{health:-5, looks:-3, smarts:-2}, flavor:'Money was always tight growing up.'},
  {name:'Working Class', weight:30, statMod:{health:-2, looks:0, smarts:0}, flavor:'Your family got by, paycheck to paycheck.'},
  {name:'Middle Class', weight:35, statMod:{health:0, looks:0, smarts:0}, flavor:'A pretty ordinary upbringing, all things considered.'},
  {name:'Wealthy', weight:15, statMod:{health:3, looks:4, smarts:3}, flavor:'You grew up comfortable, never wanting for much.'},
  {name:'Elite', weight:5, statMod:{health:5, looks:6, smarts:5}, flavor:'Private schools, household staff — you were born into serious money.'},
];
Object.assign(ACHIEVEMENTS, { trust_fund_ach:'Came into your trust fund' });
function pickWeightedP52(pool){
  const total = pool.reduce((sum,p)=>sum+p.weight,0);
  let r = Math.random()*total;
  for(const p of pool){ if(r<p.weight) return p; r-=p.weight; }
  return pool[pool.length-1];
}
function assignFamilyWealthP52(){
  const tier = pickWeightedP52(FAMILY_WEALTH_TIERS_P52);
  state.flags.familyWealthTier = tier.name;
  state.stats.health = clamp(state.stats.health+tier.statMod.health,0,100);
  state.stats.looks = clamp(state.stats.looks+tier.statMod.looks,0,100);
  state.stats.smarts = clamp(state.stats.smarts+tier.statMod.smarts,0,100);
  if(tier.name==='Elite') state.flags.trustFundEligible = true;
  log(tier.flavor,'neutral',0);
}

/* ---------------------------------------------------------------------
   P57 — Relationship mortality: every relationship has aged a year on
   every ageUp since the base game shipped, but none of them — parents,
   spouse, siblings, grandparents, anyone — ever actually died of
   natural causes. They'd just keep aging past 100, 110, 120 forever.
   This gives every living relationship an age-scaled yearly death
   chance, same shape as the player's own checkDeath().
   --------------------------------------------------------------------- */
const RELATIONSHIP_DEATH_CAUSES_P57 = ['old age','a long illness','a sudden heart attack','peacefully in their sleep','a car accident','complications from a fall'];
function relationshipDeathChanceP57(age){
  let c = 0.15;
  if(age>70) c += (age-70)*0.6;
  if(age>90) c += 8;
  if(age>100) c += 15;
  return c;
}
function tickRelationshipDeathsP57(){
  state.relationships.forEach(r=>{
    if(!r.alive) return;
    if(!chance(relationshipDeathChanceP57(r.age))) return;
    r.alive = false;
    const cause = pick(RELATIONSHIP_DEATH_CAUSES_P57);
    log(`💔 ${r.name} (${relLabel(r.type)}) passed away, ${cause}, at age ${r.age}.`,'bad');
    state.stats.happiness = clamp(state.stats.happiness-rand(3,12),0,100);
    if(r.type==='spouse'){
      state.spouseId = null;
      newspaper(`${state.name.toUpperCase()} LOSES BELOVED SPOUSE`, `${r.name} is remembered fondly by family and friends.`);
    }
    if(r.type==='parent' && typeof handleParentInheritanceP75==='function'){
      handleParentInheritanceP75(r);
    }
  });
}
const _origAgeUp_P57 = ageUp;
ageUp = function(){
  _origAgeUp_P57();
  if(!state || !state.alive) return;
  tickRelationshipDeathsP57();
  render();
};
